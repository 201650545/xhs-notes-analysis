"删除判据4（公开旅行攻略，可检索可替代，与主线无关，也不属于判据 4 的隐性生活程序知识）＋删除判据2（要花钱且落地链路长）", "what": "呼伦贝尔 6 日盲盒旅行 Vlog，逐天路线、景点、美食与本地向导安排。", "use": "完整攻略：海拉尔-大兴安岭-室韦-额尔古纳河-黑山头-186 彩带河-呼伦湖-满洲里-巴虎蒙古部落；7 月中到 8 月中草最绿、6 月底错峰；昼夜温差大需冲锋衣、SPF50+ 防晒、驱蚊液带足；边防卡线可能临时封路、轿车通行风险高；直连本地向导避免旅行社转包。", "next": "最小下一步：收藏该笔记，并梳理呼伦贝尔6日行程路线与本地向导经验；复刻目标：不适用", "detail": "", "cost": "要花钱（交通、住宿、包车、向导）；价格与路况信息有时效。", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 全程盲盒旅行是种什么体验？\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6a32b3110000000015027c4a?xsec_token=ABoyQ4fqeoQ1Z73AXPNegtjrLC4bCHVRU4UPeDCU42h4I=&xsec_source=pc_user\n\n根据你引用的笔记，这是一期关于​​呼伦贝尔盲盒旅行​​的Vlog攻略。博主通过买盲盒车票的方式，在火车上被售票员“盲盒”分配到了呼伦贝尔，随后在当地向导的带领下完成了6天的草原边境之旅。\n\n下面为你完整梳理笔记中的核心信息：\n\n一、内容定位\n​​领域​​：旅行攻略 / 旅行Vlog\n​​作者身份​​：旅行博主\n​​核心目的​​：记录一次\"盲盒旅行\"的完整体验，分享呼伦贝尔6日游的真实路线、景点、美食与本地向导服务，为想去呼伦贝尔的观众提供参考。\n二、内容详细讲解（按视频顺序）\n\n​​Day 1：盲盒出发，抵达海拉尔​​\n\n博主在火车站买盲盒车票，被售票员\"分配\"到​​呼伦贝尔​​。\n乘坐普通火车上铺，睡一晚抵达呼伦贝尔。\n早上4点多天亮，成功抵达后，在售票员建议下找了本地向导（视频中称为\"193大哥\"）。\n向导带博主吃当地早餐，推荐了当地包子与茶。\n入住向导在海拉尔订的酒店，环境不错。\n中午去向导家吃饭，饮料种类丰富，当地用餐发刀具而非筷子，向导演示了刀具用法。\n\n​​Day 2：喂驯鹿、森林小火车、室韦边境村​​\n\n去喂​​驯鹿​​和​​梅花鹿​​，近距离接触鹿群，感觉鹿\"能坐着就不站着\"，非常可爱。\n乘坐​​森林小火车​​穿行​​大兴安岭​​深处，下车后仿佛走进\"绿野仙踪\"，空气有松脂和泥土味。\n抵达中俄边境小村落​​室韦​​，当地是少数民族俄罗斯族，房子多为木质结构。\n入住室韦民宿，风格梦幻。\n晚上体验当地特色美食，用羊骨写字的招牌，还有俄餐（俄罗斯薯条、肉饼、小面包）。\n\n​​Day 3：额尔古纳河界河游船、黑山头草原​​\n\n体验中俄边境的​​额尔古纳河​​界河游船，左手是中国室韦，右手是俄罗斯。\n前往少有人知的打卡点，躺在草地上非常安逸，吃到酸甜的山杏。\n抵达​​黑山头​​，进入呼伦贝尔草原深处。\n入住心心念念的​​蒙古包​​，体验当地住宿。\n晚上品尝草原美食，欣赏草原表演。\n\n​​Day 4：186彩带河、骑马、摩托车、呼伦湖​​\n\n前往​​186彩带河​​（跨国湿地），蓝色和绿色混合，像从太空看地球。\n体验草原滑草，非常刺激。\n体验草原骑马，向导教了骑马技巧（往右拐往右边掰，往左往左边掰，往上拉）。\n体验草原摩托车。\n来到号称\"草原上的大海\"的​​呼伦湖​​，湖水干净湛蓝，在湖边吹风非常安逸。\n\n​​Day 5：满洲里套娃酒店、涮羊肉​​\n\n抵达​​满洲里​​，打卡本地特色建筑​​套娃酒店​​，内部像穿越到另一个世界。\n满洲里属于中俄边境，从这里过去对面就是俄罗斯。\n晚上吃本地涮羊肉，最正宗的老式铜锅炭锅。\n\n​​Day 6：巴虎蒙古部落、羊肉串、草原日落​​\n\n打卡​​巴虎蒙古部落​​，看了万马奔腾的景象。\n中午吃本地特色羊肉串，博主评价\"巨好吃\"。\n离开前碰上草原日落，对着夕阳和草原喊出内心想说的话，留下祝福。\n博主给最初相遇的售票员留了礼物（牛肉干、沙果干），并录了视频寄回车站。\n三、核心知识点\n​​盲盒旅行方式​​：在火车站买\"最想去的城市\"盲盒车票，由售票员随机分配目的地，增加旅行趣味性和不确定性。\n​​本地向导的重要性​​：售票员建议找本地向导，不然容易迷路。博主通过网上找到本地向导\"193大哥\"，全程安排行程、订酒店、带吃美食，体验感很好。\n​​草原旅行注意事项​​：\n草原天亮很早，早上4点多就亮了。\n当地用餐习惯用刀具而非筷子。\n骑马需要听从向导指导，掌握正确技巧。\n草原日落非常美，是必打卡的体验。\n​​中俄边境体验​​：在室韦和额尔古纳河可以体验\"出国\"的感觉，左手中国、右手俄罗斯。\n​​美食推荐​​：当地包子、俄餐（薯条、肉饼、小面包）、羊肉串、老式铜锅涮羊肉、牛肉干、沙果干。\n四、视频中出现的提示词/操作文字\n\n视频中未出现AI提示词、搜索词或软件指令。\n\n五、实用信息清单\n​​行程天数​​：6天5晚\n​​核心路线​​：海拉尔 → 大兴安岭 → 室韦 → 额尔古纳河 → 黑山头 → 186彩带河 → 呼伦湖 → 满洲里 → 巴虎蒙古部落\n​​必体验项目​​：\n喂驯鹿和梅花鹿\n森林小火车穿行大兴安岭\n额尔古纳河界河游船\n住蒙古包\n草原骑马和摩托车\n186彩带河滑草\n满洲里套娃酒店打卡\n草原日落\n​​找本地向导建议​​：可以通过网络平台寻找，选择有口碑的本地向导，提前沟通行程安排和费用。\n​​交通方式​​：普通火车抵达呼伦贝尔，当地包车跟随向导出行。\n六、一句话总结最值得收藏的点\n\n​​盲盒车票+本地向导的呼伦贝尔6日游，从大兴安岭森林到中俄边境室韦，从蒙古包住宿到草原骑马滑草，一路吃遍俄餐和羊肉串，把草原、森林、湿地、边境一次性看够。​​\n\n补充一点，根据站内其他笔记的信息，呼伦贝尔旅游还有几个实用提醒：\n\n​​最佳时间​​：7月中到8月中草最绿，但也是暑假高峰期；错峰可选择6月底到7月初。\n​​穿搭建议​​：昼夜温差大，需备冲锋衣、厚外套、长裤；草原紫外线强，防晒霜SPF50+、墨镜、宽檐帽必备；蚊虫多，驱蚊液要带足。\n​​包车/向导选择​​：建议直连包车司机或本地向导，避免通过旅行社转包，防止中间商赚差价影响服务质量。\n​​卡线路况​​：边防卡线部分路段可能临时封路，出发前务必确认路况，轿车通行风险较高，越野车更稳妥。\n​​保湿防晒​​：草原空气干、风大，润唇膏、护手霜、保湿喷雾随身带。\n\n如果你打算去呼伦贝尔，可以告诉我你大概计划玩几天、预算多少，我帮你进一步细化路线和住宿建议。"}, {"idx": 11, "id": "6ac608ab0000000014000c67", "title": "还报啥辅导班，AI 教小学数学简直降维打击", "cat": "学习闭环", "sug": "keep", "reason": "保留判据3（知识图谱追溯薄弱点+AI 私教交互模式，直接关联他的教师身份与 AI+教育内容创作主线，产品参数部分可抠掉只留方法）。", "what": "火星熊（bearaut）AI 数学学伴的产品推广，顺带讲了 AI 私教方法论。", "use": "可留认知：按知识点依赖关系搭知识图谱、沿图谱追溯薄弱前提（如分数加法不会→查通分是否没掌握）做针对性补足；AI 私教相对小班课的优势是可随时打断、追问、拓展，不迁就他人进度；评论区点破「课本直接喂 AI 也能讲清楚，产品化才是关键」。", "next": "最小下一步：搜索 \"bearnaut\" 或 \"火星熊\" 了解该工具；复刻目标：不适用", "detail": "", "cost": "本质是付费产品软文；700 知识点/2700 例题/五国大纲等产品参数会过时，工具本身要付费。", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 还报啥辅导班，AI 教小学数学简直降维打击\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6ac608ab0000000014000c67?xsec_token=ABKoYsHtsIGq7InSbl2Irxrdll_WfJafvpc32vHATaAfM=&xsec_source=pc_user\n\n根据你引用的笔记，以下是完整的信息整理：\n\n一、内容定位\n​​领域​​：教育科技 / AI 辅导 / 小学数学\n​​作者身份​​：火星熊（bearnaut）产品团队\n​​核心目的​​：向家长推荐一款面向小学数学的 AI 学伴，强调 AI 私教相比传统辅导班的优势，展示产品功能与学习路径。\n二、内容详细讲解\n\n笔记视频按以下逻辑展开：\n\n​​引入对比​​：先对比一对一私教与小班课，指出私教的优势是\"老师的时间和注意力 100% 属于你\"，不用迁就全班进度。\n​​AI 作为私教​​：提出\"你手上的 AI 就是最好的私教老师\"——孩子讲到一半没听懂可以直接打断，让 AI 慢一点；听懂了后可以连续追问、拓展。\n​​知识图谱概念​​：介绍在英美流行的知识图谱方法，把知识点按依赖关系搭成一张网。例如孩子不会做分数加法，可以沿图谱往前追溯，找到是\"通分没学会\"还是\"对分数本身没理解\"，从而针对性补足。\n​​火星熊产品介绍​​：\n基于中、新、美、英、澳五个国家的数学大纲，整理成一张数学学习地图，覆盖从学前到小学六年级。\n包含 ​​700 多个知识点​​，配套 ​​2700 道例题​​，每道都有分步讲解，由联合头部教学机构老师一道一道挑选。\n针对每个知识点，学习流程为：​​先讲概念​​（结合可视化方案方便理解） → ​​手把手带讲精选例题​​ → ​​闯关游戏​​（挑战成功后点亮星星）。\n全程接入​​实时语音对话​​，孩子的疑问都能得到耐心解答。\n​​核心优势强调​​：火星熊基于前沿大模型，能力远超绝大多数老师，甚至能处理准黎曼猜想、四维桂谷猜想等人类百年难题，做小学数学学伴完全足够。\n​​结尾号召​​：称这是\"教育平权\"，邀请大家尝试火星熊数学学伴。\n三、核心知识点\n​​知识图谱的价值​​：不是孤立学知识点，而是按依赖关系形成网络，方便定位薄弱环节、追溯根源。\n​​AI 私教的核心体验​​：随时打断、追问、拓展，不迁就他人进度，这是传统小班课无法做到的。\n​​产品化关键​​：评论区有人提到\"课本直接放 AI 也能讲清楚\"，但作者强调\"产品化很重要\"——把大纲、例题、讲解、闯关、语音对话整合成一个系统，才是真正可用的学习工具。\n​​学习进度可视化​​：评论区补充说明，知识图谱中\"已经学过的知识点会变亮\"，方便家长和孩子查看学了多少、还剩多少。\n四、视频中出现的提示词/操作文字\n\n视频中未出现具体的提示词或搜索词输入演示，仅展示了图片中的算式：\n\n​​8+3=11​​\n​​7+4=？​​\n五、实用信息清单\n​​产品名称​​：火星熊（bearnaut）\n​​搜索方式​​：谷歌搜索 ​​bearnaut​​ 即可访问\n​​覆盖范围​​：学前到小学六年级\n​​知识点数量​​：700 多个\n​​例题数量​​：2700 道\n​​大纲来源​​：中、新、美、英、澳五国数学大纲\n​​核心功能​​：\n知识图谱学习地图\n实时语音对话\n概念讲解 + 可视化方案\n精选例题分步讲解\n闯关游戏与星星点亮机制\n六、一句话总结最值得收藏的点\n\n把知识点按依赖关系搭成知识图谱，配合实时语音对话的 AI 私教，让孩子随时打断、追问、追溯薄弱点，这才是 AI 时代小学数学辅导的真正优势。\n\n​​补充说明​​：以上信息均来自你引用的笔记原文及评论区。如需了解火星熊的具体价格、适用设备或下载方式，建议直接在谷歌搜索 ​​bearnaut​​ 访问其官网查看。"}, {"idx": 12, "id": "6a36ae9d000000001003c562", "title": "HermesAgent再无token限制、零token使用", "cat": "学习闭环", "sug": "drop", "reason": "删除判据5（评论区自己都提醒封号风险）＋删除判据2（要重折腾环境、命令行部署与代理链路）；Flask 中间层这点可迁移价值被上面的封号与不稳定性抵消", "what": "用 Flask 中间层把网页大模型转成 API、挂中转网关，让 HermesAgent 零 token 无限调用工具的教程。", "use": "步骤：启动网页大模型转 API 工具 → 终端跑脚本接入中转网关并重启 → 新窗口启动 Hermes → 问「你是谁」验证 → 报 HTTP 500 就开客户端代理 → 用 base URL 确认走本地网关 → 下发查看/新建文件指令验证工具调用。", "next": "最小下一步：搜索并确认该笔记提到的\"网页大模型转API\"脚本或工具的开源地址；复刻目标：不适用（方案存在封号与稳定性风险，不建议直接用于生产环境）", "detail": "", "cost": "评论区明确警告「特征太明显、容易被识别并封号」；要重折腾环境（Flask 中间层+代理+中转网关+终端脚本）；网页端与 API 的 toolcall 特征差异导致不稳定；完整指南还要去评论区留言领取；本质仍是调模型，token 只是被转移。", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# HermesAgent再无token限制、零token使用\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6a36ae9d000000001003c562?xsec_token=AB1XqgRkAPu_ZUBeJ-bEwJtpCQTcSVrOxnv6e5qlTA84M=&xsec_source=pc_user\n\n根据你引用的笔记，我为你完整整理了这条关于 HermesAgent 零 token 使用教程的核心内容。\n\n一、内容定位\n​​领域​​：AI 工具开发 / 大模型应用 / 开发者技术\n​​作者身份​​：AI 开发者 / 技术博主\n​​核心目标​​：教会观众如何通过 Flask 中间层将网页大模型转换为 API，实现 HermesAgent 的零 token 使用和无限工具调用。\n二、内容详细讲解\n核心原理\n\n当把网页大模型转化为 API 后，以前通过提示词注入的方式让它具备调用能力，但这种方式不够稳定。因此需要在客户端和 Hermes 之间加一个 ​​Flask 中间层​​，通过中间层处理数据，让大模型能够读懂，同时加入流式处理，使其在多人对话中依然能够执行任务。\n\n实操步骤\n​​打开网页大模型转 API 工具​​：启动转换工具界面。\n​​终端执行脚本命令​​：在终端中执行脚本，将 Hermes 接入中转网关，并重启中转网关。作者将所有操作都封装成了脚本，避免手动操作出错。\n​​启动 Hermes​​：新开一个窗口，启动 Hermes。\n​​验证连接​​：先问\"你是谁\"，确认是否已切换到网页大模型的中转网关。\n​​排查问题​​：若遇到 ​​HTTP 500 - API 网关无响应​​ 报错，检查客户端代理是否打开。打开代理后重新刷新再问。\n​​验证本地网关​​：通过 ​​base URL​​ 确认使用的是本地网关的 API，而非通用 API，证明没有消耗 token。\n​​调用本地工具查看文件​​：下发指令让 Hermes 调用本地工具查看指定文件夹下的文件。\n​​调用工具新建文件​​：让 Hermes 在文件夹下新建一个名为 ​​Zero Token Hermes​​ 的文件。\n​​串联语义理解与工具调用​​：让 Hermes 总结该方法的经验，生成 ​​md​​ 文件并保存到指定文件夹中，验证文件是否成功创建。\n三、核心知识点\n​​关键结论​​：通过 Flask 中间层将网页大模型转为 API，可以实现零 token 使用 HermesAgent，并支持无限调用工具。\n​​容易搞错的要点​​：\n必须打开客户端代理，否则会报 ​​HTTP 500 - API 网关无响应​​。\n通过 ​​base URL​​ 可以验证是否真正使用了本地网关转换的 API。\n​​作者经验与小贴士​​：\n所有操作都封装成了脚本，避免手动操作出错。\n完整指南已整理好，评论区留言可获取。\n网页端转换不消耗任何 token。\n四、视频中出现的提示词与操作文字\n​​验证问题​​：\"你是谁\"\n​​工具调用指令​​：查看指定文件夹下的文件、在文件夹下新建文件、总结方法经验并生成 md 文件\n​​报错信息​​：​​HTTP 500 - 500 API 网关无响应​​\n​​文件名称​​：​​Zero Token Hermes​​\n​​脚本命令​​：在终端执行接入中转网关的脚本命令（具体命令内容笔记未完整展示）\n​​验证方式​​：通过 ​​base URL​​ 确认使用的是本地网关 API\n五、实用信息清单\n​​工具名称​​：HermesAgent、网页大模型转 API 工具、Flask 中间层、中转网关\n​​涉及技术​​：Flask、API 网关、流式处理、工具调用\n​​适用场景​​：本地开发、多人对话、文件操作、自动化任务\n​​获取完整指南​​：在评论区留言获取作者整理的完整操作指南\n六、评论区补充信息\n​​关于 token 的疑问​​：有用户指出最终还是会调用大模型，只要调用就会有 token 产生，除非本地部署 LLM。\n​​关于稳定性​​：有开发者提到实际开发中多模型混合调用和长上下文的稳定性仍是关键，建议使用 infistar.ai 这类模型聚合平台做路由和调用记录查验。\n​​关于封号风险​​：有用户提醒这种方案特征太明显，容易被识别并封号。\n​​关于其他模型​​：有用户询问是否支持 GLM 网页端等其他模型。\n​​关于协议差异​​：有用户指出网页端和 API 调用在特征上存在差异（如 toolcall 是工具独有的），很难完全模拟。\n七、一句话总结\n\n通过 Flask 中间层将网页大模型转为 API 并接入中转网关，是实现 HermesAgent 零 token 使用和无限工具调用的核心方案，但需注意代理配置、封号风险及网页端协议模拟的稳定性问题。\n\n如果你需要进一步了解 HermesAgent 的官方部署方式或网页大模型转 API 的具体实现细节，可以告诉我，我来帮你补充。"}, {"idx": 13, "id": "6aae5cbe000000002802ff7f", "title": "小白第一次手搓AI漫剧，成本1715元，到底能赚多少钱？ 我替大家试了试，IP版", "cat": "新产", "sug": "keep", "reason": "保留判据3（AI 漫剧从 IP 申请到平台分账的全流程与抽卡/省 token/过审避坑是可迁移的创作方法论，直接服务他 AI 内容创作与运营主线；成本结论本身已计入 pitfall）。", "what": "小白 1 人 9 天手搓 20 分钟 3D AI 漫剧的全流程复盘，成本 1715 元、上线 5 天热度值 1360 万。", "use": "全链路：番茄小说版权专区申请 IP（实际 1-2 小时过审）→LaperAI 生成剧本与人物资产→奥利鸟+Seedance2.0 逐镜抽卡（提示词结尾加“不要加字幕”让剪辑时自己加）→剪映合成→红果创作者中心上传（需承诺函+工程文件）；方法论：先做二卡三卡找手感再升一卡、先粗剪再补抽卡省 token、避开萌娃题材（未成年审核极严）。", "next": "", "detail": "", "cost": "要真金白银 1700-2500 元 token 费；审核极严改了 6 次、重抽卡又花约 500 元；热度≠播放（1360 万热度可能只对应十几万播放，万播约 5-10 元，大概率回不了本）；收益要等下月账单；配音一致性难，建议真人配音。", "quote": "", "quote_src": "", "text": "# v3-分区版 v3（回溯）\n# 小白第一次手搓AI漫剧，成本1715元，到底能赚多少钱？ 我替大家试了试，IP版\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6aae5cbe000000002802ff7f?xsec_token=ABPKgWqE6J3eSmh17JJRbvyrw6Qk4gNpYk8u_9oJdvq_k=&xsec_source=pc_user\n\n根据你引用的笔记，我为你做了一次可照抄级的深度拆解。\n\n一、项目定位\n​​做了什么​​：AI漫剧（3D Max风格），将小说改编为视频漫剧。\n​​成品时长​​：20分钟（首次上传的最低要求）。\n​​发布平台​​：红果短剧创作者中心（因IP版权属于番茄，只能上传至该后台）。\n​​热度表现​​：上线5天，最高热度值1360万（注意是热度值，非播放量）。\n二、素材与想法\n​​题材​​：女主穿越成公主萌娃，靠好心声揭露父亲被戴绿帽子的故事（1.7万字短篇，评分9.2）。\n​​风格​​：3D Max风格漫剧。\n​​受众​​：短剧平台用户，偏女性向、萌娃、穿越题材。\n​​素材来源​​：\n​​剧本​​：从番茄小说IP版权库申请改编，用 LaperAI 将小说生成剧本。\n​​画面​​：用 奥利奥 生图和生视频，模型选 Seedance2.0。\n​​配音​​：笔记未提及具体配音工具，作者提到\"人物声音保持一致比较难，有条件可以去配音\"。\n​​核心创意​​：用AI低成本试水漫剧全流程，验证\"AI漫剧不赚钱\"的说法。\n​​选题材建议​​：作者不推荐选\"萌娃\"题材，因为涉及未成年人审核极严；建议选近期火、容易过审的题材。\n三、制作流程\n​​第1步：申请IP版权​​\n打开番茄后台版权专区，申请IP题材（支持2D漫、3D漫、仿真人表情包漫，不支持解说漫）。\n官方说3个工作日，实际1-2小时就通过了。\n​​第2步：生剧本和人物资产​​（1天）\n用 LaperAI 从小说生成剧本，不满意再自己改。\n生成人物资产（角色设定）。\n​​第3步：抽卡生成画面​​（6天）\n用奥利奥 + Seedance2.0 一个镜头一个镜头抽卡。\n​​经验建议​​：先做二卡、三卡，找到手感后再升一卡（第一集），否则第一集可能废掉。\n​​抽卡技巧​​：在提示词结尾加上\"不要加字幕\"，因为模型生成的字幕问题很大，剪辑时自己加更好。\n​​省Token技巧​​：先按剧本粗略生成一遍，剪辑时看缺哪些镜头再补抽卡。\n​​第4步：剪辑合成​​（2天）\n用 剪映 把镜头拼在一起，补抽卡、加字幕、配音。\n​​第5步：发行上传​​\n打开红果短剧创作者中心后台，上传漫剧。\n填写成本配置情况模板和不侵权承诺函（打印签字盖章）。\n权属文件：后台签的合同；工程文件：剪映截图。\n​​要求​​：单集不低于30秒，首次上传不低于20分钟。建议做长一点（100-120分钟以上），拆多集，分账更高。\n​​第6步：审核修改​​\n审核非常严格，作者改了6次剧壳，和客服沟通5天才上线。\n涉及未成年人的内容审核更严，约500元成本是审核问题重新修改、抽卡产生的。\n四、AI与工具清单\n工具\t负责环节\t费用\t备注\n番茄小说版权专区\tIP版权申请\t免费（分成模式）\t1-2小时审核通过\nLaperAI\t剧本生成\t笔记未提及\t从小说生成剧本\n奥利奥\t生图 + 生视频\t1714元（Token费）\t用 Seedance2.0 模型，按秒计费\n剪映\t剪辑合成\t笔记未提及\t加字幕、拼接镜头\n打印机\t打印承诺函\t1元\t签字盖章用\n​​总成本​​：1715元（1714元Token + 1元打印）。\n​​实际成本​​：作者有7000多积分是合作送的，换算成人民币约2500元。\n​​时间​​：9天（1天剧本+资产，6天抽卡，2天剪辑+补抽卡）。\n​​人数​​：1人纯手搓。\n五、成本与收益\n​​投入​​：1715元、9天、1人。\n​​产出​​：20分钟AI漫剧，上线5天最高热度值1360万。\n​​收益​​：​​笔记未提及具体金额​​，作者说\"等下个月出账单再来汇报\"。\n​​变现路径​​：平台分账（上传至红果短剧创作者中心，按播放/热度分账）。\n​​评论区补充​​：有评论说1000多万热度对应的播放量可能只有十几万，万播收益约5-10元，大概率赚不回1700块。\n六、视频中出现的提示词\n\n视频中​​未出现​​具体提示词原文。作者只提到一个技巧：在抽卡提示词结尾加上\"不要加字幕\"，避免模型生成错误字幕。\n\n七、链接与复现\n​​GitHub/模板/教程链接​​：笔记​​未提供​​。\n​​新手最简步骤​​：\n去番茄小说后台申请IP版权（1-2小时通过）。\n选一本字数少、评分高、容易过审的小说（避开萌娃、血腥暴力、仿真人肖像）。\n用 LaperAI 生成剧本。\n用奥利奥 + Seedance2.0 抽卡生成画面和视频。\n用剪映剪辑、加字幕、配音。\n上传至红果短剧创作者中心，填模板、签承诺函。\n等审核、等账单。\n​​启动成本​​：约1700-2500元（主要花在Token上）。\n​​风险坑​​：\n​​审核极严​​：涉及未成年人、血腥暴力、仿真人肖像都会被打回，修改成本高（作者花了约500元重新抽卡）。\n​​热度≠播放量​​：1360万热度可能只对应十几万播放，收益有限。\n​​角色一致性难保持​​：人物声音最难保持一致，建议用真人配音。\n​​极端情况上线不了​​：人力算力可能打水漂。\n八、一句话总结最该记住的点\n\n​​先做二卡三卡找手感，再升一卡；避开萌娃、血腥、仿真人肖像，否则审核成本会吃掉你一半预算。​​"}, {"idx": 14, "id": "6a70675500000000050317c2", "title": "停更三年，归来考上清华！😎", "cat": "学习闭环", "sug": "drop", "reason": "删除判据4（与主线无关的个人成功学叙事，保留判据4明确排除鸡汤情绪价值）+ 删除判据6（承诺的经验分享尚未发布，当下无可吸收内容）。", "what": "清华新生的录取通知书开箱+高中逆袭经历+预告今后要发各科学习经验。", "use": "目前只有「删掉所有社交软件、高强度学习」的个人叙事，承诺的干货尚未发布。", "next": "最小下一步：收藏该笔记并关注博主，等待后续学习经验分享更新；复刻目标：不适用", "detail": "", "cost": "无", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 停更三年，归来考上清华！😎\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6a70675500000000050317c2?xsec_token=ABUq_DptXr3JfqFfUCDi_8KjtQj9utNoAoHUEoBPcpX8c=&xsec_source=pc_user\n\n根据你引用的笔记，我帮你把这条\"停更三年考上清华\"的内容完整梳理出来了。\n\n一、内容定位\n​​领域​​：学习成长 / 高考备考 / 校园生活\n​​作者身份​​：清华大学2026级汉语言文学专业新生，高中曾参加数学竞赛，高中时期断更社交平台三年\n​​想教会观众什么​​：分享高中三年亲身实践有效的各科学习经验，以及未来持续更新清华校园生活\n二、内容详细讲解\n\n笔记以\"录取通知书开箱\"为主线，按时间线回顾了作者的高中三年经历：\n\n​​高一​​：空余时间相对较多，出于兴趣参加了​​数学竞赛​​。竞赛生没有假期，状态是\"不是上课就是在做题\"。\n​​高二​​：选科后竞争压力直线上升。为了全身心投入学习，作者​​删掉了所有的社交软件（包括小红书）​​。这一年成绩突飞猛进，从​​年排400逆袭到年级第2​​。\n​​高三​​：上学期有首考，下学期就是高考。每天从早到晚泡在学校里，学校周六下午放假，但作者仍会待到​​晚上十点钟甚至近十一点​​才走。\n​​结果​​：夏天付出有了回响，被​​清华大学汉语言文学专业​​录取。\n​​后续计划​​：从明天起开始密集发布各科学习经验分享（亲身实践有效、包细致包干货），开学后持续更新清华校园生活。\n三、核心知识点\n​​关键结论​​：断舍离社交软件、全身心投入学习，可以在高二实现成绩大幅逆袭（年排400→年级第2）。\n​​容易搞错的要点​​：作者提到\"竞赛生是没有假期的\"，说明走竞赛路线需要付出极大时间成本，并非适合所有人。\n​​作者的个人经验和小贴士​​：\n删掉所有社交软件，减少干扰，专注学习。\n高三保持高强度学习节奏，周六也不完全放松，学到晚上十点到十一点。\n亲身实践过的方法才分享，强调\"包细致包干货\"。\n四、视频中出现的提示词/操作文字\n\n笔记中未提供视频口播和字幕内容，仅基于正文和图片OCR整理。图片OCR中出现的文字包括：\n\n​​EMS® 全球邮政特快专递 WORLDWIDE EXPRESS MAIL SERVICE​​\n​​清华大学 TSINGHUA UNIVERSITY 录取通知书​​\n​​清华大学招生办公室​​\n​​新生入学须知 | 2026 FRESHMEN GUIDELINES​​\n​​祝贺你圆梦清华！愿你在清华，成为更好的自己！​​\n​​汉语言文学专业​​\n​​中国银行 BANK OF CHINA​​\n​​北区院服务 电话:010-62770​​\n五、实用信息清单\n\n笔记中未提供可直接套用的清单、表格或口诀，但评论区有读者提出了几个值得博主后续深入回答的问题，也可以作为其他备考同学的参考方向：\n\n删掉所有社交软件包括哪些？中间会下回来吗？想要了解的资讯是直接舍弃吗？\n高中三年的精神支柱是什么？有什么爱好？如何做到\"极度痴迷学习\"？\n长时间高强度学习过程中心态如何保持？遇到困难如何处理？\n假期也是这样学习还是会安排休息？寒暑假会出去旅游吗？回老家时如何专注学习？\n六、一句话总结最值得收藏的点\n\n​​高二删掉所有社交软件、全身心投入学习，实现年排400到年级第2的逆袭，最终考上清华大学汉语言文学专业。​​\n\n补充一点：评论区有人问\"打数竞怎么录取去了汉语言文学\"，这个问题博主目前还没在笔记里回应，后续经验分享中可能会提到。"}, {"idx": 15, "id": "6a3c9d3f000000001603e461", "title": "柏林男子四重唱German Gents翻唱康定情歌", "cat": "学习闭环", "sug": "drop", "reason": "删除判据4（音乐赏析加感受抒发，与主线无关，也不是判据 4 的隐性生活规则；那个对外汉语概念是公开显性学科知识，判据 4 明确不算）＋删除判据1（巡演排期属会过时的情报）", "what": "German Gents 四重唱翻唱《康定情歌》的赏析，附一个对外汉语学科概念和巡演排期。", "use": "一个知识点：对外汉语的「外」也涵盖母语非中文的少数民族同胞；另有 German Gents 2026 年 7-8 月国内八城巡演日程。", "next": "最小下一步：搜索\"对外汉语 外 少数民族\"验证该概念；复刻目标：不适用", "detail": "", "cost": "有时效（巡演排期与票务信息会过期）。", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 柏林男子四重唱German Gents翻唱康定情歌\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6a3c9d3f000000001603e461?xsec_token=ABj9HVx5OGw11LePC9-O29CeT0HQw-PTkGwJBvEDr8030=&xsec_source=pc_user\n\n根据你引用的笔记，以下是完整的信息整理：\n\n一、内容定位\n​​领域​​：音乐 / 语言学习 / 跨文化交流\n​​作者身份​​：中文学习者或对外汉语相关背景的观众，对音乐表演和语言学习有较深感悟\n​​想传达的核心​​：欣赏 柏林男子四重唱（German Gents）翻唱《康定情歌》的表演，强调他们对中文认真学习的态度带来的真挚感，并补充一个对外汉语的学科概念\n二、内容详细讲解\n\n笔记以评论形式展开，按以下逻辑推进：\n\n​​对表演咬字的评价​​：作者认为 German Gents 对中文这一\"不熟悉的语言\"付出了更多努力，认真咬字、认真对待学习中文的过程。即使发音可能显得\"丝丝笨拙\"，但这种认真的 articulation（发音/咬字）反而显得真挚。\n​​表演与情感的契合​​：这种真挚感完美契合了少数民族人民的质朴气质，让表演\"形神兼备\"——仿佛普通话不完全标准的藏族小伙子们在认真唱他们心爱的家乡和那里可爱的人们。\n​​超越地域的感动​​：加上《康定情歌》本身作为世界名曲的魅力，这个表演让作者感到\"超越民族和地域的感动\"。\n​​补充学科概念​​：作者从中文学习角度补充了一个知识点——\"对外汉语\"中的\"外\"，不仅仅指外国和外国人，也可以代指母语非中文的中国少数民族同胞。\n\n视频中的 ASR（语音识别）内容仅包含两句歌词：\n\n端端溜溜的照在，康定溜溜的城哟。月亮弯弯康定溜溜的城哟。\n\n三、核心知识点\n​​关键结论​​：对外汉语中的\"外\"不仅指外国人和外国，也可以指母语非中文的中国少数民族同胞。\n​​表演欣赏角度​​：对陌生语言的认真学习和咬字，即使不完美，也能因真挚感而打动人心，这种态度本身具有跨文化的感染力。\n​​个人感悟​​：作者认为这种和声表演有放松大脑的频率，甚至让人联想到\"求偶时唱歌\"的本能，说明音乐和和声具有深层的情感与生理共鸣。\n四、视频中出现的提示词/操作文字\n\n视频中未出现任何提示词、搜索词、软件指令或配方文本。\n\n五、实用信息清单\n\n从评论区补充的 German Gents 2026 年中国巡演信息：\n\n​​7月26日​​：北京音乐厅\n​​7月30日​​：上海东方艺术中心\n​​7月31日​​：无锡大剧院\n​​8月1日​​：中山市文化艺术中心\n​​8月2日​​：深圳滨海艺术中心\n​​8月4日​​：闽南大戏院\n​​8月7日​​：长沙音乐厅\n​​8月9日​​：乌鲁木齐音乐厅\n六、一句话总结最值得收藏的点\n\n对外汉语的\"外\"不仅指外国人，也包括母语非中文的中国少数民族同胞；而 German Gents 翻唱《康定情歌》时认真咬字的真挚态度，让这首世界名曲跨越了民族与地域的边界。"}, {"idx": 16, "id": "6ac3b3a200000000140395fd", "title": "去影视飓风分享了我的AI工作流！总结版", "cat": "复刻闭环", "sug": "keep", "reason": "保留判据3（「把一类操作流程固定为单一动作」的 Skill 方法论正是他正在用的工作流体系，口播视频加文字动效可直接服务于小红书视频制作）", "what": "作者在影视飓风分享的 Agent+Skill 工作流总结（已迭代 9 版）", "use": "Skill 四阶段：找现成 Skill→把自己反复做的经验打包成 Skill→让 Agent 知道何时用哪个并按序组装→批量化定时化；可落地案例：AI 新闻总结自动写入飞书、AI 眼镜 TVC 分镜生成、With Motion Skill 生成透明底文字动画配 FFmpeg 拼进口播视频（要求不打到人脸）、零代码写带视频网页", "next": "最小下一步：搜索笔记中提到的 Skill 框架与 MCP 工具，搭建本地测试环境；复刻目标：验证将日常重复操作打包为 Skill 后，能否减少与 AI 的重复沟通成本并提升工作流稳定性", "detail": "", "cost": "With Motion Skill 仓库链接未给，需自己搜开源仓库", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 去影视飓风分享了我的AI工作流！总结版\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6ac3b3a200000000140395fd?xsec_token=AB0wVe6tOM-nR2ezdu7rw36bh6h9k4949m7GM8LPpQSgA=&xsec_source=pc_user\n\n根据你引用的笔记，作者分享了在影视飓风线下分享的 ​​Agent + Skill​​ AI 工作流，核心思路是把 AI 从聊天框带入真实工作流。以下是完整整理：\n\n一、内容定位\n​​领域​​：AI 工具与工作流自动化\n​​作者身份​​：内容创作者（线下到影视飓风分享了这套工作流，并迭代了 9 个版本）\n​​想教会观众什么​​：如何用 Skill 把 AI 从聊天框带到自己的真实工作流中，让 Agent 自动执行复杂任务，最终把稳定工作流批量化、定时化，变成\"数字同事\"\n二、内容详细讲解\n\n​​核心概念（6 个）​​\n\n​​Agent​​：帮我们拆解任务，把任务发给不同的 Skill，然后利用这些 Skill 去完成。背后接的是大模型（如 Deepseek、GPT），负责理解意图。\n​​Skill​​：把一类工作流程打包成一个动作。不需要每次跟模型解释，只需要让模型执行这个 Skill 就行。就像手机里的 APP，你不需要知道底层怎么写，只需要知道拍照用相机、发消息用聊天工具。\n​​MCP​​：负责把本地 Agent 跟外界的系统工具连接起来，可以交换数据和获取服务。\n​​Rules​​：告诉 Agent 什么时候用哪一套 Skill。\n​​Codex APP​​：本地 Agent 的监管师，出现问题时负责排查、修复和重现问题。\n​​大模型​​：如 Deepseek、GPT，负责理解用户意图。\n\n​​Agent + Skill 的 4 个阶段​​\n\n​​第一阶段：找合适的 Skill​​——先找到适合你自己使用的 Skill，让 Agent 调用它们完成日常任务。\n​​第二阶段：把自己的经验打包成 Skill​​——在没有合适 Skill 的基础上，把自己反复做过的经验沉淀为 Skill，并分享给团队小伙伴。\n​​第三阶段：让 Agent 理解何时用哪个 Skill​​——告诉 Agent 什么时候用 Skill A、Skill B，或者按什么顺序把多个 Skill 组装成一整套工作流。\n​​第四阶段：批量化、定时化运行​​——把稳定的工作流定时运行起来，让它成为你的数字同事。\n\n​​真实案例 1：AI 新闻总结文档​​\n\n作者准备了一个提示语，作用是总结过去 24 小时值得关注的 AI 新闻，让 AI 根据阅读习惯写一份专属文档。过程如下：\n\nAgent 调用多个 Skill（检查安装的 Skill、检查过去 24 小时 AI 新闻精选）\n中间黄色阶段是模型的思考过程，可以观测任务执行到哪个阶段\nAgent 在执行中遇到需要确认的条件时，可以选择\"只通过这一次\"或\"整个对话都允许自由执行\"\n最终生成文档并写入 飞书，文档包含结论、筛选口径、数据来源等，并按阅读习惯排序\n\n​​真实案例 2：AI 眼镜品牌 TVC 视频生成​​\n\n用 Skill 生成 AI 眼镜的三视图、主视觉图、35 克数字雕塑等素材\n让 AI 分类图片，决定哪些作为视频帧\n输入任务描述（黑色背景 + 天平 + 羽毛 + 问号，第一人称视角拿下眼镜，放到天平上发现比羽毛还轻，最后浮现 Slogan）\nAgent 调用多模态能力看参考图，生成分镜和风格，输出成片\n最终效果：AI 生成的 TVC 视频只需后期微调即可用于品牌网页\n\n​​真实案例 3：用 With Motion Skill 给口播视频加文字动画​​\n\nWith Motion Skill 是一个开源框架，原本做过渡动画，作者发现可以生成透明背景\n用 FFmpeg 把文字动画和口播视频拼接在一起\n输入视频路径，告诉 AI 做文字动画，配合原视频的 ASR 识别产品特点\n要求：文字动画不要打到人脸、透明背景\n生成后对比原视频和加动画后的效果，即使不会剪辑也能做出中等偏上的口播视频\n\n​​真实案例 4：用 Agent + Skill 写带视频展示效果的网页​​\n\n没有任何代码能力的人，也可以通过 Agent + Skill 写出带视频展示效果的网页\n在熟悉的对话界面输入任务，调用 Skill 完成\n三、核心知识点\n​​Skill 的价值​​：把一类操作流程固定成一个动作，不需要每次跟模型解释，只需要让模型执行 Skill。\n​​Skill 不是技术部门专属​​：内容部门可以用 Skill 批量粗剪几百小时视频素材；视觉品牌可以生成视频海报和文案；产品部门可以在手机上完成市场调研；运营部门可以定时看用户情绪和复盘反馈；HR 可以用 Agent 分析 JD 候选人和面试题。\n​​终端界面和桌面端界面都适用​​：这套方法不局限于某一种界面。\n​​Agent 执行过程可观测​​：通过中间的思考过程，可以知道任务执行到哪个阶段；遇到需要确认的条件时，可以选择一次性允许或全程允许。\n​​Agent 能记住偏好​​：在生成文档时，Agent 会按照你的阅读习惯排序，记住你的筛选口径，这是它的优势。\n四、视频中出现的提示词/操作文字\n\n笔记中未出现完整的、可照抄的提示词原文，但提到了以下操作描述：\n\n总结过去 24 小时值得关注的 AI 新闻，让 AI 根据阅读习惯写专属文档\n让 AI 分类图片，决定哪些作为视频帧\n输入任务描述（黑色背景 + 天平 + 羽毛 + 问号，第一人称视角拿下眼镜放到天平上，发现比羽毛还轻，最后浮现 Slogan）\n用 With Motion Skill 做文字动画，配合原视频的 ASR 识别产品特点，要求文字动画不打到人脸、透明背景\n把视频路径放到输入框，告诉 AI 做文字动画\n五、实用信息清单\n​​工具/框架​​：Agent、Skill、MCP、Rules、Codex APP、Deepseek、GPT、FFmpeg、With Motion Skill、ASR\n​​适用场景​​：新闻总结、视频素材批量处理、TVC 视频生成、口播视频加文字动画、网页生成\n​​部署方式​​：终端界面和桌面端界面都适用\n​​协作方式​​：可以把 Skill 分享给团队所有小伙伴，组装成适合团队使用的工作流\n六、一句话总结最值得收藏的点\n\n​​把反复做过的经验沉淀为 Skill，让 Agent 自动调用、批量化定时化运行，最终变成你的\"数字同事\"，这才是把 AI 从聊天框带入真实工作流的终极思路。​​\n\n​​补充说明​​：笔记中提到的 With Motion Skill 是一个开源框架，评论区有用户询问是否开源。如果你需要进一步了解具体如何搭建和配置这些 Skill，可以搜索相关开源仓库或关注作者后续的详细教程分享。"}, {"idx": 17, "id": "6a5b2c3100000000040294c5", "title": "ppt形状运用，高级立体质感", "cat": "复刻闭环", "sug": "keep", "reason": "保留判据2（PPT 形状技法脱离软件版本不过时，是他的教学刚需工具，步骤具体可直接套用到课件与小红书封面制作）", "what": "PPT 用「合并形状-相交」抠图加「剪切板纹理填充」做高级立体质感的技巧教程", "use": "完整步骤：插入斜纹形状→拖黄点调宽→两次右旋移到右下角→Ctrl 先选图片再选形状→合并形状-相交抠出人物→原图置灰透明度 90→剪切板纹理填充→贴文案；解决图片拉伸变胖问题", "next": "最小下一步：打开PPT，按笔记步骤实操一次；复刻目标：验证\"合并形状相交抠图\"和\"剪切版纹理填充\"能否复现高端立体质感", "detail": "", "cost": "无（PPT 自带功能，零成本）", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# ppt形状运用，高级立体质感\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6a5b2c3100000000040294c5?xsec_token=ABypw_N6oTPIu8SF4PjpWNgYP3sjUaPJ3tCPJbDtfPAI8=&xsec_source=pc_user\n\n根据你引用的笔记，以下是完整细致的信息整理：\n\n一、内容定位\n​​领域​​：PPT 办公技巧 / 职场技能\n​​作者身份​​：笔记未提及（从话题标签看属于干货教学类博主）\n​​想教会观众什么​​：在 PPT 中运用形状创建高级立体质感的方法，解决图片拉伸变胖的问题，实现高端视觉效果。\n二、内容详细讲解\n\n按照视频操作顺序，完整步骤如下：\n\n​​插入斜纹形状​​：针对图片不够宽、拉伸就变胖的问题，插入斜纹形状。\n​​调整形状宽度​​：拖动黄点，调整宽度。\n​​旋转形状​​：点击两次向右旋转。\n​​移动位置​​：移到右下角。\n​​合并形状抠图​​：按 ​​Ctrl​​ 先选图片，再选形状，在\"合并形状\"中选择\"相交\"。\n​​抠出人物​​：抠出人物后，重叠摆放。\n​​再次插入原图​​：把原图再插入一次。\n​​设置颜色与透明度​​：点击颜色，改成灰色，透明度设为 ​​90​​。\n​​纹理填充​​：剪切点图片纹理填充，选择\"剪切版\"。\n​​粘贴文案​​：粘贴文案，完成最终效果。\n三、核心知识点\n​​关键结论​​：通过\"合并形状中的相交\"功能，可以把图片和形状结合，实现抠图效果；再利用\"剪切版\"纹理填充，能让形状呈现图片质感，做出高端立体的 PPT 效果。\n​​容易搞错的要点​​：合并形状时，​​必须先选图片，再选形状​​，顺序不能反。\n​​作者的个人经验和小贴士​​：笔记未提及具体经验，但结尾用\"麦克阿瑟表示如果早点认识橙子，也不至于连四星上将也没混上\"的梗来强调这个技巧的实用性和价值感。\n四、视频中出现的提示词/操作文字\n​​合并形状​​ → ​​相交​​（用于抠图）\n​​颜色​​ → ​​灰色​​，​​透明度 90​​\n​​剪切点图片纹理填充​​ → 选择 ​​剪切版​​\n视频中未出现其他提示词或搜索词。\n五、实用信息清单\n\n可直接复用的操作要点：\n\n​​解决图片拉伸变胖​​：不要直接拉伸图片，而是插入斜纹形状，用\"合并形状-相交\"来裁剪。\n​​合并形状顺序​​：按 ​​Ctrl​​ 多选时，​​先选图片，再选形状​​，否则相交结果会不同。\n​​纹理填充技巧​​：把原图设置成灰色 + 透明度 90%，再用\"剪切版\"做纹理填充，可以快速做出高级立体质感。\n​​形状旋转​​：点击两次向右旋转，可以快速调整形状角度。\n六、一句话总结\n\n用\"合并形状相交\"抠图 + \"剪切版纹理填充\"，就能在 PPT 里快速做出高端立体的形状效果，比直接拉伸图片专业得多。\n\n补充说明：笔记中未提及具体使用的 PPT 版本、斜纹形状的具体插入路径、以及\"剪切点图片纹理填充\"的完整菜单路径，如需完整操作可结合 PPT 实际界面进一步探索。"}, {"idx": 18, "id": "6a6a36db000000000401f746", "title": "出家的北大数学天才，如今还俗、结婚", "cat": "学习闭环", "sug": "keep", "reason": "保留判据2（人物传记类认知不随工具版本过时，且其转行青少年心理、接待焦虑家长孩子的视角与郭老师心理健康教育主业邻近，可作育人与课程思考素材）", "what": "北大数学天才柳智宇从龙泉寺出家到还俗结婚、转行心理从业者的人物纪实", "use": "生涯认知素材：他把出家解释为「不是逃避而是走向另一条路」；可作为青少年心理视角参考（两类主要来访：迷茫想成长的青年、普遍焦虑的家长和孩子）；附共情倾听的自我训练方法", "next": "最小下一步：把笔记中触动你的核心观点记录到个人知识库；复刻目标：不适用", "detail": "", "cost": "无", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 出家的北大数学天才，如今还俗、结婚\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6a6a36db000000000401f746?xsec_token=ABeTr6QTkdn9_ktGyVCJkUzWVdsTK5g1LmoRRlUZAZ4LE=&xsec_source=pc_user\n\n根据你引用的笔记，我帮你把柳智宇的故事完整梳理出来了。\n\n一、内容定位\n​​领域​​：人物故事 / 人生选择 / 心理学 / 自我成长\n​​作者身份​​：采访者（媒体/自媒体）\n​​想教会观众什么​​：人生没有标准答案，真正的勇敢是听从内心、找到属于自己的路；无论选择哪条路，真诚面对自己才是最重要的。\n二、内容详细讲解\n\n柳智宇曾是奥数金牌得主、北大数学天才，被麻省理工全额奖学金录取，却在 2010 年放弃一切，在龙泉寺出家。2022 年他下山还俗，恋爱结婚，成为一名心理从业者。\n\n​​数学之路的尽头​​：当别人觉得他获得奥赛金牌、前途无量时，他自己知道数学这扇门可能已经无法向他打开了。高三时他出现了非常严重的眼疾，一堂课只能看黑板 10 分钟。\"当数学天才只要大脑运转 10 分钟就转不动了，真是一种剥夺的感觉。\"\n​​出家的初心​​：初中时他就接触了庄子和佛学。出家不是逃避，而是他当时做出的选择。在山上那几年，他病了大半年，在后山上走时看到春天草木几天就变化，体会到\"一切都在无常变化\"。他悟到：人生所有的东西都不是你的——外界的聪明才智、金钱、名声，在特殊环境下都会失去，只有一件事情是我们自己的，就是我们的成长。\n​​关于\"有选择\"的误解​​：很多人觉得他能放弃是因为\"有选择\"，但他认为不管有没有选择，人心都会有烦恼。没有选择会不甘，有选择会困惑。如果没有选择，正好去安于当下的事情。\n​​还俗的犹豫与决定​​：还俗前他犹豫过很久，因为作为出家人会被社会方方面面当成关注的焦点，跟他的本心不相符。2022 年他决定还俗，说：\"我不认为自己是一个已经开悟的人，但至少我是一个很真诚的人。\"\n​​从数学到心理学的转折​​：他从小容易沉浸在自己的世界里，这带来好处（专注、做事有成果），但也忽略了很多和人有关的事情。大一的时候，他看见外面的花草树木，脑子里都会冒出数学公式，他觉得非常痛苦，甚至到了抑郁的程度。他痛定思痛，开始练习共情和倾听的能力——遇到一个人跟你说话，就认真听。有一回在北京植物园，大冬天的湖上都结冰了，他听一个老大爷讲了两个小时的人生。\n​​结婚与世俗生活​​：妻子教会他更好地爱一个人，这句话一度挂在了热搜榜上。他说找到一个志同道合的人确实不容易，但如果你本身有一个特别明确的志向、一个明确而开阔的理想，你是能找到的。\n​​现在的他​​：正在努力投入稳定的世俗生活中——写书、直播、讲课。他接了很多青少年方面的咨询案例，来找他咨询的两类人最多：一类是觉得迷茫困惑、想成长但不知道如何应对世俗社会的人；另一类是家长和孩子普遍都很焦虑的人。他说：\"戒律的精神实际上是慈悲，善待自己和善待身边的人。\"\n​​关于被骂​​：他一般不会主动看评论，有的人从整场直播一路下来都在骂他，但他想：\"这人真有毅力，需要我讲点什么，或许能够对他稍微有一点点帮助。\"\n​​对邓煜获奖的态度​​：王虹、邓煜获菲尔兹奖刷屏，这是中国人第一次摘得这项全球数学界最高荣誉。柳智宇说：\"打心底为他们高兴，数学和修行都是对真实的渴望。\"\n三、核心知识点\n​​关键结论​​：人生不是一场比赛，每个人都在自己的轨道上。真正的勇敢不是追求别人眼中的成功，而是专心投入眼下的选择，用有限的时间尽可能去绽放。\n​​容易搞错的点​​：很多人以为他是\"逃避\"数学才出家，但他自己说不是逃离，而是走向了另一条路——从看懂宇宙的结构，到看懂人心的结构。\n​​作者的个人经验​​：练习共情和倾听很简单——遇到一个人跟你说话，就认真听。戒律的精神是慈悲，善待自己和善待身边的人。\n四、视频中出现的提示词/操作文字\n\n视频中未出现 AI 提示词、搜索词或软件指令。\n\n五、实用信息清单\n​​柳智宇的咨询对象​​：两类人最多——迷茫困惑想成长的人、家长和孩子都很焦虑的人。\n​​他的日常​​：写书、直播、讲课、做心理咨询。\n​​他面对批评的态度​​：不主动看评论，但如果有人在骂他，他会想\"这人真有毅力，或许我讲点什么能帮到他\"。\n​​他对理想的看法​​：理想是一盏灯，不是必须完成的 KPI。真正的意义不只在于完全实现的那一刻，而在于每个当下带给我们的光明和力量。\n六、一句话总结最值得收藏的点\n\n\"我已经出过家的人了，我再来这世间走一遭，其实我只希望给我身边的人带来一些光亮就可以了。\"\n\n柳智宇的故事最打动人的地方，可能不是他放弃了什么，而是他在每一个阶段都诚实地面对了自己。从数学天才到出家僧人，再到心理咨询师，他走了一条少有人走的路，但每一步都算数。"}, {"idx": 19, "id": "6abb0a2c000000001501575b", "title": "AI 协同流程大揭秘（建议收藏）", "cat": "学习闭环", "sug": "keep", "reason": "保留判据2（文档蒸馏→重写→交叉审计→影子彩排的工程方法论不过时）+ 保留判据3（AI 多模型协同重构工作流直接可用于他的 Vibe Coding 项目）。", "what": "卡兹克分享用多模型 AI 协同重写 AIHOT 旧项目的 12 步流程。", "use": "核心打法：把旧项目蒸馏成「功能文档+交接包」（要求架构分离、保留所有功能和踩坑细节）→ 新模型不看旧代码原地重写 → 多模型并行交叉审计出报告 → 清空上下文再用子 Agent 按功能模块化比对旧站 → 影子系统线上彩排 6 小时自动修复后无缝切换、旧站转热备；实测数据：代码 117,877→32,460 行、API p95 374ms→82ms。", "next": "最小下一步：整理笔记中的 AI 协同流程框架，提炼可复用的方法论思路；复刻目标：不适用", "detail": "", "cost": "Claude Opus 5.5/GPT-6 Astra 等具体型号名称会过时；影子系统彩排需要线上服务器环境，折腾成本高。", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# AI 协同流程大揭秘（建议收藏）\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6abb0a2c000000001501575b?xsec_token=ABfVgv07D3a0ZiBsLCsF0LfsXicazsCCRZz3HO_2_ba38=&xsec_source=pc_user\n\n根据你引用的笔记，作者（数字生命卡兹克）分享了自己用 AI 协同重写 AIHOT 项目的完整流程。以下是详细整理：\n\n一、内容定位\n​​领域​​：AI 编程 / 代码重构 / 独立开发\n​​作者身份​​：自称\"纯外行\"的独立开发者，运营 AI 资讯站 AIHOT\n​​核心目的​​：分享用 AI 协同重写旧项目的 12 步流程，给其他人参考\n二、内容详细讲解（12 步流程）\n​​蒸馏旧项目​​：使用 Claude Opus 5.5 和 GPT-6 Astra 并行对旧项目进行蒸馏，设计交流包。要求架构分离，为多 Agent 并行开发而设计，保留所有功能和容易踩坑的细节。\n​​对照完善文档​​：使用 Claude Fable 5.1 对两个模型生产的功能文档、交接包和旧代码库进行全面对照，寻找不合理和遗漏的地方进行完善。\n​​全新重写​​：使用 Claude Opus 5.5 在不看任何旧代码的情况下，根据最终的功能文档、交接包、线上网站的端到端测试，进行全方位的重写（大概写了 12 个小时）。\n​​并行审查审计​​：使用 Claude Fable 5.1 和 GPT-6 Astra 并行审查新写完的项目，将其与旧代码库的所有细节进行逐行审计，检查功能和细节遗漏、用户体验是否完美还原，最终产出两份审计报告。\n​​优化与模块化对比​​：使用 Claude Opus 5.5 根据审计报告进行优化开发。开发完成后，清空所有上下文，自己再并行 N 个子 Agent，以功能模块化的方式跟旧代码库对比，看是否遗漏功能和逻辑细节（无视代码实现，只看功能和逻辑细节）。\n​​审查 BUG 和漏洞​​：使用 Claude Fable 5.1 和 GPT-6 Astra 并行审查所有可能的 BUG 和漏洞，继续由 Opus 5.5 优化。\n​​优化前端 UI​​：使用 Opus 5.5 优化所有前端 UI，进行控件组件化统一，部分 UI 界面全面重设计，加入 Opus 5.5 擅长的 JS+Canvas 动效（例如关于页和更新页）。\n​​影子系统彩排​​：导出旧项目所有数据库，进行线上服务器彩排，6 小时的影子系统并行，过程中实时监控，使用 Claude Opus 5.5 自动化并行修复过程中出现的所有问题。\n​​端到端测试​​：使用 GPT-6 Astra 进行全面的端到端测试。\n​​无缝切换上线​​：2026-09-28 13:12 切换上线，旧站退为热备。\n​​性能优化​​：使用 GPT-6 Astra 根据真实数据，全方位优化缓存、CDN、页面大小等问题，提升全站性能。\n​​持续监控​​：监控问题，不断优化。\n三、核心知识点\n​​核心结论​​：比重构\"屎山\"更高效的方式，是直接将源项目库蒸馏成功能文档，然后用最新模型原地重写，不看旧代码。\n​​关键要点​​：\n蒸馏阶段要保留所有功能和容易踩坑的细节，架构分离以支持多 Agent 并行。\n重写时必须\"不看任何旧代码\"，避免被旧实现带偏。\n审查阶段要并行使用多个模型交叉验证，产出审计报告。\n上下文管理很重要：开发完成后清空上下文，再用子 Agent 做模块化对比。\n上线前必须做影子系统并行彩排（作者做了 6 小时），实时监控并自动修复问题。\n​​作者经验​​：虽然项目不大，但整个流程跑通后体验很好。作者自称\"纯外行\"，方法仅供参考。\n四、视频中出现的提示词/操作文字\n\n笔记中未出现完整的提示词原文，但提到了关键操作指令和审查思路：\n\n蒸馏阶段要求：\"架构分离，为多 Agent 并行开发而设计，保留所有功能和容易踩坑的细节\"\n重写阶段前提：\"在不看任何旧代码的情况下，根据最终的功能文档、交接包、线上网站的端到端测试\"\n模块化对比时：\"无视代码实现，只看功能和逻辑细节\"\n评论区有人提到让 AI 审查交接包的思路：\"我先通读新交接包的全部文件，再对照旧仓库的产品面（路由、页面、数据结构，不看实现细节）做遗漏和过度约束的审查\"\n五、实用信息清单\n​​使用的模型​​：\nClaude Opus 5.5：主力重写和优化，代码能力强\nClaude Fable 5.1：文档对照、审查审计\nGPT-6 Astra：并行审查、端到端测试、性能优化\n​​AIHOT 2.0 工程对比数据​​（来自笔记配图）：\n应用代码：117,877 行 → 32,460 行（-72%）\n数据库：103 表·80 触发器·120 存储函数 → 68 表·0 触发器·0 存储函数\n页面 p50：64ms → 14ms\n文章页 p95：665ms → 23ms\nAPI p50：64ms → 14ms\nAPI p95：374ms → 82ms\n对外兼容探针：217/217 全部一致\n​​技术栈​​：Next.js 16、Prisma 6、TypeScript 5.9、React Router 8、Fastify 5、pg-boss\n​​项目地址​​：AIHOT GitHub（笔记评论区提到作者开源了引擎和框架）\n六、一句话总结\n\n​​把旧项目蒸馏成功能文档，让 AI 不看旧代码原地重写，再用多模型交叉审查和影子系统彩排，是重构\"屎山\"的高效路径。​​\n\n补充一点：笔记评论区有不少开发者讨论这种方法的边界——有人担心\"蒸馏不全，真正的屎山都运行在副作用上\"，也有人认为\"对于不复杂的项目可行，功能多的很难搞\"。作者的方法更适合中小型项目，且需要人工在关键环节（如交接包审查、影子系统监控）保持介入。"}, {"idx": 20, "id": "6a62a9b3000000001d020c1a", "title": "王虹和邓煜是两个极端", "cat": "学习闭环", "sug": "drop", "reason": "删除判据4：科研人物传记与励志叙事，与其主线无实操关联，核心信息'努力重于天赋'属鸡汤情绪价值", "what": "菲尔兹奖得主王虹与邓煜的学术路径对比人物故事", "use": "王虹靠好奇心与坚持攻克挂谷猜想，邓煜天赋型灵活风格挑战希尔伯特第六问题；共识'努力是天赋后面的零'，成就源于长期与不确定性对抗", "next": "最小下一步：收藏这条笔记，并摘录\"努力是天赋后面的那一堆零\"等核心观点到个人知识库；复刻目标：不适用", "detail": "", "cost": "无", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 王虹和邓煜是两个极端\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6a62a9b3000000001d020c1a?xsec_token=ABjPPvQ1fUlFNJHrDjrNqy8kna6EJBtbA_mxIvfO9wq7o=&xsec_source=pc_user\n\n根据你引用的笔记，我整理了以下完整信息：\n\n一、内容定位\n​​领域​​：数学教育 / 人物故事 / 学术成长\n​​作者身份​​：未明确，但内容基于对王虹、邓煜的公开采访和报道整理\n​​核心意图​​：通过对比两位菲尔兹奖得主截然不同的学术路径，向观众传递\"人才没有统一模板\"的理念，强调努力与热爱比天赋更重要，鼓励人们不要害怕走弯路\n二、内容详细讲解\n\n笔记以\"菲尔兹奖的两个极端\"为主线，对比了王虹和邓煜的学术之路：\n\n​​王虹的挣扎之路​​\n\n16岁考上北大，最初就读地球与空间科学学院，一年后转入数学科学学院\n她并不认为自己有多高天赋，曾因为数学太难转去学建筑，又觉得建筑更难，转回来学数学\n在科研中多次陷入绝望，用\"痛苦\"\"挣扎\"\"迷茫\"等词描述自己的状态\n选择攻克​​挂谷猜想​​这个一百年都没被解决的难题，最初只是凭着一股好奇心——想知道为什么这个问题看上去很简单，却这么多年都没人能做出来\n靠着好奇心战胜了这个\"不可战胜\"的难题\n\n​​邓煜的天才之路​​\n\n典型的天才少年，高中奥赛金牌保送北大\n本科时拿到全世界最难的数学竞赛​​普特南​​的金牌\n成为科研工作者后斩获多个有分量的大奖\n研究风格灵活，很少死磕，喜欢给自己松绑，同时想好几个不同的问题，遇到想不通的就先放一放\n生活浪漫，喜欢诗歌、二次元，在社交平台上非常活跃\n与和合作者挑战​​希尔伯特第六问题​​，在物理和数学界都是里程碑式的存在\n\n​​两人的共同答案​​\n\n在面对\"努力重要还是天赋重要\"这个问题时，两人的答案相似：​​还是努力吧​​\n努力重要是因为能有所成就靠的不是灵光乍现，而是长时间的投入，长时间地和不确定性进行对抗\n单靠天赋没办法做到这点，科学家也是普通人，靠着一具肉身抵抗岁月的磨练\n三、核心知识点\n​​关键结论​​：人才没有统一模板，走直路和走弯路都能到达顶峰；努力比天赋更重要，因为成就靠的是长期投入而非灵光乍现\n​​容易搞错的要点​​：\n王虹并非\"觉得数学太难才去学建筑\"，而是想让人生有更多尝试，回来做数学是因为想把人生最好的时间献给热爱的数学（评论区补充）\n邓煜的\"盲目自信\"只是谦虚的说法，他的自信源于绝对实力\n​​作者的小贴士​​：\n不要害怕走弯路，弯路是在确认方向\n享受思考本身就是回报\n允许自己走一段岔路，才能知道哪条路是归途\n四、视频中出现的提示词/操作文字\n\n视频中未出现明确的提示词、搜索词或软件指令。\n\n五、实用信息清单\n​​王虹素材来源​​：\n《专访北大王虹校友》\n26年1月 ICCM 颁奖后采访\nIHES 入职采访\n​​邓煜素材来源​​：\n《专访邓煜：如果不做数学家可能写科幻小说》\n《一顿炸鸡开悟，他们意外破解百年难题》\n邓煜与钰子一对话\n邓煜自己的 CV\n六、一句话总结\n\n王虹靠好奇心和毅力在挣扎中攻克百年难题，邓煜以天赋和灵活风格突破里程碑式问题——两人路径迥异却殊途同归，最终都证明了​​努力是天赋后面的那一堆零​​。\n\n补充一点，笔记中提到两人是北大2007级同班同学，一个高考进来、没打过一天竞赛，另一个从初中起就在竞赛体系中成长，最终在2026年菲尔兹奖颁奖台上顶峰相遇。这也是中国籍数学家首次斩获该奖，具有里程碑意义。"}, {"idx": 21, "id": "6a3f2a4e000000001101ee86", "title": "乐理真正要背的很少很少（1.1）", "cat": "学习闭环", "sug": "keep", "reason": "保留判据2（原理型乐理+记忆方法论不随版本过时，直接服务他的乐器实践，与《海阔天空》指法篇形成闭环）。", "what": "乐理第一讲：声音频率与十二平均律的最少记忆版，讲原理不讲死记。", "use": "人耳可听 20-20000Hz；440Hz 基准音每 12 格频率翻倍；音阶记忆钥匙“B-C、E-F 不空格其他都空一格”，从任意字母向后默写十二平均律；下期讲首调。与他洞箫/竹笛实践线直接衔接。", "next": "最小下一步：收藏笔记并整理核心知识点到个人知识库；复刻目标：不适用", "detail": "", "cost": "无硬伤；系列课需追更才能拼成完整体系。", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 乐理真正要背的很少很少（1.1）\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6a3f2a4e000000001101ee86?xsec_token=ABh3YzuTO70VtfXIIfeZN5QpbMVDEUIZwkzJ_sDx5YXSI=&xsec_source=pc_user\n\n根据你引用的笔记，以下是完整细致的信息整理：\n\n一、内容定位\n​​领域​​：音乐 / 乐理知识\n​​作者身份​​：豆子（视频作者，自称\"我是豆子眼见为实，带你看见音乐\"）\n​​想教会观众什么​​：通过理解乐理背后的原理，减少死记硬背，让乐理学习变得轻松。本集是第一节乐理课，重点讲解声音的本质、频率与十二平均律的基础规则。\n二、内容详细讲解\n\n​​引言：乐理不是为难人的​​\n\n音乐的理论是一个工具，觉得难用是因为不够了解它。\n死记硬背会觉得难，理解原理后乐理和加法难度差不多。\n用\"原始人刚拿到打火机觉得钻木取火更好用\"作比喻，强调要正确打开这份\"使用说明书\"。\n\n​​声音的本质​​\n\n声音是通过​​振动​​产生的，振动就是一个东西\"晃啊晃啊\"动来动去。\n人的耳朵对振动的接收能力有限制：一秒钟内振动​​20次​​到​​2万次​​之间才能听见，超出这个范围就听不见了。\n这个​​20到2万​​的范围是人类做音乐的范围。\n\n​​频率与音高​​\n\n把\"晃啊晃\"用专业词表达就是​​频率​​。\"频\"是连续的意思，\"率\"是有比较的数值。\n声音的频率叫​​音频​​，单位用​​赫兹（Hz）​​，是以一位老外的名字缩写而来。\n频率越高（晃动越快），耳朵听到的声音就越高；频率越低，声音就越低。\n举例：每秒钟晃动​​82.6赫兹​​的声音，以及每秒钟​​440次​​的声音。\n所以\"高音\"\"低音\"的\"高\"\"低\"，本质上就是数字的高低。\n\n​​十二平均律​​\n\n人类在声音的自然定律中设计游戏规则，历史上使用过三种律：​​五度相生律​​、​​十二平均律​​等。\n现在大部分主流乐器已经和​​十二平均律​​绑定，所以直接讲十二平均律。\n把十二平均律想象成一把尺：20到2万之间的振动不会每一个都用，就像尺子上0.1毫米和0.2毫米中间的缝隙没有刻度。\n这把尺的国际标准是用​​每秒钟440次晃动​​的声音（440Hz）作为基准音，然后推算出其他音高。\n​​每前进十二格，频率就会翻倍​​：440 → 880 → 1760 → 3520……听起来是一模一样的音，只是高低不同。\n\n​​音名与音阶的记忆方法​​\n\n音名用英文字母 ​​A-G​​ 表示，共7个字母循环使用。\n记住一个核心规律：​​B-C 和 E-F 中间没有另一个声音（不空格）​​，其他相邻字母之间都要空一格。\n举例：从 B 开始数，B 到 C 不空格，C 到 D 空一格，D 到 E 空一格，E 到 F 不空格，F 到 G 空一格……以此类推。\n再从 G 开始：G 到 A 空一格（因为不是 B-C 或 E-F），A 到 B 空一格，B 到 C 不空格，C 到 D 空一格……\n只要记住\"B-C 和 E-F 不空格，其他都空一格\"，从任何一个字母开始往后写都能写出来。\n这就是所谓的​​固定音高​​（台湾叫​​绝对音​​），字母被定好了振动频率。\n\n​​下期预告​​\n\n下期教大家怎么用这把尺去丈量音乐的调式，也就是​​相对音高​​或叫​​首调​​。\n三、核心知识点\n​​关键结论​​：\n声音由振动产生，人耳可听频率范围是 ​​20Hz 到 20000Hz​​。\n频率越高，音越高；频率越低，音越低。\n十二平均律以 ​​440Hz​​ 为基准音，每前进 12 格频率翻倍。\n音名只有 7 个字母（A-G），记忆规律是 ​​B-C 和 E-F 不空格，其他都空一格​​。\n​​容易搞错的要点​​：\n不要纠结\"为什么每前进十二格听起来一模一样\"，作者说\"不要去纠结\"，接受这个听觉现象即可。\n不要从数字角度死记硬背，要理解\"听觉距离\"而非\"数字距离\"。\n​​作者的个人经验和小贴士​​：\n把十二平均律想象成一把尺，帮助理解刻度概念。\n在纸上自己默写音阶，从任何一个字母开始往后写，练几次就记住了。\n理解原理比死记硬背重要得多，这是让后续乐理课变轻松的关键。\n四、视频中出现的提示词/操作文字\n\n视频中未出现输入给 AI 的提示词、搜索词、软件指令或配方文本。\n\n五、实用信息清单\n​​人耳可听频率范围​​：20Hz ~ 20000Hz\n​​频率单位​​：赫兹（Hz）\n​​基准音​​：440Hz\n​​音名​​：A、B、C、D、E、F、G（共 7 个字母循环）\n​​音阶记忆口诀​​：​​B-C 不空格，E-F 不空格，其他都空一格​​\n​​固定音高​​：字母被定好了振动频率（台湾称\"绝对音\"）\n​​相对音高 / 首调​​：下期内容，用尺子丈量音乐的调式\n六、一句话总结最值得收藏的点\n\n​​记住\"B-C 和 E-F 不空格，其他都空一格\"，就能从任意音开始默写出十二平均律，这是少背 99% 乐理的核心钥匙。​​\n\n补充一点：评论区有同学提到自然大调音程口诀\"全全半全全全半\"、自然小调音程口诀\"全半全全半全全\"，但这是评论区内容，并非视频正文讲解的部分。"}, {"idx": 22, "id": "6a662f9d000000001003ffb6", "title": "本周爆火开源项目，建议先收藏 | 7月第三周", "cat": "学习闭环", "sug": "keep", "reason": "保留判据3（ai-agent-book/code-review-graph/DeepTutor 直接服务他的 Agent 学习、Claude Code 上下文优化、教学与知识管理主线）+ 保留判据2（选项目的评估方法不过时）。", "what": "一周 GitHub 热榜盘点，含 5 个开源项目和一套选项目的评估方法。", "use": "项目：ai-agent-book（github.com/bojieli/ai-agent-book，AI Agent 工程十章体系+PDF+配套代码）、code-review-graph（先建代码关系图再让 AI 顺节点读，替代整仓塞上下文，支持 MCP/CLI/VSCode）、worldmonitor、kimi-code、DeepTutor（Docker 一键自托管的 Agent-native 学习伴侣）；方法论：不只看 Star，从 README/官网/功能证据判断项目是否值得用。", "next": "最小下一步：克隆仓库，下载 PDF，快速浏览目录和附录代码入口；复刻目标：不适用", "detail": "", "cost": "「本周爆火」框架有时效，kimi-code 等版本信息会过时；部分项目需 Docker 部署或 API Key，有折腾成本。", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 本周爆火开源项目，建议先收藏 | 7月第三周\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6a662f9d000000001003ffb6?xsec_token=ABdkoM7E-SQ5b4ycpg5qcX0gC_vkz_znFBf_xRdyIywJI=&xsec_source=pc_user\n\n根据你引用的笔记，我结合搜索到的公开信息，对这条\"7月第三周 GitHub 开源热榜\"笔记做了完整拆解。\n\n一、素材与想法\n​​素材来源​​：笔记作者通过观察 GitHub 热榜（Star 增长、排名变化），筛选出 5 个当周热度最高的开源项目。素材包括项目的 README、官网、功能演示和 Star 数据。\n​​核心想法​​：很多开发者只看 Star 数，但作者认为\"README、官网和功能证据\"同样重要。他试图帮观众过滤噪音，找到真正值得收藏和深入研究的 AI Agent、AI 编程和开源工具类项目。\n​​新在哪​​：不只看 Star，而是从\"实用性\"和\"体系化\"角度去评价项目——比如《ai-agent-book》强在把 AI Agent 的工程问题拆成十章系统讲，DeepTutor 强在不是普通聊天机器人而是长期个性化学习系统。\n​​省在哪​​：观众不需要自己去 GitHub 上逐个翻项目、看文档，作者已经帮他们做了初筛和总结。\n​​强在哪​​：每个项目都给出了明确的使用场景和适合人群，比如 worldmonitor 适合安全情报和供应链风险人员，code-review-graph 适合维护大仓库的团队。\n二、实现方式与技术原理\n\n笔记本身是一个​​内容盘点类视频​​，不涉及作者自己开发项目，因此没有\"从 0 到成品\"的实现步骤。但笔记中提到的 5 个项目各自有不同的技术原理：\n\n​​ai-agent-book​​：一本开源工程书，用 10 章系统讲解 AI Agent 的上下文、记忆、工具、评估等问题，配套 PDF 和代码仓库。\n​​worldmonitor​​：全球风险实时大屏，把 500 多个新闻源、地缘政治、基础设施和市场信号压到同一个地图入口，支持双地图引擎和风险关联。\n​​code-review-graph​​：先给代码建关系图，再让 AI 顺着相关节点读，不用把整个仓库塞进上下文。支持 MCP、CLI、VS Code 接入。\n​​kimi-code​​：把 Kimi K3 放进终端和真实项目，支持读文件、改代码、跑命令，提供 TUI、视频输入、MCP 配置等功能。\n​​DeepTutor​​：Agent-native 学习伴侣，围绕学习过程一起成长，支持多种 RAG 引擎、本地模型、Skills 和长期记忆，Docker 一键自托管。\n三、AI 与工具清单\n\n笔记中提到的模型、产品、工具和框架如下：\n\n名称\t用途\t备注\nai-agent-book\tAI Agent 工程书\t开源免费，含 PDF 和代码\nworldmonitor\t全球风险大屏\t开源，支持 Docker 自托管\ncode-review-graph\tAI 代码审查工具\t开源，支持 MCP/CLI/VS Code\nkimi-code\tKimi 终端编程工具\t开源，由 月之暗面 提供\nDeepTutor\t个性化学习伴侣\t开源，支持 Docker 自托管\nKimi K3\t大语言模型\t用于 kimi-code 的编程能力\nMCP\t模型上下文协议\t多个项目支持接入\nVS Code\t代码编辑器\tcode-review-graph 支持接入\nCLI\t命令行工具\t多个项目提供 CLI 入口\nDocker\t容器部署\tworldmonitor 和 DeepTutor 支持\n四、项目来源与链接\n\n笔记中提到的 GitHub 仓库和其他链接如下：\n\n​​ai-agent-book​​：https://github.com/bojieli/ai-agent-book，作者 李博杰，用途是系统学习 AI Agent 设计原理和工程落地，包含全书正文、编译版 PDF 和按章配套代码。\n​​worldmonitor​​：https://github.com/koala73/worldmonitor，用途是实时全球情报仪表盘，聚合新闻、地缘政治和基础设施监控。\n​​code-review-graph​​：https://github.com/tirth8205/code-review-graph，用途是让 AI 精准阅读大仓库代码，避免信息过载。\n​​kimi-code​​：https://github.com/MoonshotAI/kimi-code，用途是把 Kimi 放进终端和真实项目写代码。\n​​DeepTutor​​：https://github.com/HKUDS/DeepTutor，用途是长期个性化学习系统，Agent-native 学习伴侣。\n五、视频中出现的提示词/指令\n\n视频中未出现提示词。笔记中的口播和字幕主要是对 5 个开源项目的介绍和总结，没有演示作者实际输入给 AI 的具体提示词或指令。\n\n六、复现指南\n\n笔记本身是\"盘点推荐\"类内容，不是教程，因此没有完整的复现步骤。但如果你想去体验这 5 个项目，可以参考以下最简行动清单：\n\n​​前置条件​​：需要能访问 GitHub，部分项目需要配置 API 密钥（如 Kimi）或本地部署环境（如 Docker）。\n​​最简行动清单​​：\n打开 GitHub，搜索对应仓库名（如 ai-agent-book）。\n阅读 README，了解安装和使用方式。\n按文档执行安装命令（如 pip install code-review-graph）。\n配置相关 API 密钥（如需）。\n运行项目，体验功能。\n​​难点与坑​​：\n部分项目需要一定的技术基础（如 Docker 部署、MCP 配置）。\nKimi-code 需要 Kimi 账号和 API 权限。\nworldmonitor 的公共数据源无需配置，但解锁额外数据源需要 API 密钥。\nDeepTutor 的本地部署需要一定的服务器资源。\n七、一两句话总结最该记住的关键点\n\n这期笔记的核心价值在于​​帮开发者过滤 GitHub 噪音​​——不只看 Star 数，而是从 README、官网和功能证据去判断项目是否真正值得用。5 个项目分别覆盖了 AI Agent 学习、全球情报监控、AI 代码审查、终端编程和学习伴侣五个方向，适合不同场景的开发者收藏和尝试。\n\n补充一点：笔记作者还提到\"关注 Oraink 每天看 AI 科技脉络，每周捞真正值得收藏的开源项目\"，说明这是一个持续更新的开源项目盘点系列，感兴趣可以持续关注。"}, {"idx": 23, "id": "6aba6a39000000001b02c8a6", "title": "找选题skill｜挖出对标评论的真需求", "cat": "新产", "sug": "keep", "reason": "保留判据3（直接命中小红书运营主线，是把对标评论区转成选题与产品的实操方法）", "what": "用 AI Agent 扒对标博主几千条评论、聚合成用户需求并生成选题卡片的工作流。", "use": "把对标博主主页直接丢给 Codex 或 Claude，Agent 自己挑作品读评论（评论区补充是浏览器插件模拟人、不是爬虫）；案例数据 2418 条评论去闲聊后剩 1687 条真实问题→归成 18 类需求→再拆成 20 张可直接拍的选题卡；也可自建：MediaCrawler 抓评论 + AI 做语义聚类；延伸判断「用户觉得有用」与「愿意付钱」的差距。", "next": "", "detail": "", "cost": "该 Skill 获取方式未公开，需自己去评论区或私信找；扒评论有被平台限流/封号风险（评论区提示换小号更稳妥）；AI 挖出的需求深度有限。", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 找选题skill｜挖出对标评论的真需求\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6aba6a39000000001b02c8a6?xsec_token=ABpml1HI-BQkBZEnVz-6lO8_HXS4vdw9y1ne7QquzWNh8=&xsec_source=pc_user\n\n根据你引用的笔记，我来对这条\"找选题 Skill\"进行深度拆解。\n\n一、素材与想法\n​​素材来源​​：对标博主的主页及其评论区。笔记中以\"姜胡说\"的账号为例，让 AI 抓取了 ​​2418 条评论​​，去掉闲聊后剩下 ​​1687 条​​真实问题，最终归类为 ​​18 类用户需求​​。\n​​核心想法​​：新号起号时，自己还没有用户反馈，对标账号攒下来的评论就是\"最快能拿到的一批真实用户样本\"。作者想解决两件事：第一，评论背后藏着什么用户需求；第二，这些需求怎么变成下一条选题和产品。\n​​新在哪、省在哪、强在哪​​：\n​​新​​：不是简单总结评论，而是把评论一步步变成有依据的选题，并搭出内容框架。\n​​省​​：不用手动翻几千条评论，AI 自动扒评论、分类、生成选题卡片。\n​​强​​：每张选题卡都包含评论原话、为什么值得讲、内容怎么展开，甚至还会提示\"这个选题能不能继续做成产品\"。\n二、实现方式与技术原理\n​​从 0 到成品的步骤​​：\n把对标博主的主页丢给 AI（通过 Codex 或 Claude）。\nAI 自己去挑作品、读评论，把反复出现的问题和需求挖出来。\n生成一份需求报告，包含三个部分：看懂博主 → 挖出需求 → 变成选题。\n把高频需求继续往下拆，AI 整理成 20 张可以直接拍的选题卡片。\n​​背后依赖的机制​​：笔记中未明确说明具体是插件、Hook、RAG 还是 Agent 编排，只提到\"它会自己去评论区去翻评论\"，评论区有人补充说\"不是爬虫，是 Agent 内部浏览器插件模拟人做的\"。\n​​最有技术含量的一步​​：从 2418 条评论中筛选出 1687 条真实问题，并归类为 18 类需求，再进一步拆成 20 张选题卡片。这一步需要 AI 理解评论语义、去噪、聚类、再转化为可执行的选题框架。\n三、AI 与工具清单\n\n笔记中明确提到的工具如下：\n\n​​Codex​​：可以调用该 Skill，负责抓取评论、生成报告。\n​​Claude​​：同样可以调用该 Skill，替代 Codex 使用。\n​​WorkBuddy​​：评论区有人问\"兼容 WorkBuddy 吗\"，博主未明确回答，但评论区有人提到\"直接搜那个 skill 插件\"。\n​​Opus 5.5​​：评论区有人提到\"把你视频链接给到 CC，Opus 5.5 复刻后比你原来的 skill 更好\"。\n\n笔记未提及这些工具是免费还是付费。\n\n四、项目来源与链接\n​​GitHub 地址​​：笔记中未提供。\n​​其他链接​​：笔记中未提供具体链接，只提到\"你点开这里，复制，把它直接扔给你的 Codex 或者 Claude\"，但\"这里\"的具体位置在笔记中未展示。\n​​是否基于开源项目二次创作​​：笔记未提及。\n五、视频中出现的提示词/指令\n\n视频中​​未出现完整的提示词原文​​。博主只口播了使用步骤：\n\n\"你调用了它之后，你先告诉他，你研究的这个博主他是哪个平台的，你就直接把博主的主页丢给他，他会自己的去挑作品去读评论，你什么都不用管了。\"\n\n没有展示具体的 prompt 文本，因此无法逐字摘录。\n\n六、复现指南\n​​前置条件​​：\n需要拥有 Codex 或 Claude 的账号。\n需要获取该 Skill 的提示词或插件（博主说\"你点开这里，复制\"，但笔记中未展示具体位置）。\n​​最简行动清单​​：\n获取该 Skill 的提示词或插件。\n在 Codex 或 Claude 中调用该 Skill。\n告诉 AI 目标博主所在的平台，并把博主主页丢给它。\n等待 AI 输出需求报告和选题卡片。\n​​难点与坑​​：\n博主没有公开 Skill 的具体获取方式，观众需要自己去评论区或私信找。\n评论区有人提到\"换个小号确实更稳妥\"，暗示可能存在被平台限流或封号的风险。\nAI 挖出的需求可能不够深，博主也承认\"如果发现哪些需求它还没有被挖出来，你可以直接来告诉我，我会继续把它往深里的挖\"。\n七、一两句话总结最该记住的关键点\n\n​​对标账号的评论区是现成的用户调研池，用 AI 把几千条评论拆成需求分类和选题卡片，比盲目抄选题更高效。​​\n\n补充一点：从评论区反馈来看，这个 Skill 的核心价值在于​​把\"用户觉得有用\"和\"用户愿意付钱\"之间的差距挖出来​​。比如笔记中举的例子：有人做了个提取小工具，评论说\"如果是免费的，那就太需要了\"——这说明用户觉得有用，但不一定愿意付钱。这种洞察对做产品和选题都很有参考价值。\n\n如果你也想复现类似的工作流，可以试试用 MediaCrawler 这类开源工具先抓取评论，再用 Codex 或 Claude 做语义分析和聚类，最后生成选题卡片。"}, {"idx": 24, "id": "6abf40b5000000001a029314", "title": "真心建议大家看油管上的AI一手信息", "cat": "学习闭环", "sug": "keep", "reason": "保留判据2（「看真实工作流而非酷炫 Demo」的认知方法论不过时）+ 保留判据3（一手信息源与五维度框架直接服务他的 AI 内容创作主线）。", "what": "推荐 5 个 YouTube AI 频道，并给出「怎么建立 AI 一手信息源」的方法论。", "use": "频道清单：How I AI（职场人演示真实工作用法）、Every（作家等专业人士把方法论做成智能体审稿）、Starter Stories（草根创业者获客与变现）、Silicon Valley Girl（成熟组织内 AI 改造）、Latent Space（Token economy 等产业视角）；方法论：别看 KOL 酷炫 Demo，从实用教程/专业工作流/创业变现/企业改造/产业视角五个维度建认知。", "next": "最小下一步：在YouTube搜索并订阅这5个AI频道；复刻目标：不适用", "detail": "", "cost": "分析稿把 How I AI 作者误写成「ChatGPT 产品创始人」（实为 Nathan Lands），订阅前以搜索为准；需能访问 YouTube。", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 真心建议大家看油管上的AI一手信息\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6abf40b5000000001a029314?xsec_token=ABju_JJK3dViO8spiUA29Cgf8l_7IjX9GjRk9Av_fDWwE=&xsec_source=pc_user\n\n根据你引用的笔记，我帮你把视频里的核心信息完整整理出来了。\n\n一、内容定位\n​​领域​​：AI 工具学习、AI 应用教程、AI 创业与产业视角\n​​作者身份​​：AI 内容创作者，关注 Agent、Coding 和 AI 工具实战\n​​想教会观众什么​​：推荐 5 个 YouTube 频道，帮助观众从\"实用教程\"\"专业人士工作流\"\"创业变现\"\"企业改造\"\"产业视角\"五个维度系统学习 AI，摆脱\"看酷炫 Demo 却不会用\"的焦虑感\n二、内容详细讲解\n\n作者按顺序分享了 5 个 YouTube 频道，每个频道侧重点不同：\n\n​​How I AI​​：UP 主是 ChatGPT 这款产品的创始人。频道特点是一直分享实用教程，不是 KOL 做酷炫 Demo，而是请职场人士直接演示在工作中怎么用 AI。比如有一期讲 Codex 里面的 Computer Use 功能，直接展示测试时如何模拟用户操作、收集 bug 和反馈。实用、有信息量，且没有焦虑感。\n​​Every（频道名 AI and I）​​：Every 是一家科技公司，这个频道也分享专业人士怎么用 AI，但请到的专业人士更广泛。比如有一期请了文学方面的专业作家，作家会把希区柯克、冯内古特等知名创作者的方法论捏成智能体来审稿，并且写作前非常注重素材的整理和收集。把专业方法论融入 AI 工作流，和普通用法很不一样。\n​​Starter Stories​​：聚焦 AI 创业和做自己的产品。请到的不是走融资高大上路径的明星创业者，而是草根和普通的创业者，参考性更大。比如有一期讲一个博主用 Cloud 做体育小游戏，拿到流量后通过广告变现。这个频道不只讲 AI 工具怎么用，更多聚焦商业层面——怎么设计获客、怎么设计商业模式。\n​​Silicon Valley Girl​​：UP 主是女生创业者，请到的嘉宾基本是成熟的科技行业创业者。分享的是在成熟组织里 AI 怎么被用起来。比如有一期请了可汗学院的创始人，分享在成熟公司里产品经理、工程团队、设计团队怎么用 AI，以及原先的协作方式发生了什么变化。适合想了解 AI 如何改造企业的人。\n​​Latent Space​​：不涉及具体 AI 工具怎么用或具体创业案例，而是从产业视角看 AI。会有更新鲜、有趣的视角和命题，比如有一期讲 Token economy，请了 Open Router 的创始人和投资人。模型越来越多被使用，围绕它会出现计费、交易、中间商赚差价等经济活动。这个频道有助于把视野拔高，从产业角度理解 AI 兴起带来的变化。\n三、核心知识点\n​​关键结论​​：学 AI 一定要上 YouTube，但要看对频道。不要只看酷炫 Demo，要看专业人士、职场人士、创业者和产业视角的真实用法。\n​​容易搞错/需特别注意的要点​​：\n很多教程是 KOL 做 Demo，看起来厉害但落地难，作者强调要找\"职场人士直接演示工作用法\"的频道。\n专业人士把方法论融入 AI 工作流后，和普通用法差异很大，比如作家用智能体审稿、注重素材整理。\n创业类内容不要只看明星创业者，草根创业者的案例参考性更大。\n​​作者的个人经验和小贴士​​：\n这类实用教程看起来不会有焦虑感，适合假期慢慢看。\n作者后续还会分享更多跟 Agent 和 Coding 相关的教程。\n四、视频中出现的提示词/操作文字\n\n视频中未出现具体的提示词、搜索词或软件指令，主要是频道推荐和内容讲解。\n\n五、实用信息清单\n\n以下是笔记中提到的 5 个 YouTube 频道清单，可直接收藏：\n\n​​How I AI​​：职场人士演示 AI 工作用法，实用教程，无焦虑感\n​​Every（AI and I）​​：专业人士（如作家）把方法论融入 AI 工作流\n​​Starter Stories​​：草根 AI 创业案例，聚焦获客与商业模式设计\n​​Silicon Valley Girl​​：成熟组织内 AI 如何被使用，企业改造视角\n​​Latent Space​​：从产业视角看 AI，如 Token economy 等宏观命题\n六、一句话总结最值得收藏的点\n\n别只看酷炫 Demo，去 YouTube 找\"职场人士、专业人士、草根创业者、成熟组织、产业视角\"这 5 个维度的 AI 真实用法，才能把 AI 真正融入自己的工作流。"}, {"idx": 25, "id": "6a64188c000000001101ac4b", "title": "无限 grok-4.5 + deepseek-v4-flash", "cat": "新产", "sug": "keep", "reason": "保留判据3（剥掉免费额度外壳，四层 token 压缩的具体配置思路脱离模型版本，可直接用于他的 Vibe Coding 降本主线；额度情报属性已计入 pitfall）。", "what": "用 9router 搭号池+代理池轮询调用免费模型的方案，附带一套可复用的 token 节省配置。", "use": "9router 把多家免费模型合成一个名为 free 的自定义路由；token 节省器四层配置：RTK 压缩 git/grep/logs 等工具输出（省 60-90% 输入 token）、Headroom 路由前压缩上下文、Caveman 简洁风格系统提示（输出省约 65%）、Ponytail 引导模型写最少代码（YAGNI/重用标准库）；工程经验：走公网频繁失败，须本地部署或 tailscale 穿透；一号一 IP。", "next": "", "detail": "", "cost": "核心卖点是免费额度，随时砍且评论区实测 grok free 已降智不可用；号池有封号风险；需折腾 webshare 代理池（免费仅 10 IP/月 1GB），命中重折腾环境。", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 无限 grok-4.5 + deepseek-v4-flash\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6a64188c000000001101ac4b?xsec_token=ABdFyMwx3djDwt1K73YYuFhf9xU0IEr_DT1j0L2Dlgb4M=&xsec_source=pc_user\n\n根据你引用的笔记，我帮你把这条技术分享笔记的核心内容完整梳理出来了。\n\n一、内容定位\n​​领域​​：AI 工具开发 / 大模型中转站搭建 / 免费模型调用技巧\n​​作者身份​​：具备一定技术背景的开发者，正在研究如何低成本调用大模型\n​​想教会观众什么​​：揭秘市面上\"低价中转站\"的原理，并分享自己搭建免费模型轮询调用的完整方案\n二、内容详细讲解\n\n​​中转站低价原理​​：很多中转站的 grok-4.5 低至 1M/0.1 块钱，本质是建号池进行轮询调用，白嫖 grok 免费账号的额度。免费账号 grok-4.5 额度没有公开数据，作者查到是 1M/每天，但实际用下来没这么多。\n\n​​IP 与代理池建议​​：目前 grok 账号对 IP 没要求，但建议接入代理池，一个账号一个 IP 更保险。这些 IP 还可以对 opencode 和 mimo code 进行轮询调用免费模型（deepseek-v4-flash、mimo-v2.5-pro）。作者接入了 20 个代理池，opencode + mimo code 这些免费模型每天给通用 agent 跑任务绰绰有余。\n\n​​号池和代理池工具​​：推荐使用 9router，它能方便地将不同模型组合成一个自定义路由。例如可以把不同提供商、不同名字的免费模型组合成一个叫\"free\"的接口。\n\n​​Token 节省工具​​：9router 自带的 Token 节省器很好用，能从工具、语言、代码等三个方面来减少 token 消耗。\n\n​​部署注意事项​​：9router 走公网会频繁调用失败，本地部署或 tailscale 穿透就很稳定。\n\n​​IP 来源​​：使用 webshare，免费账号提供 10 个 IP，每个月 1GB 流量，满打满算也够了。\n\n三、核心知识点\n​​关键结论​​：低价中转站的核心原理是\"号池轮询 + 代理池隔离 IP\"，通过批量免费账号分摊额度成本。\n​​容易搞错的点​​：\ngrok 免费额度没有官方公开数据，作者查到的 1M/每天仅供参考，实际使用可能更少。\n9router 走公网不稳定，必须本地部署或用 tailscale 穿透。\n​​作者的个人经验和小贴士​​：\n一个账号配一个 IP 更保险，避免被限流或封号。\n20 个代理池配合 opencode + mimo code 的免费模型，跑通用 agent 任务已经足够。\nToken 节省器能从压缩工具输出、压缩上下文、压缩 LLM 输出三个维度大幅降低消耗。\n四、视频中出现的提示词/操作文字\n\n笔记中未出现具体的提示词或搜索词，但 OCR 图片中出现了以下配置文字：\n\n​​组合名称​​：Totan T、legseek、free\n​​模型名称​​：oc/deepseek-v4-flash-free、deepseek-vd-ash-free、oc/hy3-free、hy3-free、oc/mimo-v2.5-free、mimo-v2.5-hree、cbcn/hy3-preview、mmf/mimo-auto\n​​Token 节省器配置​​：\n压缩工具输出（RTK）：git/grep/s/tree/logs → 减少 60-90% 的输入 Token\n压缩上下文（Headroom）：在路由到模型之前通过 /v1/compress 压缩提示\n压缩 LLM 输出（Caveman）：简洁风格系统提示 → ~减少 65% 的输出 Token（最高 87%）\n懒人高级开发者（Ponytail）：引导模型编写最少代码，YAGNI、重用标准库、删除多于添加，Drop articles, fragments OK，Ladder enforced: stdlib/native first\n​​代理池配置​​：Rotation Strategy 为 Round-robin，总计 20 个代理，活跃 18 个\n五、实用信息清单\n​​工具推荐​​：\n​​9router​​：号池和代理池管理工具，支持将不同模型组合成自定义路由，自带 Token 节省器。\n​​webshare​​：IP 代理服务商，免费账号提供 10 个 IP，每月 1GB 流量。\n​​tailscale​​：用于网络穿透，解决 9router 公网调用失败的问题。\n​​免费模型来源​​：\nopencode：提供 deepseek-v4-flash-free 等免费模型。\nmimo code：提供 mimo-v2.5-free 等免费模型。\n​​配置建议​​：\n代理池轮询策略选择 Round-robin（轮询）。\n模型组合时命名规范：仅允许使用字母、数字、-、ξ 和 .。\nToken 节省器推荐开启 Full 或 Ultra 模式，压缩效果更明显。\n六、一句话总结最值得收藏的点\n\n​​用 9router 把 opencode 和 mimo code 的免费模型组合成\"free\"接口，配合 webshare 的代理 IP 做轮询调用，本地部署就能稳定跑通用 agent，每天额度足够用。​​\n\n补充一点：评论区有人提到 grok free 现在已经降智流口水无法用了，说明免费账号的额度或质量可能会随时间变化，建议多备几个免费模型源做兜底。"}, {"idx": 26, "id": "6a3d082f000000001503ed59", "title": "左手《Luvsic》，右手《夜，萤火虫和你》", "cat": "复刻闭环", "sug": "drop", "reason": "删除判据4（钢琴演奏创意，与他的主线无关，他无此实践线）。", "what": "钢琴主播展示《Luvsic》+《夜，萤火虫和你》左右手串弹、配空灵音色的创意演奏。", "use": "创意：两曲串弹+右手换空灵音色营造「窒息感」氛围，全程跟节拍器稳住节奏。", "next": "最小下一步：搜索《Luvsic》和《夜，萤火虫和你》的钢琴谱或音色设置；复刻目标：验证两首曲子串弹并配合空灵音色是否能产生\"窒息感\"的氛围效果", "detail": "", "cost": "无", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 左手《Luvsic》，右手《夜，萤火虫和你》\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6a3d082f000000001503ed59?xsec_token=ABcxpr4O0QCCK_lEmF1wyr6VQX9hxdfF2cJkTAUT5mjLg=&xsec_source=pc_user\n\n根据你引用的笔记，以下是完整细致的信息整理：\n\n一、内容定位\n​​领域​​：音乐 / 钢琴弹奏\n​​作者身份​​：钢琴主播 / 音乐创作者\n​​想教会观众什么​​：展示《Luvsic》与《夜，萤火虫和你》两首曲子的串弹创意，并通过音色与氛围的调配，呈现一种\"窒息感\"的情绪表达。\n二、内容详细讲解\n​​创意起因​​：主播发现《Luvsic》可以和《夜，萤火虫和你》串在一起弹奏。\n​​初步尝试​​：光这样弹总觉得\"差点意思\"。\n​​灵感来源​​：晚上 19 点，天还没有全黑，\"忧郁的蓝调天空\"给了主播音乐灵感。\n​​音色调整​​：把右手的旋律换成​​空灵的音色​​，以增强\"窒息感\"。\n​​最终呈现​​：左手弹《Luvsic》，右手弹《夜，萤火虫和你》，配合空灵音色，达到主播想要的感觉。\n​​节奏控制​​：依旧使用​​打点计时器​​（即节拍器）来保持节奏稳定。\n三、核心知识点\n​​关键结论​​：两首曲子串弹时，通过改变右手音色（换成空灵音色）可以大幅提升情绪氛围，让整体更有\"窒息感\"。\n​​容易搞错的要点​​：单纯把两首曲子拼在一起弹还不够，需要配合音色和氛围的调整，才能表达出完整的情绪。\n​​作者的个人经验和小贴士​​：\n观察环境（如\"忧郁的蓝调天空\"）可以激发音乐灵感。\n弹两首曲子串烧时，节奏要稳，主播全程使用打点计时器（节拍器）辅助。\n右手旋律换成空灵音色后，整体听感会更空灵、更有氛围感。\n四、视频中出现的提示词/操作文字\n\n视频中未出现明确的 AI 提示词、搜索词或软件指令。笔记中提到的操作文字包括：\n\n​​左手《Luvsic》​​：图片 OCR 文字，表示左手弹奏的曲目。\n​​右手《夜，萤火虫和你》​​：图片 OCR 文字，表示右手弹奏的曲目。\n​​打点计时器​​：视频 ASR 中提到，指节拍器，用于保持节奏稳定。\n五、实用信息清单\n​​两首曲目信息​​：\n​​《Luvsic》​​：日本爵士嘻哈制作人 Nujabes 与说唱歌手 Shing02 合作的经典系列歌曲，钢琴改编后常用于翻弹练习。\n​​《夜，萤火虫和你》​​：一首在网络上流行的钢琴曲，旋律治愈，常被用于钢琴翻弹和串烧。\n​​推荐练习方式​​：使用节拍器（打点计时器）保持节奏稳定，右手尝试空灵音色以增强氛围感。\n六、一句话总结最值得收藏的点\n\n左手《Luvsic》的律动加上右手《夜，萤火虫和你》的空灵音色，在\"忧郁的蓝调天空\"下弹出来，氛围感直接拉满。\n\n补充说明：笔记中提到的\"打点计时器\"在钢琴弹奏语境中实际是指​​节拍器​​，用于保持稳定的节奏和速度。"}, {"idx": 27, "id": "6aa93960000000001203d688", "title": "用自己的skill做的动效，非常非常好用！", "cat": "新产", "sug": "keep", "reason": "保留判据3（「把质量规则抽象成 skill 约束 AI 生成」是他 skill 工作流主线的又一次落地印证，单 HTML 轻量动效方案可低成本复刻用于小红书视频包装，与影视飓风那篇互补）", "what": "动效设计师用自定义 skill 约束 Opus 生成轻量单文件 HTML 动效的经验分享", "use": "Skill 规则设计范式：把「镜头必须连贯、元素必须形变过渡进下一个镜头、禁止一直固定镜头」写成 skill 规则交给 Opus 迭代，最终只输出一个单 HTML 文件就跑完整段动效，绕开 Remotion/HyperFrames 的重架构", "next": "", "detail": "", "cost": "作者称过几天开源但笔记发布时未放仓库链接，也无 prompt 原文，复刻需自己写规则", "quote": "", "quote_src": "", "text": "# v3-分区版 v3（回溯）\n# 用自己的skill做的动效，非常非常好用！\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6aa93960000000001203d688?xsec_token=AB3U9zy42AbrYIkWA9YBQFx2c9GU7NtLGk2DB_95BOBwo=&xsec_source=pc_user\n\n根据你引用的笔记，这是一位动效设计师用自定义 ​​skill​​ 配合 Opus 做出一套轻量动效工具的经历。- ​​核心痛点​​：作者在使用 Remotion 和 HyperFrames 时感到\"很累\"，这背后有架构层面的原因（作者未展开）。\n\n​​核心想法​​：设计一个 ​​skill​​，强制要求\"上一个镜头的元素必须形变进下一个镜头\"，同时镜头必须丰富、不能一直是固定镜头。把这套规则交给 Opus 调了几次后，效果出乎意料地好。\n​​新在哪​​：用自定义 skill 约束 AI 的镜头语言和元素过渡逻辑，而不是让 AI 自由发挥；最终输出仅一个单 HTML 文件，非常轻量。\n​​省在哪​​：不需要复杂的工程架构，一个 HTML 文件就能跑完整段动效。\n​​强在哪​​：镜头连贯性强、元素形变过渡自然、整体轻量。\n二、实现方式与技术原理\n​​从 0 到成品的步骤​​：\n设计 skill，定义核心规则：镜头必须连贯、元素必须形变过渡、镜头不能单一固定。\n将 skill 交给 Opus，让它根据规则生成动效。\n让 Opus 调了几次参数和细节，直到效果满意。\n最终输出为一个单 HTML 文件。\n​​依赖机制​​：笔记未明确说明底层是插件、hook、RAG 还是 Agent 编排，只提到\"用 skill 发给 Opus 让它调\"，推测是通过某种 AI 编程/Agent 工具将 skill 规则注入给 Opus 执行。\n​​最有技术含量的部分​​：skill 的设计——把\"镜头连贯性\"和\"元素形变过渡\"抽象成可执行的规则，让 AI 理解并遵守，这是整个方案的核心。\n三、AI 与工具清单\n工具/模型\t负责什么\t免费/付费\n​​Opus​​\t根据 skill 规则生成和调试动效\t笔记未提及\n​​Remotion​​\t作者之前用过的动效工具（作为对比）\t笔记未提及\n​​HyperFrames​​\t作者之前用过的动效工具（作为对比）\t笔记未提及\n​​自定义 skill​​\t定义镜头连贯性和元素形变规则\t笔记未提及\n\n笔记中未明确说明各工具的版本号和付费状态。\n\n四、项目来源与链接\n​​GitHub 地址​​：未提供。作者提到\"过几天开源出来给大家用\"，但笔记发布时还未公开仓库地址。\n​​其他链接​​：未提供。\n​​是否基于开源项目二次创作​​：笔记未说明该 skill 是否基于 Remotion 或 HyperFrames 二次开发，仅提到之前用这两个工具\"很累\"，所以自己设计了新的 skill。\n五、视频中出现的提示词/指令\n\n视频中未出现具体的提示词或指令原文，笔记正文和评论区都没有展示作者实际输入给 Opus 的完整 prompt。\n\n六、复现指南\n\n由于作者尚未开源，目前无法完整复现。但基于笔记内容，可以梳理出​​思路层面的复现路径​​：\n\n​​前置条件​​：需要能调用 Opus 的 AI 编程环境，以及理解如何定义和传递 skill 规则。\n​​最简行动清单​​：\n明确你的动效需求（比如要做什么风格的视频、镜头怎么切换）。\n设计 skill 规则：强制元素形变过渡、镜头多样化、避免固定镜头。\n将规则交给 Opus，让它生成初始版本。\n迭代调试，让 Opus 调整细节直到满意。\n输出为单 HTML 文件。\n​​难点与坑​​：笔记未提及具体踩坑点，但作者提到 Remotion 和 HyperFrames 在\"镜头连续性\"和\"元素稳定性\"上有架构层面的问题，这说明让 AI 保持镜头连贯性本身是有挑战的，需要 skill 规则设计得足够严格。\n七、最该记住的关键点\n\n用自定义 skill 约束 AI 的镜头语言和元素过渡逻辑，比直接用现成工具（Remotion / HyperFrames）更可控；最终输出单 HTML 文件，轻量且易复用。\n\n作者说\"过几天开源\"，如果你关注这个项目，可以留意他后续的开源更新。等仓库公开后，可以直接看代码和文档来复现。\n\n你平时做动效更偏好哪种风格？是偏 MG 动画、数据可视化，还是产品演示类的？"}, {"idx": 28, "id": "6aaa56ff000000000b00ea14", "title": "2600万粉博主James谈媒体背后的生意", "cat": "新产", "sug": "keep", "reason": "保留判据2/3：内容策略+注意力变现+团队分工方法论，直接可迁移到其小红书运营主线，脱离工具版本长期有效", "what": "2600 万粉博主 James（街头采访富豪起家）谈创作者经济的商业方法论", "use": "核心可复用：'Where attention goes, revenue flows'；转型策展者——提出'所有人都想问但没人直白问'的问题（如'你怎么富起来的'），借受访者信用背书；50 粉时发 400 条用数量逼出质量；爆款后接付费广告放大并组建团队分工；六条变现线（广告/品牌/代理/付费社区/咨询/演讲）；把每次拒绝当数据", "next": "", "detail": "", "cost": "营收等数据为访谈自述且各源有出入（300 万 vs 70 万美元），需辩证看", "quote": "", "quote_src": "", "text": "# v3-分区版 v3（回溯）\n# 2600万粉博主James谈媒体背后的生意\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6aaa56ff000000000b00ea14?xsec_token=ABAbmr5EN29pMRvORPCQxbmKckvuMlLHWfQCk0BeSddLw=&xsec_source=pc_user\n\n根据你引用的笔记，我结合搜索到的公开信息，对这条关于 James（School of Hard Knocks 创始人）的访谈笔记做了深度拆解。\n\n一、谁在讲、讲什么\n​​创作者身份​​：James（James Dumoulin），School of Hard Knocks 创始人，2021 年作为 德克萨斯大学 大一新生起步，目前全平台超 2600 万粉丝（搜索补充为约 2100 万），月流量约 2.5 亿次。\n​​核心经历​​：最初做\"年轻人讲商业建议\"内容，粉丝停滞在 2.5 万后转型为街头采访富豪，问出标志性问题\"你怎么富起来的\"。2022 年在 SXSW 偶遇 Mark Cuban 并成功采访，视频爆火后逻辑反转——名人开始主动找他们采访。\n​​成绩数据​​：团队约 100 名员工，与两位联合创始人共同运营；业务 collectively 达到每月超过 300 万美元营收（搜索补充为月营收约 70 万美元，利润约 40 万美元）。\n​​针对人群​​：年轻一代创业者、内容创作者、想进入创作者经济的人。\n​​解决困惑​​：大多数内容创作者穷困潦倒，是因为不懂媒体背后的商业逻辑；如何从做内容过渡到做赚钱的生意。\n二、核心观点\n​​最想传达的主张​​：​​\"Where attention goes, revenue flows.\"​​（流量去哪里，钱就去哪里）。掌握注意力，就能成为行业中最富有的人。\n​​完整论证逻辑链​​：\n大多数内容创作者穷困，是因为不懂媒体背后的生意。\n现在竞争的本质不是谁的产品或服务更好，而是谁能通过内容和付费营销抢占注意力。\n内容火了之后，必须接入付费广告放大，形成规模化收入。\n但一个人走不远，必须组建团队——自己负责出镜和内容创作，合伙人负责运营、招聘、客户交付和社区。\n最终从单一内容收入，扩展到广告、品牌合作、付费社区、咨询代理等多条变现线。\n​​反常识观点​​：\n​​\"It's no longer about who has the best product or service anymore.\"​​ 现在拼的不是产品或服务本身，而是谁能通过内容和付费营销抢占注意力。\n大多数创作者穷，不是因为他们不会做内容，而是因为他们不懂媒体背后的商业逻辑。\n不要一个人战斗。\"If you're fighting alone, you can go faster. If you're fighting with your team, you go longer.\"（一个人走得快，一群人走得远。）\n三、具体怎么做\n\n​​完整路径分几步​​：\n\n​​找到核心问题​​：提出一个所有人都想问但没人直白问的问题。James 的问题是\"你怎么富起来的\"，简单、无门槛、情感共鸣强。\n​​转型为策展者​​：放弃\"我来教你\"，改成\"我去问真正知道答案的人\"。用被采访者的信用为自己背书，解决新人缺乏信任的问题。\n​​高频持续输出​​：即使只有 50 个粉丝时，也坚持发了 400 条内容。靠数量逼出质量，持续接近三年。\n​​放大爆款​​：遇到 Mark Cuban 采访爆火后，明确工业化路线——高频出差，参加 SXSW、创业峰会等高净值人群聚集的活动，每天发多条内容。\n​​组建团队​​：自己负责出镜和内容创作，两位联合创始人负责运营、招聘、客户交付和社区管理。\n​​多元化变现​​：从广告和品牌合作，扩展到付费社区（6000 名创业者）、咨询代理（为亿万富翁做个人品牌营销），形成多条收入线。\n\n​​各环节判断标准和选择依据​​：\n\n​​内容选题​​：选\"所有人都想问但没人直白问\"的问题，保证答案不会重复、情感弧线强。\n​​采访对象​​：优先找有结果的人（亿万富翁、企业家），用他们的信用为自己背书。\n​​团队分工​​：自己专注最擅长的内容创作，其他业务交给合伙人，确保公司整体运转。\n\n​​他强调\"不要做什么\"​​：\n\n不要一个人战斗，单打独斗走不远。\n不要只懂做内容而不懂媒体背后的生意。\n不要等所有信息齐了再行动——等所有信息齐了，机会早被人抢走了。\n四、案例与数据（原样照抄）\n​​James 自己的案例​​：\n2021 年作为德克萨斯大学大一新生起步，2025 年全平台超 2600 万粉丝。\n团队约 100 名员工，两位联合创始人。\n业务 collectively 达到每月超过 300 万美元营收。\n采访过 Justin Sun、Mark Cuban、Tom Cruise、Will Smith 等。\n​​引用的别人案例​​：\n一位 81 岁的有线电视公司创始人，以 37 亿美元出售公司。\nHobby Lobby 创始人，俄克拉荷马州最富有的人之一。\n​​提到的平台、渠道、工具​​：\n笔记未提及具体平台名称，但搜索补充显示其内容覆盖 YouTube、Instagram 等全平台。\n五、可落地建议\n\n​​零起点今天就能做的第一个动作​​：\n\n找到一个你所在领域里\"所有人都想问但没人直白问\"的核心问题，把它变成你的内容产品。\n比如你是做健身的，不要问\"怎么减肥\"，而是问\"你减肥失败过多少次\"；你是做创业的，不要问\"怎么赚钱\"，而是问\"你破产过吗\"。\n\n​​前中后三期分别聚焦什么​​：\n\n​​前期（0-1 万粉）​​：聚焦内容密度和样本量。不要发了 10 条没人看就放弃，先发到 100 条、400 条，用数量逼出质量。\n​​中期（1 万-100 万粉）​​：聚焦找到可复制的爆款公式，并开始组建小团队，把内容制作和运营分工。\n​​后期（100 万粉以上）​​：聚焦多元化变现——广告、品牌合作、付费社区、咨询代理，不要只靠单一收入线。\n\n​​风险、代价、避坑提醒​​：\n\n​​拒绝羞耻症​​：James 平均要经历 50 次拒绝才能换来一次愿意停下来对话的机会。把拒绝当成数据，而不是失败。\n​​不要等完美​​：70% 完成度的内容发出来，比 120% 完成度但永远不发出来的内容强一万倍。\n​​警惕\"学到=完成\"的认知陷阱​​：从信息到动作的转化速度，才是最被低估的稀缺能力。\n​​别把野心讲给格局狭隘的人听​​：选择你的环境，去创业氛围浓厚的地方，和愿意支持你野心的人在一起。\n六、视频中出现的提示词/话术\n\n视频中未出现具体的提示词、文案模板或操作指令。James 的核心话术是他在街头采访时反复使用的问题：\n\n​​\"Excuse me, sir... how did you get rich?\"​​（打扰一下，先生……你是怎么富起来的？）\n这是他的核心产品——一个问题本身，简单到荒谬、真诚到有点冒犯，但触碰到了每个人内心真实的角落。\n七、金句摘录\n​​\"Where attention goes, revenue flows.\"​​（流量去哪里，钱就去哪里。）\n​​\"Most content creators are broke because they don't understand the business behind media.\"​​（大多数内容创作者穷困潦倒，是因为他们不懂媒体背后的生意。）\n​​\"If you're fighting alone, you can go faster. If you're fighting with your team, you go longer.\"​​（一个人走得快，一群人走得远。）\n​​\"Every no is a possible yes.\"​​（每一次拒绝，都是通向\"是\"的一步。）\n​​\"It's no longer about who has the best product or service anymore. It's literally about beating people through content, through paid marketing.\"​​（现在拼的已经不是谁的产品或服务更好，而是谁能通过内容和付费营销战胜别人。）\n\n补充一点：从搜索到的信息来看，James 的商业模式本质上是​​用低成本的自然流量内容，触达高净值受众，再通过高客单价的 B 端服务（咨询、代理、社区）变现​​。一条内容，六种货币化方式——平台广告、品牌合作、内容代理、付费社区、咨询、演讲。这才是他真正\"懂媒体生意\"的地方。"}, {"idx": 29, "id": "6a22bfcd000000003501d4ca", "title": "美国\"新股神\"Serenity 是如何养成的？", "cat": "学习闭环", "sug": "drop", "reason": "删除判据5（实盘炒股理财收益导向内容，带高倍收益诱导跟风）＋删除判据1（标的与涨幅数据会过时）＋删除判据4（投资非其主线，供应链瓶颈思维可自行从行业认知获得，不必留存此包装）", "what": "拆解 X 平台「新股神」Serenity 靠 AI 供应链瓶颈选股的方法论", "use": "可抽象为产业链瓶颈推演思路（问物理瓶颈/唯一弹性/商业化路径/财务弹性/市场定价），但全部内容以美股标的和收益数据包装呈现", "next": "最小下一步：搜索“紫苏叶理论 投资”或“Serenity 投资框架”；复刻目标：不适用", "detail": "", "cost": "高风险：通篇 4502% 单年收益、两年 225 倍回报等收益数据，属典型炒股理财引流叙事；标的与涨幅随时效过期", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 美国\"新股神\"Serenity 是如何养成的？\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6a22bfcd000000003501d4ca?xsec_token=ABBFxISZTZYsFlhOS7MRAO-063tkd67FIrrDPK6d4ETzE=&xsec_source=pc_user\n\n一、内容定位\n​​领域​​：投资、股市、商业思维、AI 供应链分析\n​​作者身份​​：视频博主\"巨先生\"，内容聚焦于拆解海外投资大 V 的投资方法论\n​​核心目的​​：向观众传授 Serenity 的\"紫苏叶理论\"，帮助理解如何通过挖掘 AI 产业链中被忽视的瓶颈环节来获取超额收益，而非盲目追涨热门股\n二、内容详细讲解\n\n​​1. Serenity 是谁​​\n\nSerenity 是 X 平台（原推特）上爆火的新晋股票大神，被誉为\"AI 供应链教父\"。其头像是一名白头发的二次元少女，因此被粉丝称为\"白毛女股神\"。据 Serenity 自述，他此前是一名 AI 研究科学家。\n\n​​收益数据​​：2026 年开年来，股票收益峰值达到 ​​4,502.45%​​，相当于本金翻了 46 倍；过去两年累计回报率达 ​​225 倍​​。\n​​选股记录​​：根据公开数据，其推荐的 35 只股票仅有 4 只下跌，其余收益率都超过了 100%，最高的涨了 19 倍。\n​​影响力​​：超越马斯克成为推特付费粉丝最多的大 V。- ​​比喻映射​​：在 Serenity 看来，英伟达、Google、AMD 等大热公司是 AI 这顿大餐里的\"烤肉股\"，而 Serenity 致力于在股市中寻找像紫苏叶一样的公司。\n​​选股标准​​：属于产业链的卡点，在产业中具有不可替代性；若其短缺会给行业带来供应瓶颈；同时因为人们往往像忽视紫苏叶一样忽视它的存在，因此这些公司股价远低于潜在价值，具有强劲的爆发潜力。\n\n​​3. 经典案例一：AXT（磷化铟衬底厂商）​​\n\n​​背景​​：2022 年初 OpenAI 还未惊艳世界，Serenity 便敏锐捕捉到未来需求。大量的算力中心、算力中心间的数据传输需要光模块，光模块中的核心素材是激光器，激光器的核心驱动是光芯片，而光芯片必须建构在磷化铟衬底上。\n​​市场格局​​：AXT 和住友电工、JX 金属垄断了全球 90% 的磷化铟衬底供应。\n​​操作与验证​​：Serenity 在 2022 年初 AXT 股价 12 美元时，定下 150 美元的目标价。此后 AXT 股价一度回调到 5 美元以下。2025 年 12 月，Serenity 在 AXT 15 美元时再次公开唱多，认为 2026 年磷化铟衬底缺口达 70%，且 2027 年需求还会翻倍。市场后来验证了判断，AXT 股价翻了 7 倍，达到 106 美元。\n\n​​4. 经典案例二：树莓派（英国编程教学与计算机公司）​​\n\n​​背景​​：2026 年 2 月，OpenClaw 爆火，公众对部署 OpenClaw 的狂热导致苹果 Mac mini 一机难求。\n​​逻辑推演​​：Serenity 察觉到树莓派的产品会是 Mac mini 的廉价平替。Mac mini 大卖对苹果这家万亿市值的公司来说营收影响微乎其微，但树莓派的电脑大卖对这家当时 5.4 亿市值的公司来说，是强劲的营收增长。\n​​预测与验证​​：Serenity 大胆预测树莓派一季度营收会同比增长 48% 至 58%，而华尔街分析师仅预测会增长 14%。财报印证了判断，营收同比增长 58%，年内股价涨幅超过 190%。\n\n​​5. 其他挖掘案例​​\n\nSerenity 用同样的方法挖掘了以下公司：\n\n​​Lumentum​​（激光器厂商）：涨幅 135%\n​​Coherent​​（激光器厂商）：涨幅 126%\n​​SIVE​​（激光器厂商）：涨幅 1929%\n​​AAOI​​（光模块制造商应用光电）：涨幅 428%\n​​Marvell​​（光芯片设计商）：黄仁勋公开宣称其市值会达万亿，Serenity 在 2025 年 9 月便大力唱多，此后涨幅超过 300%\n\n​​6. 投资逻辑总结​​\n\nSerenity 的超额收益常来自那些认知偏差的部分。当风口潮头的弄潮儿吸引了全场目光，公众往往会短暂忽视潮水之下支撑产业的基础。深入挖掘风口背后的供应链组成，不断追问是否有哪个环节是不可或缺、产能有限且市场还未发现的瓶颈，并基于专业知识通过真实的数据分析验证，才有可能触碰到那个潮水之下拥有动辄翻倍潜力的超级股票。\n\n三、核心知识点\n​​关键结论​​：真正的暴利藏在产业链最底层的隐性刚需，而非表面上的热门巨头。在所有人看不懂的冷门角落，提前卡位整条产业链绕不开的稀缺节点，静待逻辑兑现，是获取超额收益的核心。\n​​易错点提醒​​：\n不要盲目跟风抄作业。Serenity 的持仓逻辑建立在深厚的产业认知和专业数据验证上，普通散户若没有相应的研究能力，盲目跟风容易被割韭菜。\n小市值意味着流动性差、冷门意味着信息不透明、卡脖子则意味着一旦有替代路线出现估值可能瞬间崩塌。\n​​作者小贴士​​：Serenity 本人非常清楚风险，他会讲风险、讲替代方案，甚至用 AI 模型反向辩论自己的逻辑，先假设自己可能错，再看逻辑是否站得住脚。\n四、视频中出现的提示词/操作文字\n\n视频中未出现具体的 AI 提示词、搜索词或软件指令。\n\n五、实用信息清单\n​​紫苏叶理论五步推演法​​（综合笔记与补充资料）：\n​​问物理瓶颈​​：AI 集群继续扩大十倍，什么东西先不够用？\n​​问唯一弹性​​：这东西是不是物理上必须存在，有没有可替代的方案？\n​​问商业化路径​​：不能只是理论上重要，要确认它能赚钱。\n​​问财务弹性​​：打到大公司是噪音，打到小公司就是改变命运。\n​​问市场定价​​：如果前面四步走完发现市场还没有反应过来，那才是下注的时候。\n​​Serenity 关注过的核心标的​​：AXT、SIVE、Lumentum、Coherent、AAOI、Marvell、树莓派。\n​​关键产业链环节​​：磷化铟衬底、光芯片、激光器、光模块、存储芯片。\n六、一句话总结最值得收藏的点\n\n当大时代开始扩张，不要只盯着最亮的灯，要去看灯泡后面的电线、线圈体、变压器和开关——别人看见金枪鱼他去找紫苏叶，本质上是问了一个更底层的问题：​​如果 AI 真的改变了世界，那么最先不够用的到底是什么？​​\n\n注：以上内容基于笔记及公开资料整理，不构成任何投资建议。股市有风险，投资需谨慎。"}, {"idx": 30, "id": "689ef76c000000001d00de4e", "title": "2025年导游资格证（湖南考区）通知", "cat": "归档观察", "sug": "drop", "reason": "删除判据1（已过时的考试情报，报名考试查分全部结束）+ 删除判据4（无导游职业规划，与主线无关）。", "what": "湖南省文旅厅 2025 年导游资格考试的官方通知全文整理。", "use": "报名/审核/交费/考试/查分时间线全部属于 2025 年周期，已整体结束。", "next": "最小下一步：将笔记归档至\"过期通知\"文件夹；复刻目标：不适用", "detail": "", "cost": "通知已过时；报名费 300/200 元，与他的规划无关。", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 2025年导游资格证（湖南考区）通知\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/689ef76c000000001d00de4e?xsec_token=ABmPCh2MdopC1XL6jSgYUAdLPZ3m0COhAlTyFORiOyEWs=&xsec_source=pc_user\n\n根据你引用的笔记，这是一份湖南省文化和旅游厅发布的​​2025年全国导游资格考试（湖南考区）官方通知​​。下面按你的要求完整整理。\n\n一、内容定位\n​​领域​​：职业资格考试 / 导游资格证\n​​作者身份​​：湖南省文化和旅游厅（官方发布）\n​​核心目的​​：告知考生2025年湖南导游资格考试的报名条件、流程、科目、时间、收费及证书核发等全部事项，帮助考生顺利完成报名和备考。\n二、内容详细讲解\n报名条件\n​​中华人民共和国公民​​\n​​具有高级中学、中等专业学校或者以上学历​​\n​​身体健康​​\n​​具有适应导游需要的基本知识和语言表达能力​​\n报名程序（网上报名）\n​​网上报名​​：2025年7月31日9:00至9月5日17:00，通过​​全国导游资格考试网上报名系统​​（网址：mrct.cn，国家旅游监管服务平台）或\"文旅之声\"微信公众号提交。湖南省提供普通话、英语、日语、俄语、法语、德语、西班牙语、朝鲜语8个语种，每位考生一次只能选报1个语种。\n​​初次报考考生​​需上传：本人近期1寸白底免冠证件照片、身份证扫描件（正反面，有效期须覆盖考试日期）、学历证书扫描件（中等职业学校旅游类专业2026届毕业生需提交学校证明）。\n​​加试报考考生​​（已获导游资格证书需转换其他语种）需上传：本人近期1寸白底免冠证件照片、身份证扫描件、原资格证书扫描件。\n​​报名信息审核​​：2025年7月31日9:00至9月10日17:00，湖南省文化和旅游厅专人审核，审核通过后信息不再变更。\n​​交费​​：审核通过后可交费，截止时间为2025年9月17日17:00。交费成功后因个人原因不能参加考试的，不予退费。\n​​打印准考证​​：2025年11月17日9:00起，通过报名系统或\"文旅之声\"微信公众号下载并自行打印。\n考试科目和考试大纲\n​​笔试​​（机考）：《政策与法律法规》《导游业务》《全国导游基础知识》《地方导游基础知识》。其中《政策与法律法规》与《导游业务》合并为1张试卷，《全国导游基础知识》与《地方导游基础知识》合并为1张试卷，每张试卷满分100分，考试时间均为90分钟。\n​​现场考试（面试）​​：科目为《导游服务能力》，按《全国导游人员资格考试现场考试工作标准（试行）》执行。\n​​加试考生​​仅须参加现场考试（面试）。\n​​2025年考试大纲​​可通过文化和旅游部政府门户网站（www.mct.gov.cn）下载。\n湖南现场考试（面试）考核景点\n​​中文类考生（8个景区）​​：湖南博物院长沙马王堆汉墓陈列、韶山毛泽东同志故居、岳阳楼景区、天子山旅游区、天门山旅游区、南岳衡山旅游区、花明楼景区、东江湖旅游区。\n​​外语类考生（5个景区）​​：湖南博物院长沙马王堆汉墓陈列、韶山毛泽东同志故居、天子山旅游区、天门山旅游区、岳阳楼景区。\n考点设置和考试时间\n​​笔试考点​​：长沙市、衡阳市、湘潭市、邵阳市、岳阳市、常德市、张家界市、郴州市、怀化市和湘西自治州，共10个考点。\n​​现场考试考点​​：长沙市、衡阳市、常德市、张家界市、郴州市、怀化市和湘西自治州，共7个考点。\n​​笔试时间​​：2025年11月22日，9:00-10:30（《政策与法律法规》《导游业务》），10:30-12:00（《全国导游基础知识》《地方导游基础知识》）。\n​​现场考试时间​​：2025年11月24日-12月22日完成，具体时间详见现场考试准考证。\n收费\n​​初次报考考生​​：300元/人\n​​加试报考考生​​：200元/人\n考试结果公布与复核\n​​成绩公布​​：2026年3月2日9:00起，通过报名系统或\"文旅之声\"微信公众号查询。\n​​合格标准​​：笔试成绩、现场考试成绩和总成绩分别划定分数线，三者均满足划线要求为合格。加试考生以现场考试成绩满足划线要求为合格。考试成绩当年有效。\n​​成绩复核​​：自考试结果发布之日起5个工作日内，书面向湖南省文化和旅游厅提出复核申请，复核结果为最终结果。\n证书核发\n由湖南省文化和旅游厅向考试合格的考生核发\"导游资格证书\"。\n领取时需本人带与报名信息一致的材料原件（有效期内身份证和学历证书）到指定地点核验后领取。\n其他事项\n​​港澳台居民报考​​：香港、澳门永久性居民中的中国公民可提供港澳居民居住证；台湾居民须提交台湾居民居住证或台湾居民来往大陆通行证。\n​​中等职业学校旅游类专业2026届毕业生​​可以报名参加考试，考试合格且取得毕业证书后按证书核发要求领取导游资格证书。\n联系方式\n​​报名网站技术问题咨询​​：021-61948895\n​​报名审核咨询​​：0731-82213011\n三、核心知识点\n​​笔试和面试必须同时参加​​，加试考生（已获导游资格证需转换语种）仅参加面试。\n​​笔试两科合并​​：《政策与法律法规》+《导游业务》为一张卷，《全国导游基础知识》+《地方导游基础知识》为一张卷，每卷90分钟。\n​​面试景点随机抽取​​，中文类8选1，外语类5选1，需提前准备好对应导游词。\n​​交费后不退费​​，报名审核通过后信息不再变更，务必确认信息准确再交费。\n​​身份证有效期必须覆盖考试日期​​，否则无法通过审核。\n​​成绩当年有效​​，不保留到下一年。\n四、视频中出现的提示词/操作文字\n\n笔记为图文通知形式，未出现视频口播或操作演示，因此​​视频中未出现​​提示词或操作文字。\n\n五、实用信息清单\n报名与考试关键时间线\n事项\t时间\n网上报名\t2025年7月31日9:00 - 9月5日17:00\n信息审核\t2025年7月31日9:00 - 9月10日17:00\n交费截止\t2025年9月17日17:00\n打印准考证\t2025年11月17日9:00起\n笔试\t2025年11月22日 9:00-12:00\n现场考试\t2025年11月24日 - 12月22日\n成绩公布\t2026年3月2日9:00起\n备考资料推荐（联网补充）\n​​官方教材​​：中国旅游出版社出版的全国导游资格考试统编教材，涵盖政策与法律法规、导游业务、全国导游基础知识、地方导游基础知识。\n​​考试大纲​​：在文化和旅游部官网（www.mct.gov.cn）下载2025年全国导游资格考试大纲。\n​​刷题工具​​：导游之家网站提供笔试和面试机考模拟练习；也可使用雷大大等APP刷章节题和真题。\n​​导游词准备​​：根据湖南面试大纲的8个中文景点或5个外语景点，结合官方大纲要求撰写导游词，建议用自己的语言逻辑整合，避免照搬网络原文。\n面试考试形式与分值占比（联网补充）\n​​考试形式​​：人考（有评委老师），非机考。\n​​考试时间​​：15分钟。\n​​分值占比​​：湖南概况5%、景点讲解与景点知识问答40%、导游服务规范10%、应变能力10%、综合知识10%、礼貌礼仪5%、语言表达25%。\n​​讲解时间​​：湖南概况2分钟，景点讲解5-7分钟。\n​​问答题​​：景点知识3题（每题50秒）、导游规范1题（80秒）、应变能力1题（80秒）、综合知识1题（80秒）。外语类考生还需加试口译（中译外、外译中各1题，每题80秒）。\n机考模拟与考场须知（联网补充）\n​​机考模拟网站​​：搜索\"导游之家\"，进入导游资格考试模块进行笔试和面试模拟。\n​​考场要求​​：提前30分钟进场，迟到15分钟禁止入场；凭身份证和准考证原件刷证入场，电子证件无效；禁止携带手机、手环、纸笔等物品。\n​​笔试时长​​：每场90分钟，两科连考中间不休息，全程不可提前离场。\n备考小贴士（联网补充）\n不要一上来就闷头死学，先规划每天的任务量，细水长流比考前突击更有效。\n资料不用囤太多，教材和网课各选一套够用就行，避免越学越焦虑。\n导游业务可以把自己当成实际带团的导游，顺着真实流程捋一遍知识点。\n法律法规不用通篇背诵，重点抓处罚标准、权责划分等核心考点。\n背知识点时手脑并用，动手写关键词、画小框架，记忆更牢固。\n不要重笔试轻面试，很多人笔试分数高但面试没发挥好直接挂了，两边要一起准备。\n导游词可以按官网大纲准备，同一个景区多找几篇，用自己的话整合，辞藻不要求华丽，通俗易懂即可。\n六、一句话总结最值得收藏的点\n\n​​2025年11月22日笔试、11月24日起面试，初次报考300元、加试200元，报名截止9月5日，面试从湖南8个中文景点或5个外语景点中随机抽1个讲解，笔试面试均合格才能拿证。​​\n\n如果你正在备考，建议先确认自己是否符合报名条件，然后尽快在报名系统里提交信息，别错过9月5日的报名截止和9月17日的交费截止。面试景点导游词要尽早开始准备，每天背一篇，考前一定全背熟。\n\n你目前是打算报中文类还是外语类？如果是外语类，需要额外准备口译测试，时间上会更紧张一些。"}, {"idx": 31, "id": "6a730fc6000000003203237e", "title": "增程式汽车真的省油吗？", "cat": "学习闭环", "sug": "drop", "reason": "删除判据4（纯理工科普，与他的 AI 内容创作/知识管理/小红书运营/Vibe Coding/教学主线无关，也不属于判据 4 那种生活里难系统学到的隐性规则）；且无工具、无步骤、无提示词。", "what": "李永乐老师讲发动机四冲程、扭矩与功率、涡轮增压与混动三条技术路线的完整科普。", "use": "扭矩看加速、功率看最高时速、功率=转速×扭矩；奥托/阿特金森/米勒循环的热效率演进；燃油机热效率天花板约 40%、电动机效率 90% 以上；串联增程省油、并联功率大、串并联兼顾。", "next": "最小下一步：收藏该笔记并观看完整视频；复刻目标：不适用", "detail": "", "cost": "无", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 增程式汽车真的省油吗？\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6a730fc6000000003203237e?xsec_token=ABEwygH14UXIvyvelwrTmrC0TlfqZ7oGQnACU2usey88Y=&xsec_source=pc_user\n\n根据你引用的笔记，这是​​李永乐老师​​讲解汽车发动机原理与混动技术的一期科普视频。下面我按你的要求完整整理。\n\n一、内容定位\n​​领域​​：汽车科普 / 物理知识应用\n​​作者身份​​：李永乐老师（科普博主）\n​​想教会观众什么​​：理解汽车发动机的基本原理（气缸、排量、扭矩、功率、涡轮增压），以及混动汽车为什么更省油、有哪些技术路线。\n二、内容详细讲解\n\n视频按以下顺序展开讲解：\n\n​​引入对比​​：1907年劳斯莱斯银魅，7升排量，输出功率仅36千瓦；现代家用汽车排量不到其1/4，输出功率却是其3倍多，引出问题——为什么？\n\n​​气缸与排量​​：\n\n气缸是容纳油气混合物的腔，汽油在气缸内燃烧。\n气缸上方有进气口和排气口，下方有活塞，活塞连着连杆和曲轴。\n发动机工作分4个阶段：​​吸气​​（进气口打开，活塞向下，吸入油气混合物）→ ​​压缩​​（进气口关闭，活塞向上，压缩混合物）→ ​​做功​​（火花塞点燃，推动活塞向下）→ ​​排气​​（出气口打开，活塞向上，气体排出）。\n这4个阶段循环进行，做功阶段汽油爆炸推动活塞，让汽车前进。\n​​排量​​：活塞运动一次所扫过的体积，约等于每次吸入的油气混合物体积。排量越大，吸入越多，功率一般越大。\n单气缸曲轴转两圈只有半圈获得动力，运行不平稳；4个气缸交替运行，动力又大又平稳。豪华车还有6缸、8缸甚至12缸（如阿斯顿马丁）。\n气缸越多、排量越大，动力越强劲，油耗也越多。\n​​扭矩与功率​​：\n​​扭矩​​：发动机动力乘以力臂，类似扳手原理。扭矩经过变速箱和轮胎，表现成汽车驱动力。峰值扭矩越大，驱动力越大，加速度越大，提速表现好。推背感、百公里加速时间一般跟扭矩有关。\n​​功率​​：代表发动机做功的快慢。公式：功率 = 驱动力 × 速度。最大功率越大，能达到的最大速度越大，即最大功率决定最高时速。\n扭矩与功率的关系：功率 = 转速 × 扭矩。转速是曲轴每分钟转的圈数。功率一定时，低速转动扭矩大，高速转动扭矩小。\n举例：拖拉机负载重、对速度要求不高，调到低转速大扭矩；小汽车高速运行时处于高转速低扭矩状态，跑起来轻快。\n​​涡轮增压技术​​：\n汽油机工作时大量能量通过废气和机械损耗消耗，转化比例叫发动机效率。\n飞机发动机用增压技术是因为高空空气稀薄，需要压缩进气；汽车在地面空气充足，自然吸气靠大气压把油气混合物压进气缸。\n自然吸气弊端：进入气缸的空气有限，燃烧后排出的废气温度依然很高，浪费能量。\n涡轮增压原理：排气口出来的高温废气进入涡轮，推动主动涡轮叶片转动，带动进气口的从动涡轮叶片转动，为进气口空气增压、加大进气量。同等排量下，进来的空气更多，汽油燃烧更充分，获得更多动力输出。\n结果：小排量汽车也能获得大排量一样的动力输出，提高扭矩、功率和燃油经济性。\n​​发动机热效率演进​​：\n1860年第一台内燃机诞生，效率仅4.5%。\n1876年，奥托发明四冲程煤气内燃机（即​​奥托循环​​），热效率提高到14%。\n1883年，戴姆勒和迈巴赫造出第一台立式四冲程汽油机，热效率达20%。\n上世纪中后期大排量发动机随处可见，有些百公里油耗达22升。\n后来改进奥托循环，出现​​阿特金森循环​​和​​米勒循环​​。\n阿特金森循环（1882年英国工程师詹姆斯·阿特金森发明）：高速时转动效率比奥托循环高，但低速时效率低、扭矩差，一直未应用。直到1997年混合动力开山鼻祖​​丰田普锐斯​​出现，低转速用电动机驱动，高转速用燃油机，解决了短板，才真正进入市场。\n米勒循环（1940年代美国工程师罗尔夫·米勒发明）：对奥托循环的改进，最早用在1990年代的马自达汽车上。\n现在燃油发动机效率已达30%以上，有的逼近40%，但这只在最合适的扭矩和转速下实现。发动机热效率图像像等高线，需要尽量保持合适转速。手动挡通过精巧切换档位可实现，平均油耗低于自动挡。\n但40%基本是燃油发动机的天花板，单纯靠燃油发动机无法继续提高。\n​​混动汽车原理​​：\n电动机效率可达90%以上。一台车装燃油发动机和电动机：低速时燃油发动机效率低，用电动机驱动；高速时需要大功率或加速超车需要瞬时高扭矩，用燃油发动机。发挥二者优势。\n混动车兼有燃油车（功率大、无里程焦虑）和电动车（驾驶体验好、加速快、节能）的优点。\n​​混动三大技术路线​​：\n​​串联模式（增程式）​​：燃油发动机驱动发电机，发电机带动电动机，电动机驱动汽车前进。电池调节电能——低速时发电机发电多、电动机用电少，多余电能储存在电池；猛加速时发动机发电少、电动机用电多，电池向电动机提供额外电能。疑问：为什么不用燃油发动机直接驱动？答案：通过这一折腾，能保证发动机始终处于高效率的扭矩和转速下，提高燃油利用率。\n​​并联模式​​：燃油发动机和电动机地位相同，动力都输出给汽车。除了燃油经济性，还能带来较大汽车功率。举例：燃油发动机功率100千瓦，电动机功率80千瓦，整车最大输出功率可达180千瓦，起步加速性能好。麻烦在于技术复杂，需要一套复杂的离合器和变速器系统将两个动力混合。\n​​串并联结合模式​​：至少需要一台燃油发动机和两台电动机，可理解为一台增程式系统又并联了一台电动机。汽油发动机和两台电动机的动力可随意混合。刚起步时用并联电动机驱动（纯电模式，电动机扭矩大、噪音小）；超车时深踩油门，燃油发动机和并联电动机一起输出动力（并联模式）；爬坡超车时则混合驱动。\n三、核心知识点\n\n​​关键结论​​：\n\n扭矩决定瞬时加速能力，功率决定最高时速。\n涡轮增压通过废气推动涡轮叶片，加大进气量，让小排量获得大排量动力，提高燃油经济性。\n燃油发动机热效率天花板约40%，电动机效率可达90%以上，混动汽车结合二者优势。\n串联（增程式）更省油，并联功率大，串并联结合兼顾两者。\n\n​​容易搞错的要点​​：\n\n很多人疑惑增程式\"油转电\"是不是浪费能量，其实关键在于让发动机始终处于高效率区间，反而提高了燃油利用率。\n排量越大动力越强、油耗越高是\"一般来讲\"，涡轮增压技术让小排量也能获得大动力。\n发动机热效率像等高线，只有在合适转速和扭矩下才能达到最高效率，不是随时都高效。\n\n​​作者小贴士​​：\n\n去4S店选车时，了解扭矩和功率的区别会让你显得更专业。\n手动挡老司机通过精巧切换档位让发动机保持合适转速，平均油耗可以低于自动挡。\n四、视频中出现的提示词/操作文字\n\n视频中未出现提示词、搜索词、软件指令或配方文本。\n\n五、实用信息清单\n​​发动机四冲程​​：吸气 → 压缩 → 做功 → 排气\n​​扭矩 vs 功率​​：扭矩看加速（推背感、百公里加速），功率看最高时速\n​​涡轮增压好处​​：同等排量下进气更多、燃烧更充分、动力更强、更省油\n​​混动三大路线对比​​：\n​​串联（增程式）​​：省油，发动机始终高效运转\n​​并联​​：功率大，加速好，技术复杂\n​​串并联结合​​：兼顾省油和大功率，至少需要一台燃油发动机 + 两台电动机\n​​发动机热效率演进​​：4.5%（1860）→ 14%（奥托循环，1876）→ 20%（1883）→ 30%~40%（现代）→ 40%是燃油机天花板\n六、一句话总结最值得收藏的点\n\n​​燃油发动机热效率天花板约40%，而电动机效率可达90%以上，混动汽车通过让发动机始终工作在高效区间、电动机负责低速和加速，实现了省油与动力的兼顾。​​\n\n补充一点：评论区有人提到\"看热效率、发电效率，理论上多次转化不如直接驱动。汽油机发电充电，不如市电慢充利用率高。增程不如插电。\" 这个观点值得思考，增程式确实存在能量多次转化的损耗，但它的核心价值在于让发动机始终工作在高效区间，具体哪种更省油还要结合实际使用场景来看。"}, {"idx": 32, "id": "6a51ead6000000001101af8e", "title": "差一分屏蔽？！Ask me anything～", "cat": "学习闭环", "sug": "drop", "reason": "删除判据3/4：四无笔记（无工具名、无步骤、无提示词、无实质内容），且高考学霸经验与其小学教师身份无关", "what": "广东第 11 名高考生的答疑帖，学习方法 PPT 在评论区", "use": "无实质展开内容，仅成绩单（701 分）和'评论区附 PPT'的指引", "next": "最小下一步：保存笔记并查看评论区附带的线下分享PPT；复刻目标：不适 =pc_user\n\n根据你引用的笔记，我为你完整整理了这条笔记的核心信息。\n\n一、内容定位\n​​领域​​：语言学习（英语自然拼读、单词记忆）\n​​作者身份​​：一位为孩子学习英语而决定开发 App 的家长\n​​核心目的​​：分享一款自研的免费自然拼读 App，帮助家长和孩子一起学好自然拼读和英语单词\n二、内容详细讲解\n\n笔记通过多张截图展示了 App 的核心功能与使用流程：\n\n​​自然拼读学习​​：App 支持单词的自然拼读拆解，例如 \"disappear\" 会拆分为 \"d-i-s-a-p-p-e-a-r\" 对应的字母发音组合，帮助孩子\"见词能读\"。\n​​音节拆分​​：将长单词按音节拆分，如 \"dis·ap·pear\"、\"con·tent\"、\"a·ware\"、\"a·bove\"，降低记忆难度。\n​​词根助记​​：提供词根词缀解析。例如：\n​​disappear​​：前缀 dis-（不；相反）+ 词根 appear（出现），表示不再出现，即消失。\n​​content​​：前缀 con-（一起，共同）+ 词根 tent（握住），源自拉丁语 contentus，原意为被一起握住、包含，引申为内容或满足。\n​​aware​​：前缀 a-（处于...状态）+ 词根 ware（小心；注意；警惕），表示处于知晓、意识到或警觉的状态。\n​​多义与例句​​：以 \"above\" 为例，展示其多义性（adv. 在上面；prep. 在...上方；adj. 上述的），并提供多个例句及中英对照，支持常速/慢放/逐词播放。\n​​拍照识别功能​​：支持拍照识别单词，但评论区反馈识别速度偏慢，且需要消耗积分。\n​​AI 解析功能​​：提供 AI 辅助分析单词用法和结构。\n​​练习模式​​：每个单词学习后都有\"去练习\"按钮，支持巩固训练。\n三、核心知识点\n​​关键结论​​：作者称这是\"国内首款免费自然拼读 App\"，主打词根助记 + 自然拼读 + 音节拆分三位一体的单词学习方法。\n​​易错/注意要点​​：\n拍照识别功能需要积分，且速度较慢。\n评论区有家长建议增加\"课本跟读\"功能，目前尚未支持。\n​​作者经验​​：作者自家孩子曾反复参加线上线下培训，但都没能学好自然拼读，因此决定自己开发 App 来解决这个问题。\n四、视频中出现的提示词/操作文字\n\n笔记截图中出现的界面操作文字如下：\n\n​​功能按钮​​：学、读、选、拆、写、去练习、详解、收藏、AI 解析、分析\n​​播放控制​​：常速、慢放、逐词\n​​难度与词频标签​​：难度 L2、词频 893、初中、中考、高中\n​​单词示例​​：sand、mine、peace、brick、content、golf、throat、aware、above、disappear\n五、实用信息清单\n​​App 名称​​：小悦单词\n​​下载方式​​：\niOS 和鸿蒙系统已在应用商店上架\n安卓用户需查看作者主页置顶笔记获取下载链接\n​​核心功能清单​​：\n自然拼读拆解\n音节拆分\n词根词缀助记\n多义解析与例句\n拍照识别（需积分）\nAI 解析\n练习巩固模式\n​​适用人群​​：小学生、初中生、高中生及需要提升词汇量的英语学习者\n六、一句话总结\n\n这款由家长自研的免费自然拼读 App，通过词根拆解 + 音节拆分 + 自然拼读的组合方式，帮孩子\"见词能读、记词更牢\"，适合亲子共同打卡学习。\n\n如果你打算给孩子试试这款 App，建议先确认安卓端的下载方式，并留意拍照识别的积分消耗规则。"}, {"idx": 34, "id": "6ac28295000000001403a4eb", "title": "早读神器——version 0.012", "cat": "学习闭环", "sug": "drop", "reason": "删除判据1（版本号与体验资格属会过时的情报）＋删除判据6（「初读/熟读双模态」他自己已有更强沉淀——课文切分规范里就实现了初读短呼吸节拍与熟读标准语义意群的双模态，无需再收别人的雏形思路）", "what": "一位语文老师自研的「课文循环读」早读工具，分初读和熟读两个模式，初衷是嗓子不舒服时解放嗓子。", "use": "只有思路可拾：初读+熟读双模态循环、课文数据存云端、规划中的语音识别/投屏/读准一句再进下一句；工具本身要去 B 站私信作者免费体验。", "next": "最小下一步：搜索\"热爱语文的林鹰鸡老师\"或该早读工具名称，了解作者背景和工具获取方式。；复刻目标：不适用", "detail": "", "cost": "工具未开源未上架、要私信别人领取；v0.012 GLB/GLTF；多次空间转换就生成多段视频再让 Codex 串成滚动漫游；滚动速度和文字排版都在 Codex 里微调；提示词和成品文件在作者文档里。", "next": "", "detail": "", "cost": "提示词原文未在笔记中给出、要关注作者另取；需要 Codex；3D 路线依赖 Rhino 建模；模板审美网站未点名。", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 后悔这么晚才用上😭3个高级页面交互动效\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6aba6b4f0000000018011c42?xsec_token=ABpml1HI-BQkBZEnVz-6lO8zGIkflya26An27gPEjewko=&xsec_source=pc_user\n\n根据你引用的笔记，这是一位建筑生/设计师分享的\"用AI和Codex制作高级网页交互动效\"的教程，核心是教你不用写代码就能做出让人眼前一亮的作品集展示页。下面按你的要求完整整理：\n\n一、内容定位\n​​领域​​：网页设计 / 作品集制作 / AI 工具应用\n​​作者身份​​：建筑生 / 设计师（从标签和口播内容判断）\n​​想教会观众什么​​：用 AI 视频工具 + Codex 实现三种高级网页交互动效——3D 模型拖拽展示、视差滚动空间漫游、按钮交互爆炸图，让作品集摆脱\"静态 PPT 感\"，在面试或申请时留下深刻印象。\n二、内容详细讲解\n\n笔记按三种交互动效依次讲解，每种都包含\"效果说明 + 制作步骤\"：\n\n​​1. 3D 模型拖拽展示页（鼠标跟随转动效果）​​\n\n​​效果说明​​：让观看者通过鼠标拖拽，从各个角度了解建筑/室内设计模型。\n​​制作方式一（视频轻量化植入）​​：\n准备好两张模型左右轴测图的图片。\n用 AI 视频工具通过​​首尾帧​​生成视频。\n把视频丢给 Codex，输入对应提示词，生成随鼠标左右转动的效果。\n​​制作方式二（全方位 3D 模型展示）​​：\n从 Rhino 中将模型导出为 ​​GLB​​ 或 ​​GLTF​​ 格式。\n把模型文件交给 Codex，输入对应提示词。\n模型就可以放在网页里，通过用户鼠标拖拽实现全方位查看。\n​​后续排版​​：去审美网站找对应网页模板进行排版，得到最终页面。\n\n​​2. 4K 视差滚动空间页（室内空间漫游）​​\n\n​​效果说明​​：观众随鼠标往下滑，画面一层一层推进，适合做室内空间漫游展示，也适合展示建筑生成分析过程。\n​​制作步骤​​：\n准备好要展示的空间图片。\n通过 AI 首尾帧 + 运镜提示词，生成建筑漫游视频。\n如果需要多次空间转换（如笔记中作者做了三次转换），就生成多段视频。\n把视频丢给 Codex，输入对应提示词。\n生成有视差滚动效果的网页，后续根据需要调整滚动速度和文字排版。\n​​延伸用法​​：有设计师用类似方式，让镜头从机房内部拉到建筑全景，再一步步展示建筑搭建过程，比单纯给一张生成分析图直观得多。\n\n​​3. 按钮交互建筑爆炸图​​\n\n​​效果说明​​：点一下按钮就能丝滑拆开建筑爆炸图，展示建筑结构和生成过程。\n​​制作步骤​​：\n分别准备好建筑的​​完整图片​​和​​爆炸图片​​。\n用前面讲的方法（AI 首尾帧）把两张图片变成爆炸视频。\n把建筑视频放到 Codex 里，输入对应提示词。\n生成有按钮交互的页面。\n三、核心知识点\n​​核心思路​​：不用从零写代码，用\"AI 视频工具生成动态素材 + Codex 生成网页代码\"的组合，快速做出高级互动感。\n​​关键技巧​​：\n​​首尾帧是核心​​：无论是模型转动、空间漫游还是爆炸图，本质都是\"准备两张图 → AI 首尾帧生成视频 → Codex 做交互\"。\n​​3D 模型格式​​：从 Rhino 导出时选 GLB 或 GLTF，这是网页端能直接加载的 3D 格式。\n​​动效不是越多越好​​：好的作品集核心还是内容本身，动效只是锦上添花。\n​​作者小贴士​​：提示词和成品文件作者整理到了文档里，关注后可获取。\n四、视频中出现的提示词/操作文字\n\n笔记中作者提到\"提示词和成品放在结尾了\"，但在提供的正文和 ASR 中​​没有逐字写出具体提示词内容​​，只描述了提示词的使用场景和输入方式。因此：\n\n视频中未出现完整的可复制提示词文本。作者表示已将提示词整理到文档中，关注后可获取。\n\n五、实用信息清单\n​​工具清单​​：\n​​Codex​​：AI 编程工具，用来生成网页代码和交互逻辑。\n​​AI 视频工具​​：支持首尾帧生成视频（笔记中未明确具体工具名，但类似 即梦、海螺 AI、Runway 等都能实现）。\n​​Rhino​​：3D 建模软件，用于导出 GLB/GLTF 模型。\n​​文件格式​​：\n​​GLB / GLTF​​：网页端可直接加载的 3D 模型格式。\n​​首尾帧图片​​：用于 AI 视频生成，需要保持同一镜头角度、画面比例和构图。\n​​参考网站​​：\n作者提到去\"审美网站\"找网页模板排版（笔记未具体说明是哪些网站，但同类教程中常推荐 Godly、SiteInspire 等）。\n​​后续调整​​：\n滚动速度、文字排版都可以根据需求在 Codex 中微调。\n六、一句话总结最值得收藏的点\n\n用\"AI 首尾帧生成视频 + Codex 生成代码\"的组合拳，不用写一行代码就能做出 3D 模型拖拽、视差滚动漫游、按钮交互爆炸图这三种高级网页动效，让作品集瞬间摆脱静态 PPT 感。\n\n补充一点：笔记中作者提到\"所有提示词和文件都整理到文档里了\"，如果你需要具体的提示词文本，可以关注作者账号获取完整文档。另外，从评论区来看，很多人觉得这种交互放在作品展示里\"太卷了\"，说明这种思路在建筑/设计类作品集中确实有差异化优势。"}, {"idx": 36, "id": "6abbd8310000000001009493", "title": "AI在小县城能有多下沉", "cat": "学习闭环", "sug": "keep", "reason": "保留判据3（AI 变现的获客逻辑与客户需求判断，可迁移到他的 AI 副业/接单主线）", "what": "AI 服务商在荥阳靠一次三分钟技术演示拿下跨境电商小老板客户的获客复盘。", "use": "小老板买的是「贴合自己业务 SOP 的一对一服务」不是软件；三分钟现场演示快速建立信任；客户画像（省事、不招人、多上链接、经营数据一睁眼可见）；只做线下一对一、不追通用性，这正是 FDE 岗位兴起的原因。", "next": "最小下一步：梳理笔记中\"小老板AI需求\"与\"FDE岗位价值\"的关键词，形成个人笔记；复刻目标：不适用", "detail": "", "cost": "要能出差做线下一对一，时间成本高；技术组合（PI+DeepSeek+Fassmoss 的 MCP）转写不清，无法照抄；复购依赖人脉与地域。", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# AI在小县城能有多下沉\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6abbd8310000000001009493?xsec_token=ABfVgv07D3a0ZiBsLCsF0LfsIA0nsjUEJnnLvtIMDWaqc=&xsec_source=pc_user\n\n根据你引用的笔记，以下是完整细致的信息整理：\n\n一、内容定位\n​​领域​​：AI应用 / 小县城商业 / 跨境电商 / 个人服务创业\n​​作者身份​​：某公司产品经理，具备AI技术能力，目前在小县城（荥阳）做AI相关服务\n​​想教会观众什么​​：分享AI在小县城下沉市场的真实案例与获客逻辑，说明小老板真正需要的不是软件本身，而是\"能贴合他们业务SOP的一对一服务\"\n二、内容详细讲解\n​​案例背景​​：作者在荥阳有一个自己的AI服务案例，全程\"非常草台班子\"但成功拿下客户。\n​​获客方式​​：在\"音符\"（推测为某短视频平台）的评论区里认识了一位小老板，对方私聊发来一个链接，内容是\"主播用AI做了一个跨境电商的一站式工作台\"，他也想做。\n​​线下沟通​​：两人周末约在郑州中原万达的星巴克见面，客户是做美区TikTok的。\n​​技术演示​​：作者为了展现技术能力，用三分钟时间，直接用​​PI加DeepSeek调了一下Fassmoss的MCP​​，把客户想要的东西拿到了，并告诉对方整个过程其实非常简单。\n​​深度沟通后合作​​：演示之后两人又深度聊了一下，直接达成合作。\n​​作者复盘拿下客户的原因​​：\n​​小老板很忙​​：大部分是个体户（作者称为OPC），让没接触过AI的人去研究AI技能，往往浪费时间还达不到目标，\"有这功夫不如多上几个链接\"。\n​​他们买的是服务，不是软件​​：作者在公司做产品经理，追求软件的通用性和普适性，不做定制化；但小老板要的是\"个人业务的SOP\"，只关心SOP能不能100%贴合他们的业务，不关心市场软件功能有多强。作者只做线下的一对一服务，这也是​​FDE​​岗位能兴起的原因。\n​​个人能力能覆盖技术需求​​：作者用一对一服务直接帮他们解决问题。\n​​小县城小老板的真实画像​​：学历一般只有中专或大专，对新兴技术不敏感，只关心\"能不能省事、能不能忙的时候别招人、能不能一天多上几个链接、经营数据能不能一睁眼就看到\"。\n三、核心知识点\n​​关键结论​​：小县城的AI市场非常下沉，小老板花钱买的不是软件，而是能贴合他们业务SOP的一对一服务。\n​​容易搞错的点​​：不要试图让没接触过AI的小老板自己去学AI技能，他们没时间也学不会，你不如直接帮他们搞定。\n​​作者的个人经验​​：\n用三分钟技术演示快速建立信任，证明\"整个过程其实非常简单\"。\n只做线下的一对一服务，不做通用软件。\n抓住小老板的核心诉求：省事、不招人、多上链接、数据可视化。\n四、视频中出现的提示词/操作文字\n视频中未出现完整的提示词文本，仅提到技术组合：​​PI加DeepSeek调了一下Fassmoss的MCP​​。\n五、实用信息清单\n​​获客渠道​​：短视频平台评论区私聊\n​​技术工具组合​​：PI + DeepSeek + Fassmoss的MCP\n​​目标客户画像​​：小县城个体户（OPC），做美区TikTok等跨境电商，学历中专或大专，对AI不敏感但愿意为省事付费\n​​服务定位​​：线下一对一，100%贴合客户业务SOP的定制化工具台\n​​客户核心诉求​​：省事、不招人、多上链接、经营数据一睁眼就能看到\n六、一句话总结最值得收藏的点\n\n小县城AI市场的本质不是卖软件，而是用一对一服务把AI变成小老板\"不用学就能用\"的业务SOP，他们买的不是技术，是省事。\n\n​​补充说明​​：笔记中提到的\"音符\"具体指代哪个平台未明确说明；\"PI\"\"Fassmoss的MCP\"\"FDE岗位\"等术语在笔记中未做解释，如需进一步了解可补充搜索。"}, {"idx": 37, "id": "6aa3f9c10000000029019878", "title": "开源的音乐AI！不花钱也能改编歌曲", "cat": "复刻闭环", "sug": "drop", "reason": "删除判据2（硬件与环境的双重门槛，WSL/命令行/Linux 部署正是判据列举的典型重折腾场景，非商用许可也限制了他的内容变现用途）；残留的「符号中间层」思路只剩一句概念，不值得为它背一整套部署", "what": "开源音乐模型 YuE2 拆解：在提示词与音频之间加可编辑 ABC 乐谱层实现可控音乐生成", "use": "技术思路可借鉴（符号规划中间层把「抽卡」变「白盒」、SheetSage2 转谱做翻唱、ComfyUI 工作流），但可执行部分全部是本地部署", "next": "最小下一步：搜索“YuE2 ComfyUI 工作流”或“YuE2 Studio 下载”，确认本地显卡是否满足 12G 显存要求。；复刻目标：跑通一次本地或云端的歌曲改编流程，验证其改词、改曲及五线谱编辑的实际效果。", "detail": "", "cost": "需 24GB 显存（RTX4090 级）+WSL2/CUDA+Python3.12 命令行部署，属判据明示的重折腾环境；权重 CC BY-NC 4.0 仅限非商用，做的歌不能发行变现；Mac 支持弱，出曲有塑料感", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 开源的音乐AI！不花钱也能改编歌曲\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6aa3f9c10000000029019878?xsec_token=ABUzo3mtV2eIdgbUtvRl94QahAv51oHDa-S8yaV0z6Utg=&xsec_source=pc_user\n\n根据你引用的笔记和补充搜索到的公开资料，下面是对 YuE2 开源音乐 AI 项目的深度拆解。\n\n一、素材与想法\n​​素材来源​​：笔记作者从 GitHub 仓库获取了 YuE2 开源项目，并通过官方 Demo 页和 ComfyUI 仓库进行实测。参考歌曲来自官方 Demo 页提供的 65 首示例音频，风格涵盖黑暗氛围、爵士乐等。\n​​核心想法​​：传统 AI 音乐工具（如 Suno）是\"黑盒抽卡\"——输入歌词和风格，不满意只能重抽。YuE2 的突破在于\"先写谱、再生成\"，把旋律和和弦变成可编辑的 ABC 文本谱，创作者可以在渲染前修改乐谱、交给 Agent 迭代，甚至做零样本翻唱。这相当于把 AI 音乐从\"自动售货机\"变成了\"音乐制作人\"。\n​​新在哪​​：中间层引入符号规划（Symbolic Planning），生成可编辑乐谱后再渲染音频，实现\"白盒\"创作。\n​​省在哪​​：完全依赖本地显卡运行，不需要订阅付费，生成一首 3.6 分钟的 48kHz 立体声歌曲约 71 秒（RTX 4090 测试）。\n​​强在哪​​：官方评测中 YuE2 best-of-8 在 WildSongBench 上得分为 6.9632，略高于 Suno v5 的 6.8721；支持多语种、改词改曲改谱、Agent 辅助编辑。\n二、实现方式与技术原理\n​​整体流程​​：\n输入歌词 + 风格描述（如\"中文情歌，钢琴慢节奏伴奏\"）\n自回归专家模块生成 ABC 格式乐谱（旋律 + 和弦）\n另一组 AR 专家完成语义生成\n流匹配（flow matching）并行预测声学特征\nVAE 解码模块还原为 48kHz 高保真立体声音频\n​​翻唱流程​​：原始音频 → SheetSage2 转成旋律 ABC 谱 → 修改歌词和音乐风格 → YuE2 重新生成歌曲。\n​​最有技术含量的一步​​：符号规划与声学渲染分离。传统音频生成模型直接输出波形或潜变量，只能靠 prompt 间接影响结果；YuE2 把旋律和和弦变成显式控件，人或者 Agent 可以在渲染前检查、修改、替换乐谱，实现真正的可控创作。\n三、AI 与工具清单\n工具/模型\t负责什么\t免费/付费\n​​YuE2-3B​​\t核心音乐生成模型，支持歌词 + 风格生成歌曲、改谱、零样本翻唱\t免费开源（权重 CC BY-NC 4.0，代码 Apache 2.0）\n​​SheetSage2​​\t将原始音频转为旋律 ABC 谱，用于翻唱流程\t免费开源\n​​MERT2​​\t音乐理解能力，辅助符号规划\t免费开源\n​​ComfyUI​​\t可视化工作流界面，社区已跟进原生支持 YuE2\t免费开源\n​​WebUI​​\t社区开发者基于 YuE2 制作的自定义 Web 界面\t免费开源\n​​Agent Skill​​\t让 Claude Code 等工具直接调用 YuE2 写歌改歌\t免费开源\n四、项目来源与链接\n​​GitHub 仓库​​：https://github.com/multimodal-art-projection/YuE（代码开源，约 7.1k star，作者为 m-a-p 团队，包含港科大、纽约大学、斯坦福等联合开发）\n​​官方 Demo 页​​：https://map-yue2.github.io/\n​​模型权重（ModelScope）​​：https://modelscope.cn/models/m-a-p/YuE2-3B\n​​Hugging Face​​：https://huggingface.co/m-a-p/YuE2-3B\n​​评测数据集​​：https://huggingface.co/datasets/m-a-p/WildSongBench\n五、视频中出现的提示词/指令\n\n视频中未出现完整、可复用的提示词原文。口播中提到的操作思路是：\n\n​​风格提示词​​：让任意大模型（如 豆包、GPT）给出想要的曲风曲调，例如\"原作者的音色和作品风格\"，再贴上想要演唱的台词。\n​​歌词结构​​：使用结构性标签（如主歌、副歌等），找大模型写即可。\n​​运行方式​​：在 ComfyUI 中配置工作流，粘贴风格和台词，运行即可得到改编后的歌曲。\n六、复现指南\n​​前置条件​​：\n一张 24GB 显存的 NVIDIA 显卡（如 RTX 4090），推荐 WSL2 + CUDA 环境\n24GB 以上系统内存\nPython 3.12 环境\n​​最简行动清单​​：\n克隆仓库：git clone https://github.com/multimodal-art-projection/YuE\n创建虚拟环境：python3.12 -m venv .venv 并激活\n安装依赖：python -m pip install --upgrade pip 和 python -m pip install .\n运行推理：yue2 generate --request examples/song.json --device cuda\n或者使用社区 ComfyUI 工作流，拖拽节点配置即可运行\n​​难点与坑​​：\n​​显存门槛高​​：24GB 显存要求把很多普通用户挡在门外，社区有 12GB 可跑的 3B 模型方案但需要优化\n​​商用限制​​：模型权重采用 CC BY-NC 4.0，​​仅限非商用​​，拿它做的歌直接发行卖钱不行；代码是 Apache 2.0，两者许可不同，商业项目需单独确认\n​​Mac 支持弱​​：MPS 路线属于实验性兼容方案，不是官方基准，FP8 量化路径要求 CUDA\n​​音频有塑料感​​：部分社区用户反馈出曲音质不如 Suno，唱歌可能口齿不清，需要反复调参\n​​不能指定音色​​：目前无法精确控制人声音色，只能靠风格提示词间接影响\n七、一句话总结\n\nYuE2 把 AI 音乐从\"抽卡\"变成了\"可编辑工程\"——先写 ABC 乐谱再渲染音频，改旋律像改 Word，但需要 24GB 显卡且仅限非商用。"}, {"idx": 38, "id": "6a37e8ac0000000007013520", "title": "发现了opus4.8 gpt5.5全免费大毛，必入", "cat": "归档观察", "sug": "drop", "reason": "删除判据1（免费额度推广，随时失效）+删除判据8（他已有无限批量生图的 ChatGPT 镜像版，无需第三方白嫖渠道）", "what": "推荐 Tabbit 国际版可白嫖 Opus 4.8、GPT 5.5 等十几个模型的免费渠道。", "use": "只知国内版只有 DeepSeek、GLM，要海外模型必须下国际版。", "next": "最小下一步：搜索\"tabbit国际版 真实体验 避坑\"，确认是否安全可用；复刻目标：不适用", "detail": "", "cost": "免费政策随时调整，评论区已出现要求升级 pro、没有 GPT、速度慢；国内网络可能登不上；第三方平台可看到全部账号对话，有隐私与密钥泄露风险。", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 发现了opus4.8 gpt5.5全免费大毛，必入\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6a37e8ac0000000007013520?xsec_token=ABcnUSeHuNeXrFOGjyv4stpqncKWT110oUvW4aQQEHJqE=&xsec_source=pc_user\n\n根据你引用的笔记，我帮你把这条关于 Tabbit 国际版免费大模型的信息完整梳理出来了。\n\n一、内容定位\n​​领域​​：AI 工具 / 大模型应用\n​​作者身份​​：AI 工具分享博主（非官方）\n​​核心目的​​：向观众推荐一个可以免费使用顶级大模型（Opus 4.8、GPT 5.5 等）的平台，强调\"先下先享受\"\n二、内容详细讲解\n\n笔记作者按以下逻辑展开：\n\n​​抛出信息​​：作者称\"无意间看到\" Tabbit 国际版可以免费使用 Opus 4.8 和 GPT 5.5，起初不信，但亲自实测后确认\"100% 可行\"。\n​​强调版本差异​​：反复提醒观众\"记住是国际版，别下成国内了\"。国内版仅支持 DeepSeek V4、GLM 5.2 等国内模型；国际版才包含海外顶级模型。\n​​说明免费范围​​：除了 Opus 4.8 和 GPT 5.5，还有\"十几个模型免费\"，但作者认为这两个最重磅。\n​​提醒时效性​​：作者坦言\"能免费多久咱们都不知道\"，但强调\"最起码现在免费\"，建议用户尽快下载体验。\n​​引导互动​​：结尾请求观众\"点个关注、点个赞\"。\n三、核心知识点\n​​关键结论​​：Tabbit 国际版目前免费集成 Opus 4.8 和 GPT 5.5 等顶级大模型，无需单独订阅。\n​​易错点​​：国内版和国际版是分开运营的，国内版没有海外模型，必须下载国际版才能用 Opus 4.8 和 GPT 5.5。\n​​作者小贴士​​：先下载先享受，免费政策可能随时调整，建议尽早体验。\n​​评论区补充反馈​​：\n有用户反映\"国内的网能登嘛\"，说明可能需要网络环境支持。\n有用户称\"要求升级 pro 了\"，暗示免费政策可能已收紧或存在额度限制。\n有用户反馈\"速度挺慢的\"，说明服务器或网络可能存在延迟。\n有用户说\"现在没有 GPT 了\"，可能意味着部分模型已下架或调整。\n四、视频中出现的提示词/操作文字\n\n笔记中未出现具体的提示词或操作指令文本，仅提到在对话界面可以输入文字进行交互。\n\n五、实用信息清单\n​​工具名称​​：Tabbit（国际版）\n​​免费模型列表​​：\nClaude Opus 4.8\nGPT 5.5\nGemini 3.5 Flash\nKimi-2.6\nGLM 5.1\nMiniMax-M3\n以及其他十几个免费模型\n​​国内版
