的模考题），用一个小模型转写，转写完成后直接分析，​​三秒钟不到​​又出来结果。\n​​批量测试​​：十道题全部放进去，大概 ​​八秒钟​​ 左右完成。一千道题也没有多久时间。\n​​核心优势​​：题库被打标签更精准，效率极高。\n\n​​4. 场景三：学生画像分析与题目推送​​\n\n​​传统方式​​：扫出卷子后，判断某大题错了，对应哪些知识点，再判断哪些知识点没掌握清楚。\n​​JEV 方案​​：基于学生已有的知识点画像，JEV 通过质性判断，快速分析一道题零分背后具体是哪一个知识点不会（一道题零分可能包含三个知识点）。\n​​后续动作​​：快速给出解决方法，并从题库中拉取适合该学生的题目进行推送。\n​​效率​​：非常高。\n\n​​5. 其他可适配场景​​\n\n教案生成等场景，只要有了知识图谱，都可以很容易适配。\n三、核心知识点\n​​关键结论​​：AI 教育最重要的两个东西是\"成本足够便宜\"和\"速度足够快\"，JEV 模型在这两点上都做到了。\n​​需要注意的要点​​：\nJEV 有一些小缺点，但加上合适的 harness 后效率可以超级加倍。\n题库打标签的前提是\"已经有了一个很好的知识图谱\"，否则判断不够靠谱。\n只要设定好足够的标准，JEV 的判断就是准确的。\n​​作者个人经验​​：\n平时一直用 o c 链，对大模型在做什么有清晰认知，因此对 JEV 的效果感到\"震惊\"。\n推荐大家去试试看。\n四、视频中出现的提示词/操作文字\n视频中未出现完整的提示词文本，仅提及操作指令如\"把教材喂给他\"\"把课程标准喂给他\"\"仿照 opstadia 的方法去做\"\"转写一下\"\"直接开始分析\"等。\n五、实用信息清单\n​​模型​​：JEV 模型（判断对错的 LCF 模型 + 质性检测）\n​​工具/项目​​：\nopstadia（知识图谱方法参考）\no c 链（作者日常使用的工具）\n开源判断框项目（用于题库打标签 demo）\n​​适用场景​​：\n构建知识图谱\n题库打标签\n学生画像分析与题目推送\n教案生成\n​​核心优势​​：便宜、快（三秒出结果，十道题八秒完成）\n六、一句话总结\n\n​​JEV 模型凭借\"判断对错 + 质性检测\"的本质，在 AI 教育的知识图谱构建、题库打标签、学生画像分析三大场景中实现了\"便宜且快\"的突破，十道题八秒完成，是教育从业者值得尝试的高效工具。​​"}, {"idx": 40, "id": "6a3e4d9c00000000070219a2", "title": "8年，走了！", "cat": "归档观察", "sug": "drop", "reason": "删除判据4（与主线无关且不属保留判据4，失业金规则属公开政务服务信息，非稀缺隐性规则）。", "what": "一条离职图文记录（离职证明+告别语），无方法论无操作。", "use": "唯一碎片信息：“双方协商一致”写进离职证明可为申领失业金留合规空间（谁先提出协商决定能否领）。", "next": "最小下一步：将笔记归档至个人状态记录；复刻目标：不适用", "detail": "", "cost": "他是体制内小学老师，用不到离职/失业金链路；本质是情绪记录。", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 8年，走了！\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6a3e4d9c00000000070219a2?xsec_token=ABUP4fzF5E4hZzJeLax55Igl67xGKjdNgxLdyUTjd0IDw=&xsec_source=pc_user\n\n根据你引用的笔记，这是一条以图文形式发布的离职记录，没有视频口播内容。以下是完整信息整理：\n\n一、内容定位\n​​领域​​：职场/生活记录\n​​作者身份​​：8年经验的市场部经理，刚结束上一段职业生涯\n​​核心表达​​：记录自己 8 年职场生涯的结束，开启新生活，带有告别与重启的情绪\n二、内容详细讲解\n\n笔记以一张​​离职证明​​图片为核心，配合简短文字发布，内容按以下逻辑展开：\n\n​​图片内容（离职证明）​​：\n入职时间：​​2018年04月20日​​\n任职岗位：​​市场部经理​​\n离职时间：​​2026年06月30日​​\n离职原因：​​双方协商一致​​解除劳动合同\n评价：​​无不良表现​​\n​​正文文字​​：「开始新的生活[仙女棒unlock]」，搭配话题标签 ​​#离职​​ ​​#裸辞​​ ​​#自己​​ ​​#人生​​\n​​评论区补充信息​​：\n有评论提到「协商一致可以领两年失业金」\n有人分享自己干了 10 年离职后待遇更高，有三家公司邀请\n有人表示自己也快 8 年了，孕期想等被炒\n有人感叹「这年头，有人被裁员，有人主动辞职」\n三、核心知识点\n​​关键结论​​：作者以「双方协商一致」的方式结束 8 年职场生涯，离职证明上明确写明了协商解除，这为后续申领失业金提供了合规依据。\n​​容易搞错的要点​​：很多网友在评论区讨论「协商一致能否领失业金」，核心判断标准是​​谁先提出协商​​——如果是公司提出协商解除，属于「非因本人意愿中断就业」，可以领；如果是员工主动提出协商，则不能领。\n​​作者经验​​：从 2018 到 2026 年，8 年时间担任同一岗位的市场部经理，说明职业稳定性较强，且离职时获得「无不良表现」的评价，为后续求职留下良好背书。\n四、视频中出现的提示词/操作文字\n\n视频中未出现（笔记为图文形式，无视频口播或字幕）\n\n五、实用信息清单\n​​离职证明关键要素​​：入职时间、岗位、离职时间、离职原因（必须写明「双方协商一致」）、公司盖章\n​​失业金申领条件​​：\n失业保险累计缴满 1 年\n非因本人意愿中断就业（公司提出协商解除符合）\n已办理失业登记并有求职意愿\n​​失业金领取时长​​：累计缴费 10 年以上，最长可领 24 个月\n​​评论区高频话题​​：协商一致离职、失业金领取、8 年/10 年职场周期、裸辞心态\n六、一句话总结最值得收藏的点\n\n8 年市场部经理以「双方协商一致」方式离职，离职证明上明确写明协商解除，既保住了职业口碑，也为后续申领失业金留足了合规空间。\n\n补充一点：笔记本身信息量比较精简，主要靠离职证明图片传递核心事实。如果你关注「协商离职如何顺利领失业金」或「8 年经验市场人如何规划下一步」，我可以帮你进一步展开。"}, {"idx": 41, "id": "6a9a972500000000120037ba", "title": "00后学生自制AI美剧，四集播放量破6000万，男女主形象火出圈，“没有AI感”", "cat": "新产", "sug": "keep", "reason": "保留判据2（「用微表情与心境细节替代笼统情绪词」是脱离具体模型版本都能用的提示词方法论）＋保留判据3（全流程与固定角色一致性的套路直接服务他的 AI 内容创作和小红书视频主线）", "what": "两位 00 后学生用 AI 做出四集连载美剧《The Accident》，播放破 6000 万、涨粉 54 万，重点在去掉 AI 感。", "use": "全流程：AI 把梗概扩成剧本 → 生成角色三视图和场景参考图固定形象 → 按场景分段生成视频 → 绑定配音再剪辑调色；工具用小云雀 2.5（创作者反馈细节最到位）做全流程，豆包润英文台词；去 AI 感的核心技巧是不要只写「开心/难过」，要写皱眉幅度、眼神要传达的情感、自嘲还是其他状态这种微表情与心境描述；一致性靠反复抽卡，脸部有噪点颗粒直接 Pass。", "next": "", "detail": "", "cost": "模型版本与平台流量红利有时效；角色一致性和切镜头变脸是最大难点；抽卡试错耗时；学生党靠仔细审提示词一遍过来省成本。", "quote": "", "quote_src": "", "text": "# v3-分区版 v3（回溯）\n# 00后学生自制AI美剧，四集播放量破6000万，男女主形象火出圈，“没有AI感”\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6a9a972500000000120037ba?xsec_token=ABrUJ2owZSXIUbq6laGIqp9SDlX3HtxmiO0yFYWEX1Qzw=&xsec_source=pc_user\n\n项目定位\n\n​​项目类型​​：AI 自制美剧（美高校园题材短剧）\n\n​​成品形式​​：四集正片，每集包含完整剧情、英文对白、配音与剪辑 8 万），点赞超 200 万，涨粉超 54 万\n\n​​题材与风格​​：美高校园群像剧，融合美剧视觉元素与国内含蓄审美，剧情偏向青春、温暖、无纯粹坏人 高颜值角色的年轻观众\n\n​​剧本来源​​：两位 00 后学生原创，基于对美剧和青春电影的观看记忆构建故事\n\n​​人物形象​​：男主 Keaton（阳光卷毛少年感）、女主、男二 Maxine 等，角色有独立小传和成长线\n\n​​核心创意​​：用 AI 做连载美剧，- ​​选题与剧本​​：先确定美高校园群像方向，- ​​角色与场景设计​​：建立统一视觉参考，固定人物外貌与服装\n\n​​分镜生成​​：按场景分段生成视频，用提示词控制镜头动作和表情，有问题单独重做\n\n​​配音与剪辑​​：台词绑定角色生成配音，最后剪辑合成，调整节奏和色调\n\n​​人物一致性​​：通过反复抽卡（反复输入提示词生成）直到脸部皮肤无噪点、无颗粒感；用心境和情绪描述代替简单指令，让 AI 识别人物状态\n\n​​制作周期​​：笔记未提及具体一集制作时长，但两位创作者是几个月前才自学 AI，靠课余时间完成\n\n四、AI 与工具清单\n​​小云雀​​：全流程制作工具，负责剧本生成、角色设计、分镜视频生成、配音绑定等（笔记评论区及搜索补充提及）\n​​豆包​​：用于英文台词翻译，确保地道表达（笔记中创作者口播提及）\n​​视频模型​​：小云雀 2.5 模型（搜索补充提及，创作者反馈该模型细节最到位）\n​​费用情况​​：笔记未提及具体会员费和生成费用\n五、成本与收益\n​​投入人数​​：2 位 00 后在校大学生，分工负责导演视效和编剧后期\n​​投入时间​​：几个月自学 AI，靠课余时间完成\n​​播放量​​：四集超 6000 万（部分统计近 7500 万）\n​​点赞量​​：超 200 万\n​​涨粉​​：超 54 万\n​​收入与变现​​：笔记未提及具体收入数字和变现路径\n六、视频中出现的提示词\n\n笔记视频口播中​​没有展示完整提示词原文​​，但创作者分享了提示词的核心思路和公式：\n\n​​核心思路​​：不要只写\"开心\"\"难过\"，要描述人物当下的心境、情绪和具体表情细节\n​​情绪拆解示例​​：皱眉的幅度、眼神需要传达的情感、是自嘲语气还是其他状态\n​​微表情控制​​：用词去描述人物当下的状态，帮助 AI 模型识别应该表达出什么样的表情\n​​抽卡策略​​：有噪点明显的场景直接 Pass，不断抽卡直到脸部皮肤没有噪点和颗粒\n七、链接与复现\n​​作品链接​​：笔记未提供《The Accident》观看链接（搜索补充提及在抖音和爱奇艺有更新）\n​​工具链接​​：笔记未提供小云雀等工具的注册或下载链接\n​​新手最简步骤​​：\n用 AI 工具把模糊剧情梗概扩展成完整剧本\n生成角色三视图和场景参考图，固定人物形象\n按场景分段生成视频，用情绪和心境描述控制微表情\n绑定配音、剪辑合成\n​​风险坑​​：角色一致性是最大难点，切镜头容易变脸；需要反复抽卡和试错才能去掉 AI 感\n八、一句话总结最该记住的点\n\n​​不要只写\"开心\"，要写清面部肌肉怎么动​​——用心境、情绪和微表情细节去描述人物状态，让 AI 模型理解角色当下在\"演\"什么，而不是\"贴\"一个表情，这是去掉 AI 感的核心。\n\n补充一点：评论区有人问成本，创作者回复说他们只是普通大学生，抽视频很节约，仔细审阅提示词尽量一遍过，不死磕，不是富二代。"}, {"idx": 42, "id": "6a3c84930000000006030d96", "title": "40件作品，这么多没入门，你能看出来吗？", "cat": "学习闭环", "sug": "drop", "reason": "删除判据4（书法专业评审与他的 AI 开发/心理教学/小红书主线均无关，也不属生活程序知识；若日后真练书法再单独检索）", "what": "国美博士郑力胜点评 40 件书法作品「没入门」问题的教学视频", "use": "书法专业评审标准：只有外形没有笔法、小楷须从赵孟頫文征明墨迹本入手再回王羲之钟繇、学碑刻必须用生宣、线条飘要去练大篆汉碑、落款与印章的投展规范", "next": "最小下一步：将笔记中关于笔法、章法、用墨的核心点评标准摘录到个人知识库；复刻目标：不适用", "detail": "", "cost": "无", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 40件作品，这么多没入门，你能看出来吗？\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6a3c84930000000006030d96?xsec_token=ABj9HVx5OGw11LePC9-O29CZfAxVXcMED--xmsR3ArcMQ=&xsec_source=pc_user\n\n根据你引用的笔记，以下是完整细致的信息整理：\n\n一、内容定位\n​​领域​​：书法（书法点评与教学）\n​​作者身份​​：郑力胜，中国美术学院博士（在读）、中国书法家协会会员、浙江省书法家协会理事、浙江省书协篆书委员会副主任\n​​核心目的​​：通过点评40件书法作品，指出其中许多\"没入门\"的问题，从笔法、章法、用墨、落款等角度分析，帮助观众识别问题并提供学习建议\n二、内容详细讲解\n\n视频共点评了40件书法作品，郑力胜从多个维度逐一分析，以下是按内容顺序整理的核心点评要点：\n\n​​基本功与笔法问题​​：多件作品被指出\"只有外形没有笔法\"\"基本功没过关\"。有的笔搓着走，笔完全塌下去起不来；有的线条断得完全断开；有的涨墨过度；有的甚至是电脑处理过的\"自由体\"，没有真实笔法。\n​​行气与笔头问题​​：部分作品行气缺失，笔头弱，出现\"尖的空\"，整体气息不连贯。\n​​小楷学习方向​​：有作品学小楷方向不对，一笔一画在写，导致木讷呆板。正确路径是​​通过赵孟頫、文征明等墨迹本入手，然后再回到王羲之、钟繇身上​​，才不会一板一眼。\n​​艺术字与变化问题​​：有作品被评价为\"艺术字\"，每个字都在动、都想变化，但\"每个字都想变化，那肯定变不出来\"，而且写得太快。作者认为​​要有一些静才能衬托出那些动​​。\n​​纸张与用墨问题​​：有作品纸张太油，\"油光发亮的笔头是比较弱的\"，驾驭支撑不起来；有的纸太糊，什么都看不清。\n​​风格混乱与简体字混用​​：有作品混用简体字，被直接否定；有学石门颂的作品用半生熟或熟宣去表达，作者指出\"石门颂就要生宣去表达\"，用错纸就是南辕北辙。\n​​魏碑写成自由体​​：有作品写魏碑但\"太自由了\"，失去了碑的味道。\n​​章法与落款问题​​：多件作品被指出章法琐碎凌乱、落款多余、印章位置不当（如\"五方印都不要这样盖\"\"落款不要这样齐平\"），在投展中这种形式不会入展。\n​​变形套路问题​​：有作品被质疑\"有人在教他变形\"，出现跟全篇完全不搭的造型变化，这是\"露出来的马脚\"，用笔问题气全是断的。\n​​线条厚度问题​​：有作品线条没有厚度、飘着的，作者建议​​去练练大篆、经文、汉碑汉隶​​来增强沉稳感。\n​​优秀作品点评​​：少数作品被称赞，如一件抄写《寒食帖》《丧乱帖》的作品\"写得很好很老道\"，作者判断作者年纪不小、以前可能参加过国展；还有学\"郑家书法\"的作品，用笔沉稳，基本能把握住特征。\n三、核心知识点\n​​关键结论​​：很多书法作品\"没入门\"的核心问题是​​只有外形没有笔法​​，基本功不过关。\n​​小楷学习路径​​：必须从墨迹本入手（赵孟頫、文征明），再回到王羲之、钟繇，不能一笔一画死板地学。\n​​碑刻用纸要求​​：学石门颂等碑刻必须用生宣，用半生熟或熟宣是南辕北辙。\n​​自由体学习建议​​：可以去学赵孟頫和智永的《三门记》和《千字文》。\n​​线条厚度训练​​：线条飘、没有厚度的，要去练大篆、经文、汉碑汉隶。\n​​碑帖比例建议​​：石碑一帖，类似于\"碑六帖四\"或者\"碑七帖三\"，写得很精巧，但拙的东西过多就不行。\n​​落款与印章规范​​：落款不要齐平，五方印不要这样盖，投展中没有人用这种形式入展。\n​​不要盲目变形​​：不要着急去变形，有人教变形套路是露马脚的表现，跟全篇不搭的造型变化就是用笔问题。\n四、视频中出现的提示词/操作文字\n\n视频中未出现AI提示词、搜索词或软件指令，主要是口播点评内容。\n\n五、实用信息清单\n​​小楷入门路径​​：赵孟頫、文征明墨迹本 → 王羲之、钟繇\n​​自由体学习范本​​：赵孟頫《三门记》《千字文》、智永《千字文》\n​​碑刻用纸​​：石门颂等必须用生宣，不能用半生熟或熟宣\n​​线条厚度训练​​：大篆、经文、汉碑、汉隶\n​​碑帖比例参考​​：碑六帖四 或 碑七帖三\n​​避坑提醒​​：\n不要一笔一画死板学小楷\n不要混用简体字\n不要盲目变形\n落款不要齐平，印章不要乱盖\n纸张太油、太糊的不要用\n六、一句话总结最值得收藏的点\n\n​​书法没入门的核心是\"只有外形没有笔法\"​​，小楷必须从墨迹本（赵孟頫、文征明）入手再回王羲之钟繇，学碑刻必须用生宣，线条飘就去练大篆和汉碑。"}, {"idx": 43, "id": "6a31183800000000170089ed", "title": "今天来广东顺德吃本地人的宝藏宵夜", "cat": "归档观察", "sug": "drop", "reason": "删除判据4（与主线无关且不属保留判据4）+1（探店类信息时效短）。", "what": "顺德宵夜店探店 vlog，三人烤海鲜消费 419 元。", "use": "无，仅菜品价格与店家“不新鲜不收钱”的承诺，连店名地址都没给出。", "next": "最小下一步：收藏该笔记到\"顺德美食\"合集；复刻目标：不适用", "detail": "", "cost": "纯生活记录，探店信息时效短。", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 今天来广东顺德吃本地人的宝藏宵夜\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6a31183800000000170089ed?xsec_token=ABqFHt9T13EvJCrZWY7_R4oMby8D3lMQ3Zby9zlXJtdyA=&xsec_source=pc_user\n\n根据你引用的笔记，以下是完整细致的信息整理：\n\n一、内容定位\n​​领域​​：美食探店\n​​作者身份​​：美食博主（视频中自称\"刘雨鑫\"）\n​​想教会观众什么​​：探访广东顺德本地人推荐的宝藏宵夜店，展示海鲜品质、价格与三人用餐消费情况，实现\"烤海鲜自由\"\n二、内容详细讲解\n\n视频按以下顺序展开：\n\n​​开场介绍​​：博主来到广东顺德，准备吃本地人推荐的宝藏宵夜，看看3个人要花多少钱。\n​​与老板互动​​：博主与老板熟络交流，老板开玩笑说\"不能带火我的店，我也怕呀\"，表示被拍到后店就火了，自己经常偷懒休息。\n​​看菜单点餐​​：黑板上写着​​扇贝青口35/打​​（12个）。老板承诺海鲜都是新鲜的，如果发现不新鲜可以不收钱，夏天做海鲜可能有一两个不新鲜，吃到可以补。\n​​了解海鲜产地​​：\n​​刀贝​​：北海的，今天小只一点7个，平时大只5个一份。\n​​生蚝​​：湛江的，老板说靠口碑做了十几年。\n​​品尝蒜蓉烤刀贝​​：一份58块，电烤炉子调味，蒜蓉切得很细，加了一点辣椒。博主评价\"特别鲜甜\"，说北方也有类似的马贝、北极贝，但南方的贝也很棒。\n​​品尝烤生蚝​​：1打35块（12个），火候刚刚好，肚子饱满有汁水。博主说街边有很多一块两块的，但有些蚝吃起来会比较苦，这个没有苦味，酱有一点烧烤味儿，和刀贝的调味不一样。\n​​品尝鲍鱼​​：58一份，今天5只（老板送了1只变成6只），没有改任何花刀。博主评价蒜蓉很好，\"蒜不辛辣，但是很香\"。\n​​品尝扇贝​​：35/打，这次加了粉丝。\n​​品尝蛏子（圣子）​​：一份35块，很肥且脆口。\n​​品尝青口​​：35/打，老板说很会挑海鲜，品质不错。\n​​总结蒜蓉精髓​​：博主说精髓就是蒜蓉，点的这些里面只有生蚝的蒜蓉不一样，其他的蒜蓉都是一样的。\n​​结账​​：三人消费​​419元​​（含三瓶可乐），老板算好账后付完。\n三、核心知识点\n​​关键结论​​：顺德这家宵夜店海鲜品质不错，价格实惠，三人吃烤海鲜总共419元，可以实现\"烤海鲜自由\"。\n​​容易搞错的要点​​：\n生蚝和刀贝虽然都是烤的，但​​调味不一样​​——生蚝的酱有烧烤味儿，刀贝的蒜蓉切得更细加了辣椒。\n街边一块两块的生蚝可能吃起来发苦，这家店的生蚝没有苦味。\n​​作者的小贴士​​：\n老板很会挑海鲜，品质有保障。\n蒜蓉是整桌海鲜的精髓，除了生蚝的蒜蓉特殊，其他菜品用的蒜蓉都是一样的。\n老板承诺不新鲜不收钱，夏天吃海鲜可以放心。\n四、视频中出现的提示词/操作文字\n\n视频中未出现AI提示词、搜索词或软件指令。\n\n五、实用信息清单\n​​扇贝​​：35元/打（12个）\n​​青口​​：35元/打（12个）\n​​刀贝​​：58元/份（小只7个，大只5个），北海产地\n​​烤生蚝​​：35元/打（12个），湛江产地\n​​鲍鱼​​：58元/份（5只，老板可能送1只）\n​​蛏子（圣子）​​：35元/份\n​​蒜蓉调味​​：刀贝和大部分海鲜用细切蒜蓉加辣椒，生蚝用特殊烧烤味酱料\n​​三人总消费​​：419元（含三瓶可乐）\n​​店铺特点​​：老板做了十几年，靠口碑；承诺不新鲜不收钱；老板会送菜给老顾客\n六、一句话总结最值得收藏的点\n\n顺德这家本地人推荐的宝藏宵夜店，海鲜新鲜、蒜蓉是灵魂，三人419元实现烤海鲜自由，老板还承诺不新鲜不收钱。\n\n补充一点：笔记中未提及具体店铺名称和地址，博主也没有在视频中说明店名。如果想找这家店，可能需要通过博主账号进一步查找定位信息。"}, {"idx": 44, "id": "6ac3a161000000001802b5e1", "title": "当老师和做电商，其实差不多", "cat": "学习闭环", "sug": "keep", "reason": "保留判据2（「看明白、讲清楚、对接上」是脱离行业的长期能力模型）+保留判据3（直接服务小红书内容创作与产品表达）", "what": "前高中历史老师转型电商后，提炼出跨行通用的「看明白、讲清楚、对接上」能力模型。", "use": "三步法：看懂用户痛点→看懂产品特点→把两者精准对接上；教学沟通要用对方生活里的具体例子替代抽象官方解释（翻盖手机讲新经济政策）；用户需求随时间变化（20 岁要 Dior 真皮包、32 岁要轻便耐脏能装电脑），要持续理解当下真实痛点。", "next": "最小下一步：把\"看明白、讲清楚、对接上\"这六个字记到笔记或卡片里，作为后续思考的锚点；复刻目标：不适用", "detail": "", "cost": "无", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 当老师和做电商，其实差不多\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6ac3a161000000001802b5e1?xsec_token=AB0wVe6tOM-nR2ezdu7rw36d62kLDu-R2ukpxbyKOPF0s=&xsec_source=pc_user\n\n根据你引用的笔记，以下是完整细致的信息整理：\n\n一、内容定位\n​​领域​​：创业分享 / 副业探索 / 电商 / 跨行思维\n​​作者身份​​：前高中历史老师，现转型为电商创业者\n​​想教会观众什么​​：无论做老师还是做电商，核心都依赖同一套思维逻辑——\"看明白、讲清楚、对接上\"。只要具备这套能力，就可以无痛进入任何行业，创业搞个小而美的副业也能手拿把掐。\n二、内容详细讲解\n\n作者按以下顺序展开内容：\n\n​​身份对比引入​​：作者从前是高中历史老师，现在是电商人做创业，每个月有稳稳的收益，基本七天都有数据产出。\n​​核心观点提出​​：做老师也好，做电商也好，用的都是同一套思维逻辑。文科直接变现能力差是事实，但核心能力可以跨行业迁移，这六个字就是\"看清楚、讲清楚\"。\n​​教学案例（新经济政策）​​：\n90年代知识点：美国克林顿总统的新经济政策，涉及\"大力发展新科技\"。\n学生痛点：背了知识点但不懂为什么，官方解释\"提高生产力、更多生产资料\"太抽象。\n作者的讲法：用翻盖手机举例——翻盖手机屏幕小、合起来厚，不可能有手机壳和贴膜行业，因为当时没有直板智能机和触屏手机。\n核心逻辑：新兴科技会创造空白市场，延伸出周边需求，带动新市场和就业。\n结论：用学生能听懂的例子讲清楚，再对应到专业名词，这就是当老师最重要的能力。\n​​电商应用案例（两个包）​​：\n​​20几岁买的迪奥真皮双肩包​​（约2019年）：全真皮、质感好、硬挺精致、迪奥品牌满足虚荣心，对追求质感、追求品牌、未对消费主义去魅的人能推得动。\n​​32岁现在用的包​​：非常轻、装货量大、颜色耐脏、有一点防水。\n作者现状：做互联网经常出差，需要带笔记本电脑，如果背自重很重的真皮包日行两万步会吃力。\n核心结论：两只包都是好包，但把20几岁的包推荐给32岁的自己绝对推不动，因为需求变了。\n​​总结核心技巧​​：\n第一，把用户痛点看明白；\n第二，把产品的特点看明白；\n第三，把用户痛点和产品特点对接上。\n作者当年的用户是学生，要用他们听懂的叙事讲知识点；现在的用户是普罗大众，要把产品特点讲给真正需要的人听。\n三、核心知识点\n​​关键结论​​：跨行不跨逻辑，\"看明白、讲清楚、对接上\"是通用核心能力。\n​​容易搞错的要点​​：\n不要只讲官方抽象解释，要用对方能听懂的例子和思维去沟通。\n产品再好，如果不匹配用户当下的真实需求，也推不动。\n​​作者的个人经验和小贴士​​：\n文科变现能力差，但\"看清楚、讲清楚\"的能力可以帮你无痛进入任何行业。\n做电商不是盲目推品，而是先看懂用户需求，再看懂产品特点，最后把两者精准对接。\n用户是动态变化的（比如20几岁和30几岁的自己需求不同），要持续理解用户当下的真实痛点。\n四、视频中出现的提示词/操作文字\n\n视频中未出现 AI 提示词、搜索词、软件指令或配方文本。\n\n五、实用信息清单\n​​跨行核心技巧口诀​​：看明白、讲清楚、对接上。\n​​电商实操三步法​​：\n看明白用户痛点。\n看明白产品特点。\n把用户痛点和产品特点对接上。\n​​教学沟通方法​​：用对方生活里的具体例子讲抽象概念，再对应到专业名词。\n六、一句话总结最值得收藏的点\n\n做老师和做电商本质是同一件事：先看懂对方到底需要什么，再用他们能听懂的方式讲清楚，最后把你能提供的东西精准对接上——这套逻辑，放在任何行业都管用。\n\n补充一点：笔记中提到的数据截图显示，作者电商账号有\"商品访问量 1,258\"、\"支付买家数 5,310.5\"、\"加购人数 411\"、\"可提现余额 ￥12.3万\"，说明其电商业务已经跑通并产生稳定收益。"}, {"idx": 45, "id": "6ac1011f00000000020104fb", "title": "开源项目推荐！AI 编程必备，掌控大型项目", "cat": "学习闭环", "sug": "keep", "reason": "保留判据3（索引压缩上下文+指纹增量更新的工程思路直接用于他的 Vibe Coding 主线，脱离具体模型版本）。", "what": "北大开源 AOCI 项目：给大型代码库生成结构化“代码地图”索引，让 AI 编程时省 token 又看得懂全局。", "use": "作为 MCP 插件接入 Claude Code/Codex；实测 35 万行项目 token 从 602 万降到 313 万，索引体积压缩 94.5%；每条索引含 F/R/A/S 四要素（职责/关联/接口/约束）；SHA-256 指纹增量更新只重建改过的文件；实测 DeepSeek V4 Flash 挂 AOCI 后得分 71.49→77.7 反超 V4 Pro。", "next": "最小下一步：搜索 AOCI 官方仓库与安装文档；复刻目标：不适用", "detail": "", "cost": "项目越大收益越明显，小项目感知弱；首次全量建索引耗时；仓库 aoci-spec/aoci-code 需自行核实；文中模型版本号（GPT-5.6 等）属会过时引用。", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 开源项目推荐！AI 编程必备，掌控大型项目\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6ac1011f00000000020104fb?xsec_token=ABPr8dvsjZzLWX5TGd_UpwD6vbvn4cRoIttAkx6zG6k_g=&xsec_source=pc_user\n\n根据你引用的笔记，我做了如下深度拆解：\n\n一、素材与想法\n​​素材来源​​：笔记作者在对 DeepSeek Harness 进行二次开发时，实际测试了 AOCI 的效果；同时参考了 AOCI 的官方论文和 MCP 配置文档。视频中还对比了 Chromium（4000万行代码）等工业级项目的规模，用\"打印成纸\"的直观类比说明大模型上下文瓶颈。\n​​核心痛点​​：大模型即使有百万级上下文，面对几十万行甚至上亿 token 的代码库时，依然\"只看树木不见森林\"——局部盲人摸象，反复抓取无关代码，改出漫天 bug，且每次新建对话都要重新理解项目。\n​​核心想法​​：在开发前用大模型对代码库做一次预处理，压缩成高度结构化的\"代码地图\"，让 AI 随时通过这份索引了解项目架构，而不是每次都从头啃源码。\n​​达成效果​​：实测在 DeepSeek Harness 上，AOCI 组比普通组节省近一半 token（313万 vs 602万），且修改更精准——跨模块覆盖更全面、准确调用项目原有主题变量而非幻觉生成、同步更新文档和配置文件，体现出\"资深老员工\"的大局观。\n二、实现方式与技术原理\n​​整体流程​​：\n让 AI 安装 AOCI 的 MCP 插件。\n对代码库进行地毯式扫描，AI 自动选出核心文件（如测试中选出 427 个核心文件，约 9 万行代码）。\n将代码压缩成高度结构化的索引文件，体积大幅缩减（测试中从约 130 万 token 压缩到约 7.1 万 token，缩减 94.5%）。\n后续开发时，AI 先读索引建立全局认知，再定位具体源码。\n代码修改后，根据 SHA-256 指纹自动识别变更文件，仅对修改过的文件重新建立索引，无需全量重扫。\n​​压缩格式原理​​：每个文件被压缩为高度结构化的条目，包含文件名和标签（如 eU7t，其中每个字符代表模块、重要度、文件大小等信息），以及四个核心部分：​​F​​（文件负责什么）、​​R​​（与其他文件的关联）、​​A​​（对外提供的接口和能力）、​​S​​（修改时的关键约束）。\n​​最有技术含量的部分​​：基于 SHA-256 指纹的增量索引更新机制。它不会傻傻地重新读一遍所有代码，而是精准识别哪些文件被修改过，只更新这些文件的索引，既保证索引实时有效，又避免重复消耗大量 token。\n三、AI 与工具清单\n​​GPT-5.6​​：笔记中用于对比测试的模型，普通组和 AOCI 组均使用它来生成开发计划，验证 token 消耗和代码质量差异。\n​​DeepSeek V4 Flash​​：在另一组测试中，挂上 AOCI 后得分从 71.49 飙升至 77.7，越级反超裸跑的 DeepSeek V4 Pro（73.83 分）。\n​​Codex​​ / ​​Claude Code​​：笔记中提到 AOCI 可接入这类 AI 编程 Agent，作为 MCP 客户端使用。\n​​AOCI MCP​​：核心工具，作为 MCP 插件接入 AI 编程环境，负责扫描代码库、生成结构化索引、维护认知地图。\n​​DeepSeek Harness​​：笔记作者实际进行二次开发的开源项目，作为 AOCI 的测试场景（35 万行代码，约 500 万 token）。\n四、项目来源与链接\n​​AOCI 开源项目​​：笔记中未提供完整的 GitHub 地址，仅提到\"配合它的论文\"和\"aoci-spec/aoci-code\"仓库名。根据搜索补充，AOCI-CODE 由北大研究员开源，GitHub 仓库为 aoci-spec/aoci-code。\n​​论文​​：笔记提到有配套论文，但未给出具体链接。\n​​MCP 配置​​：笔记中提到让 AI 安装 AOCI 的 MCP 后对模块建立索引，具体配置方式以官方 README 为准。\n五、视频中出现的提示词/指令\n\n视频中未出现具体的提示词原文，仅提到作者让 AI 安装 AOCI 的 MCP 后对部分模块建立索引，以及将\"同一个开发需求\"分别发给普通仓库和 AOCI 仓库进行测试。\n\n六、复现指南\n​​前置条件​​：\n一个 AI 编程环境（如 Codex、Claude Code 等支持 MCP 的 Agent）。\n一个需要深度理解的代码仓库（项目越大，AOCI 效果越明显）。\n能够运行 MCP 插件的环境配置权限。\n​​最简行动清单​​：\n在 AI 编程环境中配置 AOCI 的 MCP 插件（具体命令参考官方 README）。\n进入项目目录，执行初始化命令（如 aoci init 或类似命令）扫描代码库。\n等待 AOCI 生成第一版索引文件。\n在后续开发中，AI 会自动读取索引建立全局认知，无需手动干预。\n代码修改后，AOCI 会根据 SHA-256 指纹自动更新索引。\n​​难点与坑​​：\n笔记未提及具体收费情况，但 MCP 插件和底层大模型调用可能产生 token 成本。\n项目结构过于复杂时，初次生成索引可能需要一定时间。\n需要确保 AI 编程环境正确识别并加载了 AOCI 的 MCP 配置。\n七、总结\n\nAOCI 的核心价值在于​​把 AI 对项目的前后文理解从\"每次重开会话就清零\"变成\"持续沉淀的活页交接手册\"​​——通过结构化索引让 AI 用最少 token 看清全局架构，再配合 SHA-256 指纹实现增量更新，真正让 AI 具备接管大型长线项目的工程能力。"}, {"idx": 46, "id": "6a01b3160000000037034b2b", "title": "《海阔天空》尾奏sol", "cat": "复刻闭环", "sug": "keep", "reason": "保留判据2（调性指法与装饰音难点是稳定的演奏知识，不过时，直接服务他的音乐实践线）。", "what": "《海阔天空》尾奏的洞箫/竹笛演奏展示，标注了调性与指法配置。", "use": "配置：7 调洞箫作 5、7 调竹笛作 5；难点清单：波音/打音/叠音/前倚音等装饰音、一拍半与小切分节奏、中高音转换的气息控制（技巧部分为分析检索补充，非笔记原文），建议慢练分段攻克。", "next": "最小下一步：搜索《海阔天空》尾奏sol的简谱或指法对照；复刻目标：验证7调洞箫与竹笛作5的指法是否能准确还原原曲尾奏旋律", "detail": "", "cost": "无风险；笔记本体极简（无口播无谱），实操需另找详细教学视频配合。", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 《海阔天空》尾奏sol\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6a01b3160000000037034b2b?xsec_token=ABkyhG70AAEIvTCbK--djK0Mi0Pw0jN2TOyH32mFLY-rg=&xsec_source=pc_user\n\n根据你引用的笔记，这条内容非常精简，主要是一首《海阔天空》尾奏的演奏展示。以下是完整整理：\n\n一、内容定位\n​​领域​​：音乐演奏 / 民乐教学\n​​作者身份​​：竹笛与洞箫演奏者（使用月亮牌笛子）\n​​想教会观众什么​​：展示《海阔天空》尾奏的竹笛与洞箫演奏效果，并标注了两种乐器的调性与指法，供同好参考学习\n二、内容详细讲解\n\n笔记本身没有口播和详细步骤讲解，主要信息来自图片 OCR 和正文标签：\n\n​​曲目​​：《海阔天空》尾奏 sol\n​​乐器配置​​：\n​​洞箫​​：7 调洞箫作 5\n​​竹笛​​：7 调竹笛作 5\n​​标签​​：#弘扬民乐、#竹笛、#洞箫、#月亮牌笛子\n\n从搜索补充的其他教学视频来看，《海阔天空》尾奏的竹笛演奏通常涉及以下技巧：\n\n​​波音​​：由本音到上方音再回到本音，如\"咪\"的波音\n​​打音​​：快速打一下下方音，如打\"re\"\n​​叠音​​：由上方音快速回到本音\n​​前倚音​​：如\"瑞\"到\"咪\"的一带而过\n​​节奏难点​​：一拍半的音（如\"骚\"和\"拉\"）、小切分节奏、中高音转换\n三、核心知识点\n​​关键结论​​：7 调洞箫和 7 调竹笛均采用\"作 5\"指法演奏《海阔天空》尾奏\n​​容易搞错的要点​​：\n一拍半的节奏需要打准拍子，新手容易吹快或吹慢\n中高音转换时气息控制不好容易\"吹爆\"或出现泛音\n波音、打音、叠音等装饰音需要单独慢练\n​​作者经验​​：笔记未提及具体经验，但从同类教学视频来看，建议慢练、分段练习，先打准拍子再加速\n四、视频中出现的提示词/操作文字\n\n​​视频中未出现​​具体的提示词、搜索词或软件指令。笔记中仅出现以下文字信息：\n\n图片 OCR 文字：\n\"海\"\n\"天空\"\n\"洞箫:7调洞箫作5\"\n\"竹笛:7调竹笛作5\"\n正文标签：#弘扬民乐、#竹笛、#洞箫、#月亮牌笛子\n五、实用信息清单\n​​乐器​​：月亮牌笛子（有特级、精品、珍品、极品四个档次，从入门到专业演奏均可覆盖）\n​​调性与指法​​：7 调洞箫作 5、7 调竹笛作 5\n​​曲目​​：《海阔天空》尾奏（Beyond 乐队经典曲目）\n​​相关技巧​​：波音、打音、叠音、前倚音、小切分节奏\n六、一句话总结最值得收藏的点\n\n​​7 调洞箫和竹笛均采用\"作 5\"指法演奏《海阔天空》尾奏，装饰音和节奏是核心难点，建议慢练分段攻克。​​\n\n补充一点：如果你是想学习这首尾奏的演奏，搜索结果显示有不少详细的竹笛教学视频，会逐句讲解指法、节奏和装饰音技巧，可以配合简谱一起练习。\n\n你目前是在学竹笛还是洞箫？如果是新手的话，我可以帮你找一些更适合入门的练习曲和教学视频。"}, {"idx": 47, "id": "6a2b92da000000001702fc1f", "title": "高中政治", "cat": "学习闭环", "sug": "drop", "reason": "删除判据4（他是在职小学教师，不考高中政治教资，与主线无关，残留的试讲方法论对已上岗的他属已知常识）", "what": "高中政治教资笔试面试半个月速成经验帖，含逐字稿模板和万能案例", "use": "试讲方法论可泛化：必须拍视频复盘、逐字稿要简洁好套、万能案例在精不在多、导入结合时政、看稿要看了就抬头互动", "next": "最小下一步：收藏该笔记并建立教资备考专属文件夹；复刻目标：不适用", "detail": "", "cost": "时政案例（如 2026 生态环境法典）和考试政策有时效", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 高中政治\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6a2b92da000000001702fc1f?xsec_token=ABFgJhV1TyVHxI_l3DBQDXyNrd4TwlxEjaEHlwMNkiQm8=&xsec_source=pc_user\n\n根据你引用的笔记，这是一篇关于​​高中政治教师资格证​​（笔试+面试）的备考经验帖，作者用半个月左右的时间顺利通过，并分享了详细的备考方法、逐字稿、教学设计模板和万能案例。\n\n以下是完整细致的信息整理：\n\n一、内容定位\n​​领域​​：教育类 / 教师资格证备考\n​​作者身份​​：高中政治教资考生（速成选手，备考约半个月）\n​​想教会观众什么​​：如何在短时间内高效备考高中政治教资笔试和面试，提供速成方法、逐字稿、教学设计模板、万能案例和备考资源推荐。\n二、内容详细讲解\n1. 笔试成绩展示\n\n笔记中展示了作者 2026 年上半年的笔试成绩，全部合格：\n\n​​301-综合素质（中学）​​：合格\n​​302-教育知识与能力​​：合格\n​​409-思想政治学科知识与教学能力（高级中学）​​：合格\n\n面试成绩：\n\n​​449-思想政治（高级中学）​​：合格\n\n备注：报告分满分 120 分，70 分及以上为合格。面试合格与否由各省教育行政部门确定。\n\n2. 笔试备考方法（5 天速成）\n\n作者笔试准备了 5 天，每天至少 8 小时有效学习时间，方法如下：\n\n不建议大家完全照搬速成，有一定运气成分。\n结合小红书上优秀前辈的经验，重点背诵大题套话和模板。\n选择题先做，然后写教案，把背好的模板套上去。\n使用简洁版的教案模板，写得比较快。\n第一道简答题如果时间不够、不会写，就放弃，只答几个点。\n其他大题结合套话和课标内容，每道题答将近 10 个点。\n3. 面试备考方法（10 天准备）\n加入教资交流群，搜集真题资料和电子版教科书。\n没有看教材，但把 B 站上​​政治老师爱政治​​的课本过了一遍；建议有时间的最好把教材过一遍。\n准备一篇自己的​​逐字稿​​，之后根据往年真题往里套，不建议准备太复杂的。\n准备​​万能导入​​，政治看中时政，平时练习一定要注重积累。\n例子在精不在多。\n一定要​​试讲并拍视频复盘​​，刚开始可能迷茫，但多试讲几篇就会有感觉。\n脱稿当然好，但没有也别勉强，可以大大方方看稿（不是一直盯，一定要看了就抬头互动）。\n4. 面试逐字稿（完整模板）\n首先请大家跟随老师的步伐走进今天的政治自习室，给大家三分钟的时间，结合课本内容，快速找到 xxx 的概念，好，时间到，都找到了嘛？看到有很多同学举手了。好第一排这位同学你说.......没错找的又快有准/补充的非常完整，请坐。看来大家自主学习能力都很强。\n\n接下来，请大家将目光继续投向多媒体，观看 xxx 的微课视频，思考一......。等会请同学来谈一谈。好视频播放完了，有哪位同学愿意来展示你的观点，嗯很好老师看到很多同学都举手了，这次老师要找没有举过手的同学回答。诶，靠墙的那位同学，你说...... 很好请坐。还有同学想来分享一下的嘛。好，倒数第二排穿黑衣服的男生，你说......。声音很宏亮，找到的关键词也很准确。通过两位同学的回答，我们知道了.....（老师补充）看来同学们提取有效信息的能力提升了不少。\n\n接下来，请同学们围绕......（重难点），按照之前分好的政治小组来进行讨论，讨论 5~8 分钟，结束后请各组代表来分享。老师在下面巡视了一圈，发现大家讨论的都非常认真。好，讨论时间到，有哪个小组先来分享你们的智慧结果？好二组代表先来分享......。三组代表又什么补充的吗？三组代表提的.......。那一组代表来评价一下。一组代表和老师的想法一样认为她们的切入点很准确，思路很清晰。看来大家讨论的都很高效老师给大家良好的学习氛围点赞。\n\n学习到这里，本节课就接近尾声了，通过本节课的学习，相信大家都已经有了不少收获。那么下面请同学结合本节课所学的内容，绘制思维导图。谁愿意来黑板上绘制，好，政治课代表你来黑板上绘制，其他同学在作业本上完成。嗯，思维导图绘制好了。让我们一起来看看今天的学习内容:我们首先知道了......，其次学习了......（对照板书复习）\n\n最后，给大家布置一个课后作业，请同学搜集.......本节课相关的内容）。下节课我们一起交流分享。\n\n好了同学们，下课！感谢各位考官，我的试讲结束！\n5. 高中教资教学设计模板（片段）\n​​指导思想​​：坚持中国特色社会主义，坚持中国共产党的百年奋斗历程，学会辩证、总观、系统地看待问题，坚持马克思主义的世界观和方法论，培养科学精神。\n​​环节一：导入新课​​\n教师展示《中国共产党的使命》视频。\n教师提问：大家看这个视频有什么感受吗？\n学生思考与回答，教师总结，引出新课主题：​​新时代新征程中国共产党的使命任务​​。\n​​环节二：新课讲授​​\n​​议题一：中国共产党的初心和使命​​\n教师常用小组讨论法。\n教师提问：中国共产党的初心和使命是什么？体现在哪里？\n学生四人一组讨论 3-5 分钟。\n学生回答后，教师总结：中国共产党的初心和使命是为中国人民谋幸福，为中华民族谋复兴。\n​​议题二：奋斗实现理想​​\n​​学生评价原则​​：\n评价的根本是促进学生发展，多给学生肯定性评价。\n评价要全面，评价标准全面、评价内容综合化。\n评价不仅要重视结果，更要注重过程，将形成性评价和终结性评价结合。\n评价要注重能力的评价。\n评价方式是多样化的。\n关注个体差异。\n6. 面试课堂流程和注意事项\n​​自我介绍​​：表达流畅大方（求职面试场时为每位评委老师分发一份个人简历）。\n​​亮眼导入​​：结合时政设计一个吸引人的导入，同时书写板书标题。\n​​学生分享与教师评价​​：使用教师评论语言，如\"很棒，你的分析很全面透彻\"\"大家一点就通，反应很快啊\"\"回答得非常好，让我们把掌声送给他\"\"咱们同学逻辑清晰，语言表达能力很强\"。\n​​小组讨论环节​​：设置 5-8 分钟讨论时间，教师巡视指导。\n​​课堂导入示例​​（以《生态环境法典》为例）：\n\"同学们，绿水青山就是金山银山，生态环境关乎每个人的生存与发展。从蓝天保卫战到碧水守护行动，从低碳生活到绿色产业，中国以坚定决心推进生态文明建设。2026 年，生态环境法典落地实施，让我们把掌声送给这一小组的所有同学。\"\n​​当堂检测​​：结合本课所学，进行针对性设问检测。\n​​教姿教态​​：站姿端正、眼神环视学生（和评委的眼神交流），手势自然，语调抑扬顿挫，重点内容加重语气，提高语言表达感染力，走到学生中间巡视。\n​​课堂升华​​：综合中国梦、国家发展，实现从个人到国家的主题升华。\n​​课后实践​​：设计符合本课内容的课后作业、实践任务。\n​​板书设计​​：板书完整，结构清晰，字迹工整，试讲中逐步完善板书（讲究记得住黑板）。\n​​备选课堂活动​​：时政速答闯关，将本课关联时政热点设计为判断题、选择题等。\n7. 初高中政治万能案例\n\n笔记中整理了多个万能案例，适用于不同课题：\n\n​​宫文创​​：年入 15 亿，600 岁古建\"出圈\"。适用课题：《文化创新的路径》——创造性转化、创新性发展。\n​​智能手机​​：以 iPhone 或华为手机为例，设计在美国加州，芯片等部件来自多个国家。适用课题：《经济全球化》——引出贸易摩擦、关税影响等问题。\n​​司马光砸缸​​：\"人离水\"与\"水离人\"的对比思考。适用课题：《发散思维与聚合思维》——创新思维的要求。\n​​老旧小区党群议事会​​：解决 200 个车位停 500 辆车的矛盾。适用课题：必修 3《政治与法治》——基层群众自治。\n​​生态环境法典​​：2026 年 3 月，十四届全国人大四次会议审议通过，8 月 15 日正式施行。适用课题：新发展理念、国家治理。\n​​中国外交热点​​：以 2026 年近期中国外交热点为素材，学习国家安全、时代主题、人类命运共同体等核心知识。\n8. 推荐博主和资源\n\n笔记中提到的备考博主和资源：\n\n​​政治老师爱政治​​：B 站博主，用于过课本知识点。\n​​刘勖雯政史地​​：B 站博主，有高中政治七本书无废话纯享版。\n​​我是紫童​​：B 站博主，分享政治主观题万能模板话术。\n​​智冬老师​​：提供课标相关内容，用于大题作答。\n​​小红书博主​​：追光少年人（分享面试流程、万能案例、时政素材）、宇宙信号（分享万能导入、选修试讲案例）、车晚星、王墩墩er、一只绵羊等。\n三、核心知识点\n1. 关键结论\n笔试速成 5 天、面试准备 10 天是可行的，但有一定运气成分，不建议完全照搬。\n面试核心在于​​试讲+复盘​​，多拍视频找问题，比单纯背稿更重要。\n政治教资非常看重​​时政积累​​，导入和案例一定要结合最新时政热点。\n教案和逐字稿要准备​​简洁版​​，写起来快，考场上时间紧。\n2. 容易搞错、需特别注意的要点\n​​不要一直盯稿​​：如果看稿，一定要看了就抬头互动，保持眼神交流。\n​​例子在精不在多​​：准备几个万能案例反复用，比准备一堆不熟悉的案例更好。\n​​第一道简答题如果不会写就果断放弃​​：时间不够时，把时间留给大题，每道题答满 10 个点比纠结一道题更重要。\n​​板书要逐步完善​​：不要一开始就写满黑板，试讲过程中边讲边写，体现教学节奏。\n3. 作者的个人经验和小贴士\n加教资交流群，搜集真题资料和电子版教科书，信息差很重要。\n面试逐字稿不要准备太复杂的，简洁好记、容易套题的版本更适合考场。\n拍视频复盘能发现很多自己意识不到的问题（如手势、语调、眼神）。\n政治科三大题可以结合\"套话+课标\"来答，每道题尽量答满 10 个点。\n四、视频中出现的提示词/操作文字\n\n笔记中未出现明确的 AI 提示词或软件指令，但包含以下可照抄的文本模板：\n\n​​面试逐字稿​​（见上文完整模板）\n​​教师评论语言​​：\n\"很棒，你的分析很全面透彻\"\n\"大家一点就通，反应很快啊\"\n\"回答得非常好，让我们把掌声送给他\"\n\"咱们同学逻辑清晰，语言表达能力很强\"\n​​万能导入示例​​（以生态环境法典为例）：\n\"同学们，绿水青山就是金山银山，生态环境关乎每个人的生存与发展。从蓝天保卫战到碧水守护行动，从低碳生活到绿色产业，中国以坚定决心推进生态文明建设。2026 年，生态环境法典落地实施，让我们把掌声送给这一小组的所有同学。\"\n五、实用信息清单\n1. 备考时间线\n​​笔试​​：5 天速成，每天至少 8 小时有效学习。\n​​面试​​：10 天准备，重点在试讲和复盘。\n2. 面试 速率限制​​：在平台选择模型时，部分模型可能会有限流或排队现象，建议多尝试切换，找到响应最快的那个。\n四、视频中出现的提示词/操作文字\n\n笔记中未出现作者输入给 AI 的具体提示词，但图片 OCR 中展示了 GLM-5.2 在代码调试场景下的部分内部操作文字：\n\n​​诊断与修复​​：“根本问题是模型的动力学参数不合适。让我修复 projected_neural_ni 的初始化，使其更稳定。”\n​​文件操作​​：“让我修复 projected neural_ni 的初始化，使其更稳定。> Edit identification/experiments/un grid ni compari..”\n​​终端命令​​：“Shell cd E:;AResearchAPasivity Exteded python ni..”\n​​排查问题​​：“结果还是一样！这说明诊断脚本没有使用修改后的初始化。让我检查诊断脚本的初始化代码。”\n​​搜索与更新​​：“Search raw network|storage_raw|xavier”、“诊断脚本使用的是旧的初始化。让我更新诊断脚本并重新运行。”、“Edit ni identification/check_states.py”\n五、实用信息清单\n\n以下是从笔记及评论区中提炼的可直接使用的信息：\n\n​​平台名称​​：并行智算云（大模型平台 / MaaS）\n​​核心模型​​：智谱 GLM-5.2（支持长文本、代码生成、智能体工程）\n​​适用人群​​：清华大学在校师生（需通过校内账号登录领取算力券）\n​​算力券额度​​：笔记中未明确具体金额，但评论区有同学提到账户里有 1000 元或 2000 元额度，且有时效性（如 8 月 31 日或次年 9 月过期）。\n​​使用入口​​：通过清华校内统一身份认证登录并行智算云平台，进入“大模型平台”或“模型广场”即可调用。\n​​API 接入​​：平台支持生成 API 密钥，可接入 CC（Cursor / Claude Code）或其他第三方 Agent 工具中使用。\n​​避坑提醒​​：算力券有明确的过期时间，务必在到期前用完；仅限本人学习科研使用，严禁转让牟利或用于挖矿等违规用途。\n六、一句话总结最值得收藏的点\n\n清华在校师生务必在过期前登录并行智算云平台，用免费算力券体验 GLM-5.2 的长文本与代码能力，夜间调用还能薅到限时福利 Token。\n\n​​补充一点（联网搜索信息）​​：\n\n​​算力券领取​​：清华学生可通过 并行智算云官网并行智算云官网 用学号认证登录，一键领取算力券和智谱编程套餐。\n​​API 配置​​：获取 API 密钥和 URL 后，可配置到 CCSwitch 或 Chatbox 等工具中，将 GLM 接入到日常开发环境中。\n​​夜间福利详情​​：并行科技曾推出“GLM-5.2 算力狂欢夜”活动，每晚 21:00 至次日 9:00，科教白名单账号每晚可获赠 1 亿 Token 免费额度。\n\n如果你也是清华的同学，赶紧去检查一下自己的算力券余额，别让它白白过期了！"}, {"idx": 49, "id": "6a5ef580000000000f02bf45", "title": "调研GitHub 上 K12 AI教育相关的开源项", "cat": "学习闭环", "sug": "keep", "reason": "保留判据2/3：教师+AI 开发者双重身份直接对口，项目地图与'先选型再造轮子'思路长期可查，心理课可视化等模块可立即取用", "what": "GitHub 上 30+ 个 K12 教育开源项目按场景分类的选型地图", "use": "六类选型：教材（ChinaTextbook+SmartEduDownloader 组合）、题库（RAG 出题 question-bank）、考试系统（学之思）、互动课件（teachany/OpenMAIC 多 Agent 生成 PPTX/H5-Dooring 零代码）、教育大模型（EduChat/EDUKG 知识图谱）、创客（StudioClassroom）；附 Star、技术栈和具体部署路径建议", "next": "最小下一步：收藏该笔记，并在笔记内按教材、题库、课件、AI教学等维度建立个人分类标签；复刻目标：不适用", "detail": "", "cost": "数据截至 2026 年 7 月 Star 会变；部分项目需 Docker/API Key，商用需逐个确认 License", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 调研GitHub 上 K12 AI教育相关的开源项\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6a5ef580000000000f02bf45?xsec_token=AB-YbpF7uiZW7JQLElXeqaUgkoGTM5VYISe9XLz6iVM_U=&xsec_source=pc_user\n\n而非单个实操教程。因此部分维度（如具体提示词、从 0 到 1 的实现步骤）在笔记中并未展开。以下按你要求的七部分进行拆解：\n\n一、素材与想法\n​​素材与数据来源​​：笔记作者直接浏览并筛选了 GitHub 上的开源项目，按用途维度（教材、题库、SIS、互动课件、AI 教学层、创客类）分类整理，标注了每个项目的 Star 数、技术栈和适用场景。数据截至 2026 年 7 月。\n​​核心想法​​：面向教师、家长和教育开发者，解决\"找教材难、组卷繁琐、排课复杂、做互动课件门槛高\"等痛点，通过开源项目降低 K12 教育数字化的成本。\n​​新在哪、省在哪、强在哪​​：\n​​新​​：把 AI 原生能力（RAG 出题、多 Agent 课堂生成、AI 组卷判题）和传统教育工具结合，是近一年最活跃的方向。\n​​省​​：教材、题库、课件全部开源免费，省去了购买付费资源或从零开发的时间。\n​​强​​：按场景分类并给出\"选型速查\"，让非技术人员也能快速找到适合自己的工具组合。\n二、实现方式与技术原理\n\n笔记本身是调研盘点，未展示作者如何\"从 0 到 1\"实现某个具体项目，但提到了部分项目的技术原理：\n\n​​RAG 出题​​：gygy-open/question-bank 将 Word/MD/图片 输入后，通过 RAG（检索增强生成）进行 AI 抽题结构化，并加入审核流。\n​​多 Agent 协作​​：THU-MAIC/OpenMAIC 通过多个 AI Agent（AI 老师 + AI 同学）进行\"圆桌讨论式协作\"，完成教学结构设计、内容生成和交互呈现，支持导出 PPTX。\n​​知识图谱​​：THU-KEG/EDUKG 构建了 2.52 亿实体 / 38.6 亿三元组的 K12 知识图谱，作为教育 AI 的基础设施。\n​​向量检索 + 混合检索​​：部分 AI 题库和 RAG 聊天机器人项目使用向量数据库 + 关键词检索融合，提升题目匹配和讲解的准确性。\n三、AI 与工具清单\n\n笔记中提到的模型、框架、工具如下：\n\n​​DeepSeek​​：用于 dxy1994/xex（学而习）驱动 AI 组卷、智能判题和逐题讲解。\n​​FastAPI​​：youufis/SmartKBS 和 learnhouse 的后端框架。\n​​React​​：youufis/SmartKBS 的前端框架。\n​​Next.js​​：learnhouse 的前端框架。\n​​Redis​​：learnhouse 的缓存组件。\n​​Node + Express​​：AI4K12 课堂 MVP 的技术栈。\n​​Java + Vue​​：wennan1988/xzs-mysql（学之思）的技术栈。\n​​LangGraph​​：部分多 Agent 项目用于编排协作流程（联网补充）。\n​​Ollama​​：OpenMAIC 支持接入本地模型（联网补充）。\n​​LaTeX​​：用于题库项目中的公式渲染。\n四、项目来源与链接\n\n笔记中明确提到的 GitHub 项目及用途如下：\n\n​​TapXWorld/ChinaTextbook​​：小学→高中全学科 PDF 教材合集，约 46k Star。GitHub 地址\n​​LoongBa/SmartEduDownloader​​：命令行一键批量下载国家智慧教育平台教材和视频。\n​​wuwangzhang1216/ChinaTextbookStudyFree​​：小学全科 AI 学习平台，AI 出单元小测 + TTS 听读。\n​​Emerging-Rule/community​​：K12 AI 教案库，双语（英/西）。\n​​vbirds/Math​​：人教版小学→大学数学全套教材 + 练习题。\n​​wennan1988/xzs-mysql​​（学之思）：Java+Vue 前后端分离考试系统，支持 PC + 小程序。\n​​gygy-open/question-bank​​：AI 原生题库，支持 RAG 出题。\n​​dxy1994/xex​​（学而习）：DeepSeek 驱动的 AI 组卷 + 智能判题系统。\n​​LanceZPF/MDK12-Bench​​：上海 AI Lab 出品的 K12 多学科评测基准，14 万题。\n​​limin6661/edu-tools-kit​​：小学口算 100 道随机出 + 自动批改 + A4 打印。\n​​OS4ED/openSIS-Classic​​：PHP/MySQL 的 K12 学生信息系统，排课/考勤/成绩/家长门户。\n​​天天开源 OpenEDU​​：国内团队开发的智能排课系统，适配小学→高中→中职→教培。\n​​weponusa/teachany​​：教学设计 OS，把任意 K12 知识点变互动课，420+ 课件。\n​​THU-MAIC/OpenMAIC​​：清华多 Agent 课堂生成，支持导出 PPTX。\n​​henrypoter/K12-Teaching-Animation​​：理化生/信息微观可视化动画，HTML 静态站。\n​​h227/minilab​​：小学数学互动工具包（概率模拟/图形演示）。\n​​joycoding200/math-teaching-for-primary-grades​​：小学 1-5 年级奥数可视化，200+ 题。\n​​MrXujiang/h5-Dooring​​（教育版）：零代码 H5 互动课件制作。\n​​ECNU-ICALK/EduChat​​：华东师大教育大模型，400 万 SFT 数据，含心理/安全/智慧黑板等模块。\n​​youufis/SmartKBS​​：全学段全学科 AI 教学管理平台。\n​​learnhouse​​：自托管 LMS，实时代码执行 + AI 助教。\n​​AI4K12 课堂 MVP​​：Node+Express 课堂网关形态。\n​​anthropic/k12-teacher-skills​​：Claude 专用 K12 技能库，教案生成 + 分层设计。\n​​THU-KEG/EDUKG​​：清华 K12 知识图谱，2.52 亿实体。\n​​sxflynn/TeacherGPT​​：RAG 聊天机器人，基于真实学生数据给教师个性化建议。\n​​StudioClassroom/StudioClassroom​​：MIT Media Lab + 字节飞书教育联合的 12-18 岁全栈创客平台。\n​​RainGather/awesome-k12-cs​​：中小学信息科技资源索引。\n​​wuyb/awesome-k12​​：中文 K12 开源合集。\n五、视频中出现的提示词\n\n笔记为图文形式，未展示实际输入给 AI 的提示词或指令，因此​​视频中未出现提示词​​。\n\n六、复现指南\n\n笔记本身是\"项目盘点\"而非\"实操教程\"，因此没有统一的复现步骤。但笔记给出了​​选型速查​​，不同场景的复现路径如下：\n\n​​前置条件​​：需要 GitHub 账号、基础命令行知识（clone 仓库）、部分项目需要配置 API Key 或部署 Docker 环境。\n​​最简行动清单​​：\n​​拿教材备课​​：clone ChinaTextbook 拿到教材，再用 SmartEduDownloader 追更。\n​​学校排课/学籍系统​​：部署 openSIS-Classic（国外范式）或 OpenEDU（国产排课）。\n​​搭在线考试​​：部署 学之思 xzs（稳）或 学而习 xex（AI 判题）。\n​​做 AI 互动课件​​：使用 TeachAny（最全）或 OpenMAIC（清华多 Agent）或 H5-Dooring（零代码）。\n​​搞教育大模型产品​​：基于 EduChat（华师大全栈）或 EDUKG（知识图谱）或 MDK12-Bench（评测）。\n​​难点与坑​​：\n部分项目依赖特定 API（如 DeepSeek、Claude），需要申请密钥并可能产生费用。\n开源协议不同，商用前需确认是否允许（评论区有人问\"可商用吗\"，回复是\"大部分可以\"，但需逐个项目确认 License）。\n部分教材项目可能涉及版权问题，使用时需注意当地规则。\n一些项目更新频率不高，教材版本可能滞后。\n七、关键总结\n\n​​这篇笔记的核心价值是\"选型地图\"——把 GitHub 上百个 K12 教育开源项目按场景分类，标注 Star 数和技术栈，让老师、家长和开发者能快速找到\"拿来就能用\"的工具组合，而不是从零造轮子。​​\n\n如果你打算从某个具体项目开始上手，可以告诉我你更偏向哪个场景（备课、考试、排课、互动课件），我来帮你进一步拆解该项目的部署和用法。"}, {"idx": 50, "id": "6a1481b7000000003701ddc3", "title": "我真的尝试过好多种副业啊……", "cat": "归档观察", "sug": "drop", "reason": "删除判据4（个人深夜随笔，信息密度低，与 AI 创作/Vibe Coding 主线无关，也不属于判据 4 的隐性生活规则；仅剩的两句心态金句属鸡汤情绪价值）", "what": "一位跨境电商博主的深夜副业流水账，列了 7 项在做、2 项想做的副业与心路历程。", "use": "仅两句可拾：不擅长出镜时文字创作更舒服、写小说的沉浸感能对冲数据焦虑；反面是不跟风做短视频带货。", "next": "最小下一步：把\"写小说的沉浸感\"和\"不焦虑数据\"这两个启发记到灵感库；复刻目标：不适用", "detail": "", "cost": "无", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 我真的尝试过好多种副业啊……\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6a1481b7000000003701ddc3?xsec_token=AB5AXU7-RCFq0n8fgzZK0WWmslDwCPXuOSkQNmA4jfMIM=&xsec_source=pc_user\n\n根据你引用的笔记，以下是完整细致的信息整理：\n\n一、内容定位\n​​领域​​：副业探索 / 个人成长 / 内容创作\n​​作者身份​​：跨境电商从业者（美区 TikTok Shop 为主业），同时运营多个副业项目的创作者\n​​想教会观众什么​​：分享自己尝试过多种副业的真实经历与心路历程，帮助他人了解不同副业的难度与适合自己的方向，鼓励大家找到真正热爱的创作方式\n二、内容详细讲解\n\n笔记以\"深夜日记\"的形式，按时间线梳理了作者正在做和想做的副业项目：\n\n​​已放弃的副业​​：短视频带货（国内国外都试过），作者认为这个赛道太卷，且自己不适合出镜讲解，还要考虑打光等问题，数据焦虑也很严重\n​​正在做的副业（共 7 项）​​：\n​​跨境电商​​：美区 TikTok Shop，这是作者的主业\n​​公众号​​：2 个账号，已经开始盈利\n​​油管博主​​：5k 粉丝，虽未开通 YPP（YouTube Partner Program），但通过引流实现了订单转化\n​​独立站​​：美甲站一个，新站一个（还没做起来，暂时不展开说）\n​​卖摄影作品​​：收益不多，但一直有持续收入\n​​写剧本​​：大纲已经写完，正在修改，计划今年完成三篇大纲后报名央视的活动\n​​写小说​​：第一天尝试，没有收益但很开心，作者发现自己更喜欢虚构性创作\n​​还想做的副业（共 2 项）​​：\n​​B 站和知乎同步更新的知识博主​​：认为这个过程能锻炼知识学习和总结能力\n​​TikTok 个人账号​​：用英语讲各种内容，用来逼迫自己练习口语\n三、核心知识点\n​​关键结论​​：不是所有副业都适合自己，找到真正享受的过程比盲目追求收益更重要。作者尝试短视频带货时数据焦虑严重，但写小说时完全不在乎有没有人看，反而觉得\"像在看一部自己创作的电视剧\"\n​​容易搞错的要点​​：很多人以为副业就是\"快速赚钱\"，但作者的经历说明，副业需要匹配自己的性格和擅长方式（比如作者不擅长出镜讲解，文字创作反而更舒服）\n​​作者的个人经验和小贴士​​：\n不要盲目跟风做短视频带货，赛道太卷，且需要出镜、打光、面对数据焦虑\n写小说/虚构性创作是一种很好的情绪体验方式，不需要一开始就考虑收益\n睡好觉才有精力完成这么多事，\"深夜想法\"也要适可而止，早点休息\n四、视频中出现的提示词/操作文字\n\n笔记未提供视频画面、口播和字幕内容，仅基于文字正文和图片 OCR 整理，因此​​视频中未出现​​具体的提示词或操作文字。\n\n五、实用信息清单\n​​正在做的副业清单​​：\n美区 TikTok Shop（跨境电商主业）\n公众号 2 个账号（已盈利）\n油管博主（5k 粉，引流转化订单）\n独立站（美甲站 + 新站）\n卖摄影作品（持续有收益）\n写剧本（大纲修改中，目标今年完成 3 篇报名央视活动）\n写小说（虚构性创作，第一天）\n​​计划尝试的副业清单​​：\nB 站 + 知乎知识博主（同步更新）\nTikTok 个人账号（用英语讲，练口语）\n​​放弃的副业​​：短视频带货（国内国外）\n六、一句话总结最值得收藏的点\n\n​​副业不是盲目跟风，而是找到让自己享受的过程——作者放弃数据焦虑严重的短视频带货，却在写小说中找到了\"像看自己创作的电视剧\"一样的快乐。​​\n\n补充一点：从评论区可以看出，很多读者对作者的跨境电商流程很感兴趣，有人直接求\"保姆级教程\"，也有人觉得自媒体门槛不高、\"直接做就好了\"。但作者本人的经历也说明，每个副业赛道都有自己的难度曲线，适合自己的才是最好的。"}]};
const CAT = {A:"A 工具资源",B:"B 技术实操",C:"C 创作设计",D:"D 搞钱变现",E:"E 学习成长",F:"F 视野观点",G:"G 生活其他"};
const LS_KEY = "review2::" + BATCH.batch;
const N = BATCH.items.length;
let V = load();
let pos = firstPending(0);
let busy = false;
let paused = false;          // 体感「握拳暂停」：暂停时手势/语音/键鼠一律不判决
let lastAutoSig = "";        // 已自动交过的判决指纹（防重复下载）
function setPaused(v){
  paused=!!v;
  const b=document.getElementById('pausebar');
  if(b) b.classList.toggle('show', paused);
  if(paused) toast('已暂停：判决输入全部停下');
}
document.getElementById('pausebar').onclick=()=>{ setPaused(false); toast('已继续'); };

function load(){
  try{ const v = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); return (v && typeof v==="object") ? v : {}; }
  catch(e){ return {}; }
}
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(V)); }
function firstPending(from){
  for(let i=from;i<N;i++){ if(!(BATCH.items[i].id in V)) return i; }
  for(let i=0;i<from;i++){ if(!(BATCH.items[i].id in V)) return i; }
  return N;
}
function counts(){
  let k=0,d=0;
  for(const id in V){ if(V[id]==="keep")k++; else if(V[id]==="drop")d++; }
  return {k,d,p:N-k-d};
}
function toast(msg){
  const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),1500);
}

function render(dir){
  { const o=document.getElementById("ov"); if(o && !o.hidden) buildOv(); }
  const {k,d,p}=counts();
  document.getElementById("c-keep").textContent=k;
  document.getElementById("c-drop").textContent=d;
  document.getElementById("bar-keep").style.width=(100*k/N)+"%";
  document.getElementById("bar-drop").style.width=(100*d/N)+"%";
  document.getElementById("bar-pending").style.width=(100*p/N)+"%";
  if(pos>=N || p===0){ showDone(); return; }
  document.getElementById("done").classList.remove("show");
  const card=document.getElementById("card");
  card.hidden=false;
  drawCard(card, BATCH.items[pos]);
  card.classList.remove("fly-drop","fly-keep","back","enter");
  void card.offsetWidth;
  card.classList.add(dir==="back"?"back":"enter");
  card.scrollTop=0;
  document.getElementById("pos").textContent = "第 "+(pos+1)+" / "+N+" 张";
}
function showDone(){
  const card=document.getElementById("card"); card.hidden=true; card.style.transform="";
  const {k,d}=counts();
  document.getElementById("done-stat").textContent="共 "+N+" 篇：判留 "+k+" 篇，判删 "+d+" 篇。可先导出判决，或逐张复查改判。";
  document.getElementById("done").classList.add("show");
  document.getElementById("pos").textContent="完成";
  autoSubmitIfSettled();
}
// 最后一张判完即自动交卷：判决指纹变了才再交一次（撤销后重判会再交，重复渲染不刷屏）
function autoSubmitIfSettled(){
  if(BATCH.demo) return;
  const v=buildVerdict();
  if(v.counts.pending>0) return;
  const sig=v.keep.join(",")+"#"+v.drop.join(",");
  if(sig===lastAutoSig) return;
  lastAutoSig=sig;
  const fname=downloadVerdict(v);
  document.getElementById("done-stat").textContent=
    "共 "+N+" 篇全部判完：判留 "+v.counts.keep+" 篇，判删 "+v.counts.drop+" 篇。"+
    "已自动保存为 "+fname+"，Agent 每 5 分钟检查一次收取路径，收到即自动分析并执行——你不用点任何按钮。"+
    "（若要改判：按 ↑ 返回上一条重判，改完会再自动交一次。）";
  toast("全部判完，判决已自动导出");
}
function el(tag, cls, text){
  const e=document.createElement(tag); if(cls)e.className=cls; if(text!=null)e.textContent=text; return e;
}
function drawCard(card, it){
  card.className="swipe-card "+(V[it.id]==="keep"?"card-v-keep":V[it.id]==="drop"?"card-v-drop":"");
  card.style.transform=""; card.scrollTop=0; card.innerHTML="";

  // 盖章
  card.appendChild(el("div","stamp drop","删"));
  card.appendChild(el("div","stamp keep","留"));

  // 元信息行
  const meta=el("div","meta");
  meta.appendChild(el("span","idx","#"+it.idx+" / "+N));
  if(it.cat) meta.appendChild(el("span","cat",CAT[it.cat]||it.cat));
  const t=el("span","title",it.title); t.title=it.title; meta.appendChild(t);
  const now=el("span","now",V[it.id]==="keep"?"已判留 · 右滑维持 / 左滑改删":"已判删 · 左滑维持 / 右滑改留");
  meta.appendChild(now);
  card.appendChild(meta);

  // ① 一审建议
  const map = it.sug==="keep"
    ? {cls:"v-keep", ico:"✓", label:"建议留", sub:"一审"}
    : it.sug==="drop"
    ? {cls:"v-drop", ico:"✕", label:"建议删", sub:"一审"}
    : {cls:"v-dispute", ico:"!", label:"有争议", sub:"一审倾向删"};
  const vd=el("div","verdict "+map.cls);
  vd.appendChild(el("div","v-ico",map.ico));
  const vm=el("div","v-main");
  const vl=el("div","v-label",map.label);
  vl.appendChild(el("small",null,map.sub));
  vm.appendChild(vl);
  vm.appendChild(el("div","v-reason",it.reason));
  vd.appendChild(vm); card.appendChild(vd);

  // ② 笔记总结
  if(it.what || it.use || it.detail || it.cost || it.quote){
    const sm=el("div","summary");
    if(it.what){
      const r=el("div","s-row");
      r.appendChild(el("span","s-tag","讲什么"));

function decide(val){
  if(busy || paused) return;
  const it=BATCH.items[pos];
  const overwriting = V[it.id] && V[it.id]!==val;
  V[it.id]=val; save();
  busy=true;
  const card=document.getElementById("card");
  card.style.transform="";
  void card.offsetWidth;
  card.classList.add(val==="keep"?"fly-keep":"fly-drop");
  const {k,d}=counts();
  document.getElementById("c-keep").textContent=k;
  document.getElementById("c-drop").textContent=d;
  setTimeout(()=>{ busy=false; pos=firstPending(pos+1); render(); },290);
  if(overwriting) toast("已改判"+(val==="keep"?"留":"删"));
}
function back(){
  if(busy || paused) return;
  if(pos>=N){ pos=N-1; delete V[BATCH.items[pos].id]; save(); render("back"); return; }
  if(pos<=0){ toast("已经是第一条了"); return; }
  pos--;
  delete V[BATCH.items[pos].id];
  save();
  render("back");
}

/* ---- 拖拽 ---- */
let drag=null;
function attachDrag(card){ card.addEventListener("pointerdown",onDown); }
function onDown(e){
  if(busy) return;
  if(e.target.closest("button, summary, details, a, input")) return;
  if(e.button!=null && e.button!==0) return;
  const card=document.getElementById("card");
  drag={x:e.clientX,y:e.clientY};
  card.classList.add("grabbing");
  try{ card.setPointerCapture(e.pointerId); }catch(_){}
  card.addEventListener("pointermove",onMove);
  card.addEventListener("pointerup",onUp);
  card.addEventListener("pointercancel",onUp);
}
function onMove(e){
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y, card=document.getElementById("card");
  card.style.transform="translate("+dx+"px,"+dy+"px) rotate("+(dx/18)+"deg)";
  card.querySelector(".stamp.keep").style.opacity=Math.max(0,Math.min(1,dx/110));
  card.querySelector(".stamp.drop").style.opacity=Math.max(0,Math.min(1,-dx/110));
  document.getElementById("btn-back").classList.toggle("armed", dy<-70 && Math.abs(dy)>Math.abs(dx));
}
function onUp(e){
  if(!drag) return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y; drag=null;
  const card=document.getElementById("card");
  card.classList.remove("grabbing");
  document.getElementById("btn-back").classList.remove("armed");
  card.querySelector(".stamp.keep").style.opacity=0;
  card.querySelector(".stamp.drop").style.opacity=0;
  card.removeEventListener("pointermove",onMove);
  card.removeEventListener("pointerup",onUp);
  card.removeEventListener("pointercancel",onUp);
  if(dy<-80 && Math.abs(dy)>Math.abs(dx)*1.1){ back(); }
  else if(dx>110){ decide("keep"); }
  else if(dx<-110){ decide("drop"); }
  else { card.style.transform=""; }
}

document.addEventListener("keydown",e=>{
  if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const o=document.getElementById("ov");
  if(e.key==="Escape"){ if(o && !o.hidden) closeOv(); return; }
  if(o && !o.hidden) return;                       // 总览打开时不响应判决键
  if(e.key==="ArrowLeft"||e.key==="1"){ e.preventDefault(); if(pos<N) decide("drop"); }
  else if(e.key==="ArrowRight"||e.key==="2"){ e.preventDefault(); if(pos<N) decide("keep"); }
  else if(e.key==="ArrowUp"||e.key==="3"){ e.preventDefault(); back(); }
});

function autoAdopt(){
  const pending=BATCH.items.filter(it=>!(it.id in V));
  if(!pending.length){ toast("没有未判笔记"); return; }
  let k=0,d=0,q=0;
  pending.forEach(it=>{ if(it.sug==="keep")k++; else if(it.sug==="drop")d++; else q++; });
  if(!confirm("将对 "+pending.length+" 篇未判笔记采纳一审建议：判留 "+k+"、判删 "+d+
    (q?"，争议 "+q+" 篇按倾向判删（之后可逐张改判）":"")+"。确定？")) return;
  pending.forEach(it=>{ V[it.id]= it.sug==="keep"?"keep":"drop"; });
  save(); pos=N; render();
}
function buildVerdict(){
  const {k,d,p}=counts(), now=new Date();
  const keep=[],drop=[],pendingIds=[];
  BATCH.items.forEach(it=>{
    if(V[it.id]==="keep")keep.push(it.id);
    else if(V[it.id]==="drop")drop.push(it.id);
    else pendingIds.push(it.id);
  });
  return {
    kind:"second_review_verdict", batch:BATCH.batch, demo:!!BATCH.demo,
    exported_at:now.toISOString(), total:N,
    counts:{keep:k,drop:d,pending:p}, keep, drop, pending:pendingIds
  };
}
function downloadVerdict(v){
  const tag = v.counts.pending>0 ? "draft" : "final";
  const fname="verdict_"+BATCH.batch+"_"+tag+".json";  // 固定名，Agent 守望脚本按名收取
  const blob=new Blob([JSON.stringify(v,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=fname;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  return fname;
}
function exportVerdict(){
  const v=buildVerdict();
  if(v.counts.pending>0 && !confirm("还有 "+v.counts.pending+" 篇未判。导出后 Agent 只执行留/删，未判篇不动。继续导出草稿？")) return;
  const tag = v.counts.pending>0 ? "draft" : "final";
  const fname=downloadVerdict(v);
  if(tag==="final") lastAutoSig=v.keep.join(",")+"#"+v.drop.join(",");  // 手点过的这份不再自动重交
  toast(tag==="final" ? "已导出，Agent 会自动收取，你不用做别的" : "已导出草稿 "+fname);
}
function importVerdict(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const v=JSON.parse(r.result);
      const ids=new Set(BATCH.items.map(it=>it.id));
      let k=0,d=0,bad=0;
      (v.keep||[]).forEach(id=>{ if(ids.has(id)){V[id]="keep";k++;} else bad++; });
      (v.drop||[]).forEach(id=>{ if(ids.has(id)){V[id]="drop";d++;} else bad++; });
      save(); pos=firstPending(0); render();
      toast("已导入：留 "+k+" / 删 "+d+(bad?" / 非本批次 "+bad:""));
    }catch(err){ alert("文件解析失败："+err.message); }
  };
  r.readAsText(file,"utf-8");
}

/* ============ 体感控制：手势 / 头动 / 手指 三模（视频不出本机） ============
   手势：手左挥=删 右挥=留 上/下挥=撤；完整滑动（起势→位移→停手）才触发
   头动：头左偏=删 右偏=留 后仰=撤；正视校准后稳定保持 HOLD_MS 才触发
   手指（默认，2026-09-28）：握拳=暂停/继续 · 1指=留 · 2指=删 · 3指=撤销；
        连续 FING_VOTE 帧同一结果才触发，触发后需换手势（或手离开半秒）才能再触发 */
const SWIPE_D=0.18;        // 手势：最小滑动位移（画面宽=1）
const AXIS_R=1.25;         // 手势：主轴须比副轴大这么多倍
const V_START=0.55;        // 手势：起势速度（归一化/秒）
const V_STOP=0.30;         // 手势：停手速度
const SETTLE_MS=150;       // 手势：低速多久判定滑动结束
const TRAJ_MS=900;         // 手势：单条轨迹最长存活
const COOL_MS=400;         // 两次触发最小间隔
const YAW_T=0.30, UP_T=0.07;                     // 头动：左右偏 / 后仰 触发线（钝一点，防轻微偏转误触）
const HOLD_MS=300, NEUTRAL_MS=220, CALIB_N=40;   // 头动：保持 / 回中 / 校准帧数
const FING_VOTE=8;         // 手指：连续多少帧数手指结果一致才判定（约 0.25s）
const FING_COOL=700;       // 手指：两次判定最小间隔
const HAND_GONE_MS=500;    // 手离开画面超过这么久，才允许同一手势再次触发
const CAM_MODE_KEY='review2::cam-mode';
const Cam={on:false,raf:0,stream:null,lm:null,lmMode:null,
  mode:(localStorage.getItem(CAM_MODE_KEY)==='head'?'head':'fingers'),
  armed:true,lastFire:0,lowSince:0,move:null,prev:null,
  flash:null,frames:0,err:null,hand:false,
  cal:[],inited:false,cand:null,neutralAt:0,peak:null,
  baseYaw:0,basePitch:0,smYaw:0,smPitch:0,
  fc:null,noHandAt:0};
let FILESET=null;
const MP_LOCAL = location.protocol !== 'file:';   // file:// 直开时浏览器禁加载本地 wasm，须走本地服务
async function ensureModel(){
  const want=(Cam.mode==='head')?'head':'hand';   // 手指/滑动手势共用 HandLandmarker
  if(Cam.lm && Cam.lmMode===want) return;
  if(Cam.lm){ try{Cam.lm.close();}catch(e){} Cam.lm=null; Cam.lmMode=null; }
  if(!MP_LOCAL){ toast('摄像头需从本地服务打开：双击「启动判决台.bat」'); throw new Error('file protocol'); }
  // 2026-10-10 全本地化：wasm 与模型都在 _vendor/mediapipe/，不再走 jsdelivr / googleapis
  const v=await import('/_vendor/mediapipe/vision_bundle.mjs');
  if(!FILESET) FILESET=await v.FilesetResolver.forVisionTasks('/_vendor/mediapipe');
  if(want==='hand'){
    Cam.lm=await v.HandLandmarker.createFromOptions(FILESET,{
      baseOptions:{modelAssetPath:'/_vendor/mediapipe/hand_landmarker.task'},
      runningMode:'VIDEO',numHands:1});
  }else{
    Cam.lm=await v.FaceLandmarker.createFromOptions(FILESET,{
      baseOptions:{modelAssetPath:'/_vendor/mediapipe/face_landmarker.task'},
      runningMode:'VIDEO',numFaces:1});
  }
  Cam.lmMode=want;
}

const CAM_DEV_KEY='review2::cam-device';
async function startCamStream(id){
  if(Cam.stream){ Cam.stream.getTracks().forEach(t=>t.stop()); Cam.stream=null; }
  const stream=await acquireVideo(id||null);
  Cam.stream=stream;
  const el=document.getElementById('cam-video');
  el.srcObject=stream; await el.play();
  return stream;
}
async function fillCamSelect(){
  const sel=document.getElementById('cam-select');
  let devs=[];
  try{ devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput'); }catch(e){}
  const cur=(Cam.stream && Cam.stream.getVideoTracks()[0] &&
    Cam.stream.getVideoTracks()[0].getSettings().deviceId)||'';
  const esc=t=>(''+t).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
  let h='<option value="">系统默认（通常为电脑内置）</option>';
  devs.forEach((d,i)=>{

    h+='<option value="'+esc(d.deviceId)+'"'+(d.deviceId===cur?' selected':'')+'>'+esc(lab)+'</option>';
  });
  sel.innerHTML=h; sel.disabled=false;

const RE_USB=/usb|\u5916\u7f6e|external|\u624b\u673a|phone/i;
const RE_BUILTIN=/integrated|\u5185\u7f6e|embedded|built[\s-]?in/i;
function pickCamDevice(devs, savedId){
  if(savedId && devs.some(d=>d.deviceId===savedId)) return savedId;
  const L=devs.map(d=>d.label||'');
  const hit=re=>devs.find((d,i)=>re.test(L[i]||''));
  let d=hit(RE_BUILTIN);               // 名字带 integrated/内置/embedded
  if(d) return d.deviceId;
  d=devs.find((x,i)=>!RE_USB.test(L[i]||''));  // 再选非USB/手机
  if(d) return d.deviceId;
  return devs.length ? devs[0].deviceId : null;
}
let ACQ_SEQ=0;
function gumWithTimeout(constraints,ms){
  return new Promise((resolve,reject)=>{
    const my=++ACQ_SEQ; let done=false;
    const timer=setTimeout(()=>{ if(!done){done=true;reject(new Error('\u8bbe\u5907\u8fde\u63a5\u8d85\u65f6'));} },ms);
    navigator.mediaDevices.getUserMedia(constraints).then(st=>{
      if(done){ st.getTracks().forEach(t=>t.stop()); return; }
      if(my!==ACQ_SEQ){ done=true;clearTimeout(timer); st.getTracks().forEach(t=>t.stop()); return; }
      done=true;clearTimeout(timer); resolve(st);
    },err=>{ if(!done){done=true;clearTimeout(timer);reject(err);} });
  });
}
async function listCams(){
  try{ return (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput'); }
  catch(e){ return []; }
}
const VID_OPT={width:{ideal:640},height:{ideal:480}};
async function acquireVideo(preferId){
  let lastErr=null;
  for(let round=0; round<3; round++){
    const devs=await listCams();
    const labeled=devs.filter(d=>d.label);
    const saved=preferId||localStorage.getItem(CAM_DEV_KEY)||null;
    let ids=[];
    if(saved && devs.some(d=>d.deviceId===saved)) ids=[saved];
    else if(labeled.length){
      const want=pickCamDevice(labeled,null);
      ids=labeled.filter(d=>d.deviceId===want || !RE_USB.test(d.label)).map(d=>d.deviceId);
      labeled.forEach(d=>{ if(RE_USB.test(d.label) && !ids.includes(d.deviceId)) ids.push(d.deviceId); });
    } else if(devs.length===1 && devs[0].deviceId) ids=[devs[0].deviceId];
    for(const id of ids){
      try{
        const st=await gumWithTimeout(
          {video:Object.assign({deviceId:{exact:id}},VID_OPT),audio:false},6000);
        if(!localStorage.getItem(CAM_DEV_KEY)) localStorage.setItem(CAM_DEV_KEY,id);
        return st;
      }catch(e){ lastErr=e; }
    }
    // 枚举为空（未授权）：发一次默认请求以触发授权弹窗；超时就作废，下轮枚举到设备名后改道
    try{ return await gumWithTimeout({video:VID_OPT,audio:false}, round===0?7000:4000); }
    catch(e){ lastErr=e; }
  }
  throw lastErr||new Error('\u672a\u627e\u5230\u53ef\u7528\u6444\u50cf\u5934');
}
async function switchCamDevice(id){
  const sel=document.getElementById('cam-select');
  sel.disabled=true;
  localStorage.setItem(CAM_DEV_KEY, id||'');
  try{
    await startCamStream(id||null);
    resetCamState();
    await fillCamSelect();
    setCamHint('已切换摄像头，'+(Cam.mode==='hand'?'举起手继续':'正对镜头继续'));
  }catch(err){
    localStorage.removeItem(CAM_DEV_KEY);
    try{ await startCamStream(null); await fillCamSelect(); resetCamState();
      const cur=Cam.stream.getVideoTracks()[0];
      localStorage.setItem(CAM_DEV_KEY, cur.getSettings().deviceId||'');
    }catch(e){}
    sel.disabled=false;
    toast('该摄像头无法使用（'+(err.name||err.message||'未知')+'），已切回电脑内置');
  }
}
async function toggleCam(){
  if(Cam.on){ stopCam(); return; }
  const btn=document.getElementById('btn-cam');
  btn.textContent='摄像头加载中…'; btn.disabled=true;
  try{
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia)
      throw new Error('当前浏览器不支持摄像头');
    const savedId=localStorage.getItem(CAM_DEV_KEY)||null;
    await startCamStream(savedId);
    // 保险：若实际流落在USB/手机镜头而机器上有内置，立刻改道
    {
      const devs=await listCams();
      if(devs.some(d=>d.label)){
        const cur=Cam.stream.getVideoTracks()[0].getSettings().deviceId;
        const curLab=(devs.find(d=>d.deviceId===cur)||{}).label||'';
        const want=pickCamDevice(devs,null);
        if(!savedId && RE_USB.test(curLab) && want && want!==cur){
          await startCamStream(want);
          localStorage.setItem(CAM_DEV_KEY,want);
        }
      }
    }
    await ensureModel();
    Cam.on=true;
    resetCamState();
    document.getElementById('cam-panel').classList.add('show');
    await fillCamSelect();           // 已拿到授权，此时设备名完整可见
    btn.textContent='关闭手指识别'; btn.disabled=false; btn.classList.add('on');
    toast(Cam.mode==='head'?'正对镜头校准：左偏删 · 右偏留 · 后仰撤':'举起一只手：握拳暂停 · 1指留 · 2指删 · 3指撤');
    cancelAnimationFrame(Cam.raf);
    Cam.raf=requestAnimationFrame(camLoop);
  }catch(err){
    btn.textContent='🖐 手指识别'; btn.disabled=false;
    if(Cam.stream){ Cam.stream.getTracks().forEach(t=>t.stop()); Cam.stream=null; }
    toast('摄像头不可用（'+(err.name||err.message||'未知')+'），键鼠仍可正常用');
  }
}
function stopCam(){
  Cam.on=false; ACQ_SEQ++; cancelAnimationFrame(Cam.raf);
  if(Cam.stream) Cam.stream.getTracks().forEach(t=>t.stop());
  if(Cam.lm){ try{Cam.lm.close();}catch(e){} }
  Cam.stream=null; Cam.lm=null;
  const pnl=document.getElementById('cam-panel'); if(pnl) pnl.classList.remove('show');
  const btn=document.getElementById('btn-cam');
  if(btn){ btn.textContent='🖐 手指识别'; btn.disabled=false; btn.classList.remove('on'); }
}
function resetCamState(){
  Cam.armed=true; Cam.lastFire=0; Cam.lowSince=0; Cam.move=null; Cam.prev=null;
  Cam.flash=null; Cam.frames=0; Cam.err=null; Cam.hand=false; Cam._hk=null;
  Cam.cal=[]; Cam.inited=false; Cam.cand=null; Cam.neutralAt=0; Cam.peak=null;
  Cam.baseYaw=0; Cam.basePitch=0; Cam.smYaw=0; Cam.smPitch=0;
  Cam.fc=null; Cam.noHandAt=0;
}
function camLoop(){
  if(!Cam.on) return;
  Cam.frames=(Cam.frames||0)+1;
  try{
    const video=document.getElementById('cam-video');
    if(video.readyState>=2){
      const r=Cam.lm.detectForVideo(video, performance.now());
      if(Cam.mode==='head'){
        const face=(r.faceLandmarks && r.faceLandmarks.length)?r.faceLandmarks[0]:null;
        if(face) consumeFace(face); else noFace();
      }else{
        // tasks-vision HandLandmarker 结果字段是 landmarks
        const hand=(r.landmarks && r.landmarks.length)?r.landmarks[0]:null;
        if(hand){
          Cam.hand=true; Cam.noHandAt=0;
          if(Cam.mode==='fingers') consumeHand(hand, performance.now());
          else { const q=hand[9]; feedPoint(1-q.x, q.y, performance.now()); }
        }else noHand(performance.now());
      }
    }
  }catch(e){
    Cam.err=String(e&&e.message||e);
    setCamHint('识别异常：'+Cam.err.slice(0,40));
  }
  Cam.raf=requestAnimationFrame(camLoop);
}
/* 滑动状态机（纯坐标输入，便于测试）：
   静止 → 速度超 V_START 起一条轨迹 → 低速 SETTLE_MS 毫秒或超时结算
   位移≥SWIPE_D 且主轴明确才触发；触发后停手 SETTLE_MS 毫秒即重新上膛，两次挥手间隔≥COOL_MS */
function feedPoint(x,y,now){
  const prev=Cam.prev;
  const dt=prev? Math.max(8,now-prev.lastT)/1000 : 0;
  const vx=prev? (x-prev.x)/dt : 0;
  const vy=prev? (y-prev.y)/dt : 0;
  const sp=Math.hypot(vx,vy);
  Cam.prev={x,y,lastT:now};

  let live=null, prog=0;
  if(Cam.flash && now>Cam.flash.until) Cam.flash=null;

  // 停手计时（按真实毫秒，fps 无关）
  if(sp<V_STOP) Cam.lowSince = Cam.lowSince||now;
  else Cam.lowSince=0;

  if(!Cam.armed){
    if(Cam.lowSince && now-Cam.lowSince>=SETTLE_MS){ Cam.armed=true; Cam.move=null; }
  }
  if(Cam.armed && now-Cam.lastFire>COOL_MS){
    const m=Cam.move;
    if(!m){
      if(sp>V_START) Cam.move={t0:now,x0:x,y0:y,lowSince:0};
    }else{
      const dx=x-m.x0, dy=y-m.y0, dist=Math.hypot(dx,dy);
      const adx=Math.abs(dx), ady=Math.abs(dy);
      if(adx>=ady) live= dx>0?'right':'left';
      else if(ady>0.02) live='up';
      prog=Math.min(1,dist/SWIPE_D);
      if(sp<V_STOP) m.lowSince=m.lowSince||now; else m.lowSince=0;
      const settled=m.lowSince && now-m.lowSince>=SETTLE_MS;
      const timeout=now-m.t0>TRAJ_MS;
      if(settled||timeout){
        let dir=null;
        if(dist>=SWIPE_D){
          if(adx>=ady*AXIS_R) dir=dx>0?'right':'left';
          else if(ady>=adx*AXIS_R) dir='up';
        }
        if(dir){ fireGesture(dir,now); }
        Cam.move=null; live=null; prog=0;
      }
    }
  }
  const shown=(Cam.flash&&Cam.flash.dir)||live;
  setHud(shown, Cam.flash?1:prog);
  drawHandDbg(sp, Cam.move, x, y);
  if(!Cam.flash && !Cam.move) hintOnce('seen','✋ 看到手了：左挥删 · 右挥留 · 上下挥撤');
}
function hintOnce(key,text){ if(Cam._hk!==key){ Cam._hk=key; setCamHint(text); } }
function noHand(now){
  now=now||performance.now();

  if(!Cam.noHandAt) Cam.noHandAt=now;
  if(now-Cam.noHandAt>HAND_GONE_MS) Cam.fc=null;   // 手离开够久才允许同一手势再触发
  setHud(Cam.flash?Cam.flash.dir:null, Cam.flash?1:0);
  const d=document.getElementById('cam-dbg');
  if(d) d.innerHTML='<span style="opacity:.75">没看到手 — 把手举进画面中央</span>';
  if(Cam.mode==='fingers'){
    if(!Cam.flash) hintOnce('nohand2','没看到手：举起一只手（握拳暂停 · 1指留 · 2指删 · 3指撤）');
  }else if(!Cam.flash) hintOnce('nohand','没看到手：把手举进画面（左挥删 · 右挥留 · 上下挥撤）');

function fireGesture(dir,now){
  now=now||performance.now();

  Cam.flash={dir,until:now+420};
  if(dir==='left'){ decide('drop'); setCamHint('◀ 已判删'); }
  else if(dir==='right'){ decide('keep'); setCamHint('已判留 ▶'); }
  else { back(); setCamHint('▲ 已撤销，返回上一条'); }
}
function setHud(dir,prog){

  for(const d of ['l','u','r']){
    document.getElementById('arr-'+d).classList.toggle('hot', dir===map[d]);

function drawHandDbg(sp,m,x,y){

/* ---------- 手指识别（握拳=暂停 · 1指=留 · 2指=删 · 3指=撤销） ---------- */
/* 伸展判定：指尖离腕比指中节离腕远 → 该指伸直（不数拇指，拇指姿态太飘） */
function countExtended(lm){
  const w=lm[0];
  const d=i=>Math.hypot(lm[i].x-w.x, lm[i].y-w.y);
  let n=0;
  [[8,6],[12,10],[16,14],[20,18]].forEach(p=>{ if(d(p[0])>d(p[1])*1.15) n++; });
  return n;
}
function consumeHand(lm,now){
  if(!Cam.fc) Cam.fc={count:-1,run:0,fired:false};
  const c=countExtended(lm);
  if(c===Cam.fc.count) Cam.fc.run++;
  else { Cam.fc.count=c; Cam.fc.run=1; Cam.fc.fired=false; }
  const stable=Cam.fc.run>=FING_VOTE;
  if(stable && !Cam.fc.fired && now-Cam.lastFire>FING_COOL){
    if(c===0){                                        // 握拳：暂停 / 继续（切换）
      Cam.fc.fired=true; Cam.lastFire=now;
      setPaused(!paused);
      setCamHint(paused?'⏸ 已暂停（再握拳继续）':'▶ 已继续');
    }else if(!paused && c>=1 && c<=3){
      Cam.fc.fired=true; Cam.lastFire=now;
      if(c===1){ decide('keep'); setCamHint('☝ 1 指 → 已判留'); }
      else if(c===2){ decide('drop'); setCamHint('✌ 2 指 → 已判删'); }
      else { back(); setCamHint('🤟 3 指 → 已撤销，返回上一条'); }
    }
  }
  drawFingerDbg(c);
  if(!paused && !Cam.flash) hintOnce('seen2','🖐 看到手了：握拳暂停 · 1指留 · 2指删 · 3指撤');
}
function drawFingerDbg(c){
  const el=document.getElementById('cam-dbg'); if(!el) return;
  const fc=Cam.fc||{count:-1,run:0};
  const label=['✊ 握拳（暂停/继续）','☝ 1 指（留）','✌ 2 指（删）','🤟 3 指（撤销）','🖖 4 指（不用）'][Math.min(c,4)];
  el.innerHTML=(paused?'⏸ 已暂停 · ':'🖐 ')+label
    +'<small>稳定 '+Math.min(fc.run,FING_VOTE)+'/'+FING_VOTE+'（连续一致才触发，防误判）</small>';
}
/* ---------- 头动识别 ---------- */
function median(a){ const b=a.slice().sort((x,y)=>x-y); return b[Math.floor(b.length/2)]; }
function consumeFace(p){
  const X=q=>1-q[0];                        // 镜像，与用户自身左右一致
  const eL=p[33], eR=p[263], nose=p[1], chin=p[152];
  const ex=(X(eL)+X(eR))/2, ey=(eL[1]+eR[1])/2;
  const iod=Math.abs(X(eL)-X(eR))||1e-6;
  const yawRaw=(X(nose)-ex)/iod;
  const pitchRaw=(nose[1]-ey)/((chin[1]-ey)||1e-6);  // 后仰→变小
  if(!Cam.inited){ Cam.smYaw=yawRaw; Cam.smPitch=pitchRaw; Cam.inited=true; }
  else{ Cam.smYaw=Cam.smYaw*.5+yawRaw*.5; Cam.smPitch=Cam.smPitch*.55+pitchRaw*.45; }
  if(Cam.cal.length<CALIB_N){
    Cam.cal.push([yawRaw,pitchRaw]);
    setCamHint('请正视镜头，校准…'+Math.round(100*Cam.cal.length/CALIB_N)+'%');
    setHud(null,0); drawHeadDbg(0,0,true);
    if(Cam.cal.length===CALIB_N){
      Cam.baseYaw=median(Cam.cal.map(a=>a[0]));
      Cam.basePitch=median(Cam.cal.map(a=>a[1]));
      Cam.peak={l:0,r:0,u:0};
      setCamHint('校准好啦：左偏删 · 右偏留 · 后仰撤');
    }
    return;
  }
  evalHead(Cam.smYaw-Cam.baseYaw, Cam.basePitch-Cam.smPitch);
}
function noFace(){
  Cam.cand=null; Cam.neutralAt=0;
  setHud(Cam.flash?Cam.flash.dir:null, Cam.flash?1:0);
  const d=document.getElementById('cam-dbg');
  if(d) d.innerHTML='<span style="opacity:.75">没看到脸 — 正对镜头</span>';
  if(!Cam.flash) hintOnce('noface','没看到脸：正对镜头（左偏删 · 右偏留 · 后仰撤）');
}
function evalHead(yaw,up){
  const now=performance.now();
  let dir=null;
  if(up>UP_T && Math.abs(yaw)<YAW_T*0.8) dir='up';
  else if(yaw>YAW_T) dir='right';
  else if(yaw<-YAW_T) dir='left';
  const neutral=Math.abs(yaw)<YAW_T*0.45 && up<UP_T*0.5;
  if(!Cam.armed){
    if(neutral){ if(!Cam.neutralAt) Cam.neutralAt=now;
      if(now-Cam.neutralAt>=NEUTRAL_MS){ Cam.armed=true; Cam.cand=null; } }
    else Cam.neutralAt=0;
  }
  let prog=0;
  if(Cam.armed && dir && now-Cam.lastFire>COOL_MS){
    if(Cam.cand && Cam.cand.dir===dir) prog=Math.min(1,(now-Cam.cand.t)/HOLD_MS);
    else { Cam.cand={dir,t:now}; prog=0; }
    if(prog>=1){ fireGesture(dir,now); Cam.cand=null; prog=0; }
  }else if(!dir){ Cam.cand=null; }
  if(Cam.peak){
    if(yaw<0) Cam.peak.l=Math.max(Cam.peak.l,-yaw); else Cam.peak.r=Math.max(Cam.peak.r,yaw);
    Cam.peak.u=Math.max(Cam.peak.u,up);
  }
  setHud(dir,prog);
  drawHeadDbg(yaw,up);
  if(!dir && now-Cam.lastFire>1500) hintOnce('seenface','🙂 看到脸了：左偏删 · 右偏留 · 后仰撤');
}
function drawHeadDbg(yaw,up,calib){
  const el=document.getElementById('cam-dbg'); if(!el) return;
  if(calib){ el.innerHTML='🙂 校准中 '+Cam.cal.length+'/'+CALIB_N+' 请正视'; return; }
  const f=x=>(x>=0?'+':'')+x.toFixed(3);
  const p=Cam.peak||{l:0,r:0,u:0};
  el.innerHTML='🙂 偏 '+f(yaw)+' ／ 仰 '+f(up)
    +'<small>峰值 左'+p.l.toFixed(3)+' 右'+p.r.toFixed(3)+' 仰'+p.u.toFixed(3)+'（触发线 '+YAW_T+' / '+UP_T+'）</small>';
}

/* ---------- 语音控制（Chrome Web Speech API） ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec=null, voiceOn=false, voiceLast=0, voiceRestart=null;
function parseVoice(t){
  t=(t||'').replace(/[\s。，,\.、！!？?~～]/g,'');
  if(!t) return null;
  // 最后出现者优先：一个识别窗口里可能同时残留上一条指令（"删除保留"＝先删后留，当前意图是留）。
  // 老实现按 撤销→删→留 的固定顺序判，窗口残留会让旧指令抢跑——2026-10-10 真机复现后改为比位置。
  const PATS=[['back',/撤销|撤回|退回|上一个|上一张|返回|取消|作废/],
              ['drop',/删|丢掉|丢弃|不要|去掉|去除/],
              ['keep',/留|保留|留下|收下|要了|通过/]];
  let best=null, bi=-1;
  for(const p of PATS){
    const m=t.match(p[1]);
    if(m){ const i=t.lastIndexOf(m[0]); if(i>bi){ bi=i; best=p[0]; } }
  }
  return best;
}
function vhud(show,txt,on){
  const h=document.getElementById('vhud'); if(!h) return;
  h.hidden=!show; h.classList.toggle('on',!!on);
  if(txt!=null) document.getElementById('vhud-txt').textContent=txt;
}
/* ---------- 语音控制：双引擎 ----------
   本地引擎（优先）：浏览器采麦克风 PCM → POST 本地服务 /asr/transcribe → sherpa 小模型
     识别全在本机，零网络延迟。只在“启动判决台.bat”起的服务下可用。
   浏览器引擎（兜底）：Chrome Web Speech API，走 Google 服务端，国内慢/抽风。
   两个引擎共用 parseVoice 与相同的开火守卫。 */
let VOICE_ENGINE=null;   // 'local' | 'web'
const LOCAL={ctx:null,src:null,proc:null,mute:null,stream:null,
  ring:new Int16Array(16000*2),w:0,filled:0,timer:0,consumed:0};

function voiceFire(v,from){
  const now=performance.now(); if(now-voiceLast<500) return;
  const o=document.getElementById('ov'); if(o && !o.hidden) return;
  voiceLast=now;
  vhud(true,'执行 · '+(v==='keep'?'保留':v==='drop'?'删除':'撤销')+'（'+from+'）',true);
  if(v==='back') back(); else if(pos<N) decide(v);
}
async function probeLocal(){
  try{
    const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),1500);
    const r=await fetch('/asr/ping',{signal:ctrl.signal}); clearTimeout(t);
    if(!r.ok) return false;
    const j=await r.json(); return !!j.ok;
  }catch(e){ return false; }
}
/* —— 本地引擎 —— */
let LOCAL_SIG='';        // 兼容旧字段（不再使用）
let LOCAL_SILENT=0;      // 连续空文本轮数（诊断麦克风/自动播放）
let LOCAL_LASTCMD=null;  // 窗口里“最后一条指令”→只有它变化才开火（一句话一次，连说不漏）
async function localStart(){
  const stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true}});
  LOCAL.stream=stream;
  const ctx=new (window.AudioContext||window.webkitAudioContext)({sampleRate:16000});
  LOCAL.ctx=ctx;
  if(ctx.state==='suspended'){ try{ await ctx.resume(); }catch(e){} }   // 自动播放策略兜底
  LOCAL.src=ctx.createMediaStreamSource(stream);
  LOCAL.proc=ctx.createScriptProcessor(4096,1,1);
  LOCAL.mute=ctx.createGain(); LOCAL.mute.gain.value=0;   // 拉数据但不外放（防回声）
  const ring=LOCAL.ring;
  LOCAL.proc.onaudioprocess=e=>{
    const inp=e.inputBuffer.getChannelData(0);
    for(let i=0;i<inp.length;i++){
      const v=inp[i]<-1?-1:(inp[i]>1?1:inp[i]);
      ring[LOCAL.w]=v*32767; LOCAL.w=(LOCAL.w+1)%ring.length;
      if(LOCAL.filled<ring.length) LOCAL.filled++;
    }
  };
  LOCAL.src.connect(LOCAL.proc); LOCAL.proc.connect(LOCAL.mute); LOCAL.mute.connect(ctx.destination);
  LOCAL.consumed=0; LOCAL_SIG=''; LOCAL_SILENT=0; LOCAL_LASTCMD=null;
  LOCAL.timer=setInterval(localPoll,450);
  vhud(true,'本地语音待命…正在听（sherpa 本机识别）',false);
}
async function localPoll(){
  const n=LOCAL.filled; if(n<16000*0.6) return;                 // 至少攒 0.6s
  const ring=LOCAL.ring,w=LOCAL.w,buf=new Int16Array(n);
  for(let i=0;i<n;i++) buf[i]=ring[(w-n+i+ring.length*2)%ring.length];
  try{
    const r=await fetch('/asr/transcribe',{method:'POST',body:buf.buffer,headers:{'Content-Type':'application/octet-stream'}});
    const j=await r.json();
    if(j.err){ vhud(true,'本地识别出错：'+String(j.err).slice(0,30),false); return; }
    const t=(j.text||'').replace(/\s+/g,'');
    if(!t){ LOCAL_SILENT++; if(LOCAL_SILENT===12) vhud(true,'本地待命中…没听到声音（检查麦克风）',false); return; }
    LOCAL_SILENT=0;
    // 2026-10-10 修（真机复现）：去重不能按文本长度/内容——滑动窗口会让同一句话
    // 溅射出不同文本（“删除保留”→残留“删除保留”→滑成“保留”），按内容比对各触发一次。
    // 改为跟踪“窗口里最后一条指令”：它不变不开火，它变了才开火；窗口里没指令时清零。
    // 效果：说一句判一次；快速连说“删删删留”也一条不落。
    const v=parseVoice(t);
    if(v && v!==LOCAL_LASTCMD){ LOCAL_LASTCMD=v; voiceFire(v,'本地'); }
    else{ if(!v) LOCAL_LASTCMD=null; vhud(true,'本地听到「'+t.slice(-10)+'」',true); }
  }catch(e){ /* 一次抖动不管，下轮再来 */ }
}
function localStop(){
  clearInterval(LOCAL.timer); LOCAL.timer=0;
  try{ LOCAL.proc&&LOCAL.proc.disconnect(); LOCAL.src&&LOCAL.src.disconnect();
       LOCAL.mute&&LOCAL.mute.disconnect(); LOCAL.ctx&&LOCAL.ctx.close(); }catch(e){}
  if(LOCAL.stream){ LOCAL.stream.getTracks().forEach(t=>t.stop()); LOCAL.stream=null; }
  LOCAL.filled=0; LOCAL.w=0;
}
/* —— 统一开关：优先本地，探不到再回落浏览器引擎 —— */
async function voiceStart(){
  if(voiceOn) return;
  if(await probeLocal()){
    VOICE_ENGINE='local';
    voiceOn=true; localStorage.setItem('review2::voice','local');
    try{ await localStart(); }
    catch(e){ toast('麦克风打开失败：'+String(e.message||e).slice(0,60)); voiceOn=false; localStop(); return; }
    const btn=document.getElementById('btn-voice'); if(btn) btn.classList.add('on');
    toast('语音已开启 · 本机识别（说「保留/删除/撤销」）');
    return;
  }
  if(!SR){ toast('本地语音服务未启动，且此浏览器不支持网页语音（建议 Chrome）'); return; }
  VOICE_ENGINE='web';
  voiceOn=true; localStorage.setItem('review2::voice','web');
  buildRec();
  try{ rec.start(); }catch(e){}
  const btn=document.getElementById('btn-voice'); if(btn){ btn.classList.add('on'); }
  vhud(true,'网页语音待命…正在听（走 Google，国内可能不稳）',false);
  toast('语音已开启 · 网页识别（本地服务未启动；启动判决台.bat 可切换本机识别）');
}
function voiceStop(){
  voiceOn=false; localStorage.removeItem('review2::voice');
  localStop();
  clearTimeout(voiceRestart);
  if(rec){ try{ rec.stop(); }catch(e){} }
  const btn=document.getElementById('btn-voice'); if(btn){ btn.classList.remove('on'); }
  vhud(false);
  toast('语音已关闭');
}
function voiceToggle(){ voiceOn?voiceStop():voiceStart(); }
document.getElementById('btn-voice').onclick=voiceToggle;
/* —— 浏览器引擎（兜底）：Chrome Web Speech API，走 Google 服务端 —— */
function buildRec(){
  rec=new SR();
  rec.lang='zh-CN'; rec.continuous=true;
  // 2026-10-10 提速：开中间结果＋指令早发——说完“删”的瞬间开火，不等引擎结案；
  // consumed 记录已消费的识别文本长度，防止同一句在 interim/final 各触发一次。
  rec.interimResults=true; rec.maxAlternatives=1;
  let WEB_LASTCMD=null;   // 同本地引擎：最后一条指令变化才开火
  rec.onresult=e=>{
    let fin='', interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      if(e.results[i].isFinal) fin+=e.results[i][0].transcript;
      else interim+=e.results[i][0].transcript;
    }
    const buf=(fin+interim);
    const v=parseVoice(buf);
    if(v && v!==WEB_LASTCMD){ WEB_LASTCMD=v; voiceFire(v,'网页'); }
    else{ if(!v) WEB_LASTCMD=null; vhud(true,'听到「'+buf.trim().slice(-10)+'」',true); }
  };
  rec.onerror=e=>{
    const m=e.error;
    if(m==='no-speech'||m==='aborted') return;
    if(m==='not-allowed'||m==='service-not-allowed'){ toast('麦克风未授权，语音已关'); voiceStop(); return; }
    if(m==='network'){ toast('语音服务连不上（国内网络常被墙）—可继续用键鼠'); }
    else toast('语音出错：'+m);
  };
  // 断句重连提速：400ms→220ms（国内网络下 onend 频繁，重连越快断档感越小）
  rec.onend=()=>{ if(voiceOn){ WEB_LASTCMD=null; voiceRestart=setTimeout(()=>{ try{rec.start();}catch(e){} },220); } };
}

/* ---------- 昼夜主题切换（默认跟随系统，手动一次后记住选择） ---------- */
(function(){
  var K='review2::theme', b=document.getElementById('btn-theme');
  var paint=function(){ if(b) b.textContent = document.documentElement.dataset.theme==='light' ? '☀︎ 白天' : '☾ 夜间'; };
  if(b) b.onclick=function(){
    var next = document.documentElement.dataset.theme==='light' ? 'dark' : 'light';
    document.documentElement.dataset.theme=next;
    try{ localStorage.setItem(K,next); }catch(e){}
    paint();
  };
  paint();
})();

updateModeUI();
render();
</script>
