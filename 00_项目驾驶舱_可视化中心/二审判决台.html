<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>二审判决台 · calib50</title>
<style>
/* ============================================================
   二审判决台 · 样式表（2026-10-10 重设计）
   设计目标：昼夜双主题 / 易读排版 / 简约 / 轻交互 / 代码整洁
   结构：① 令牌 ② 基础骨架 ③ 页头 ④ 卡片 ⑤ 建议条 ⑥ 总结
        ⑦ 全文 ⑧ 盖章与飞离 ⑨ 底座与键位 ⑩ 总览 ⑪ 浮层与完成页
        ⑫ 摄像头 / 语音 / 暂停
   约定：颜色/圆角/阴影/动效一律走令牌，组件块内不写死颜色；
        JS 依赖的类名一个不改（swipe-card、card-v 系列、verdict 与 v- 系列、
        s- 系列、oval、ov- 系列）。注意：注释文字里严禁出现星斜杠相邻序列。
   ============================================================ */

/* ① 令牌 ——— 暗色为默认（无 JS 时也成立）；亮色由 data-theme 覆盖 */
:root{
  /* 面色 */
  --bg:#0f1013;          --card:#16171c;       --card-2:#1c1d24;
  --ink:#ececee;         --ink-2:#a6a7b0;      --ink-3:#75767f;
  --hair:rgba(255,255,255,.08);   --hair-2:rgba(255,255,255,.15);
  --tag-bg:rgba(255,255,255,.055);
  /* 判定色（ verdict 实心块：低饱和底 + 高饱和块，白字） */
  --keep:#33b98b;  --keep-deep:#0d7a56;  --keep-soft:rgba(51,185,139,.12);
  --drop:#d6475f;  --drop-deep:#8f2334;  --drop-soft:rgba(214,71,95,.12);
  --amber:#c8963a; --amber-soft:rgba(200,150,58,.12);
  --keep-solid:#14996a; --drop-solid:#bd2d45; --amber-solid:#a3741a;
  /* 纸墨撞色：摘要区＝暖纸块（暗色下与炭灰卡面对撞），金线＝高级感勾边 */
  --paper:#f1ece0; --paper-ink:#23252b; --paper-ink-2:#5a5d66; --paper-hair:rgba(35,37,43,.16);
  --gold:#c6a25e;
  /* 形状与材质 */
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --shadow:0 24px 60px -26px rgba(0,0,0,.6);
  --kbd-bg:#23252c;
  /* 字体 */
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei","Segoe UI",sans-serif;
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STZhongsong",Georgia,serif;
  --mono:ui-monospace,"Cascadia Code",Consolas,monospace;
  /* 动效 */
  --ease:cubic-bezier(.32,.72,0,1);
  --dur:160ms;
}
:root[data-theme="light"]{
  --bg:#f4f3f0;          --card:#ffffff;       --card-2:#faf9f7;
  --ink:#26282d;         --ink-2:#61656d;      --ink-3:#8e9198;
  --hair:rgba(22,24,30,.10);        --hair-2:rgba(22,24,30,.18);
  --tag-bg:rgba(22,24,30,.05);
  --keep:#0e8f62;  --keep-deep:#0a6b4a;  --keep-soft:rgba(14,143,98,.09);
  --drop:#bf3448;  --drop-deep:#8f2334;  --drop-soft:rgba(191,52,72,.08);
  --amber:#96690f; --amber-soft:rgba(150,105,15,.10);
  --keep-solid:#0b7a54; --drop-solid:#a82638; --amber-solid:#7e5a0d;
  --paper:#fdfbf4; --paper-ink:#26282d; --paper-ink-2:#63676f; --paper-hair:rgba(38,40,45,.16);
  --gold:#b8945a;
  --shadow:0 20px 48px -26px rgba(28,30,38,.28);
  --kbd-bg:#ffffff;
}

/* ② 基础骨架 */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
html{background:var(--bg)}
body{margin:0;color:var(--ink);overscroll-behavior:none;
  font:17px/1.75 var(--sans);background:var(--bg);
  display:flex;flex-direction:row;min-height:100vh;
  transition:background var(--dur),color var(--dur)}
button{font:inherit;color:var(--ink);cursor:pointer;border:none;background:none}

/* ③ 页头 */
header{flex:0 0 auto;padding:16px 0 8px}
.wrap{max-width:880px;width:100%;margin:0 auto;padding:0 20px}
.row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-family:var(--serif);font-size:19px;margin:0;font-weight:900;letter-spacing:.5px;
  display:flex;align-items:center;gap:9px;white-space:nowrap}
h1::before{content:"";width:9px;height:9px;border-radius:50%;flex:0 0 auto;background:var(--drop)}
.demotag{background:var(--drop-soft);color:var(--drop);border:1px solid var(--hair-2);
  font-size:11px;font-weight:800;letter-spacing:.12em;padding:2.5px 10px;border-radius:999px;white-space:nowrap}
.spacer{flex:1}
.counts{font-size:13.5px;color:var(--ink-2);display:flex;gap:14px;white-space:nowrap;align-items:baseline}
.counts b{font-family:var(--mono);font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.c-keep{color:var(--keep)} .c-drop{color:var(--drop)}
.progress{height:6px;border-radius:999px;overflow:hidden;display:flex;background:var(--tag-bg);margin:12px 0 0}
.progress i{display:block;height:100%;transition:width .45s var(--ease)}
.p-keep{background:var(--keep)} .p-drop{background:var(--drop)} .p-pending{background:var(--tag-bg)}
/* 左侧竖向功能区 */
.side{flex:0 0 auto;width:84px;padding:14px 10px;display:flex;flex-direction:column;
  border-right:1px solid var(--hair);background:var(--bg)}
.col{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0}
.menu{display:flex;flex-direction:column;gap:9px;align-items:stretch;height:100%;margin:0}
.menu button{font-size:12.5px;font-weight:600;padding:9px 4px;border-radius:var(--r-sm);
  width:100%;line-height:1.3;text-align:centerpx;
  border:1px solid var(--hair);background:var(--tag-bg);color:var(--ink-2);
  transition:color var(--dur),border-color var(--dur),background var(--dur)}
.menu button:hover{color:var(--ink);border-color:var(--hair-2)}
.menu button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.menu button.primary{background:var(--drop);border-color:var(--drop);color:#fff;font-weight:700}
.menu button.primary:hover{background:var(--drop-deep)}
.demoline{margin-top:10px;font-size:12.5px;line-height:1.6;color:var(--drop);background:var(--drop-soft);
  border:1px solid var(--hair-2);border-left:3px solid var(--drop);border-radius:var(--r-sm);
  padding:8px 12px;display:none}
body.demo .demoline{display:block}

/* ④ 卡片 */
main{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;padding:12px 20px 4px}
.stage{flex:1 1 auto;position:relative;display:flex;align-items:stretch;justify-content:center;min-height:0;padding:0}
.swipe-card{position:relative;height:100%;width:min(1020px,100%);aspect-ratio:auto;max-width:100%;margin:auto;
  overflow:hidden;background:var(--card);border:1px solid var(--hair);border-radius:var(--r-lg);
  touch-action:none;cursor:grab;box-shadow:var(--shadow);
  display:flex;flex-direction:column;color:var(--ink);
  transition:background var(--dur)}
.swipe-card.grabbing{cursor:grabbing}
.swipe-card.enter{animation:cardIn .34s cubic-bezier(.22,1.1,.32,1)}
.swipe-card.back{animation:cardBack .3s var(--ease)}
@keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
@keyframes cardBack{from{opacity:.35;transform:translateY(-12px) scale(.98)}to{opacity:1;transform:none}}
.swipe-card.fly-drop{transition:transform .3s cubic-bezier(.5,0,.8,.4),opacity .3s;transform:translateX(-135%) rotate(-14deg);opacity:0}
.swipe-card.fly-keep{transition:transform .3s cubic-bezier(.5,0,.8,.4),opacity .3s;transform:translateX(135%) rotate(14deg);opacity:0}
/* 元信息行 = 身份条：居中排布（对称构图的上沿），细分隔线，标题加重 */
.meta{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:9px;padding:15px 24px 11px;
  font-size:13px;color:var(--ink-3);border-bottom:1px solid var(--hair)}
.meta .idx{font-weight:700;color:var(--ink-2);font-family:var(--mono);font-size:12.5px}
.meta .cat{background:var(--tag-bg);border:1px solid var(--hair);border-radius:999px;
  padding:2px 10px;font-weight:600;color:var(--ink-2)}
.meta .title{flex:0 1 auto;min-width:0;font-size:15.5px;font-weight:700;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta .now{font-size:12px;font-weight:700;padding:2.5px 11px;border-radius:999px;color:#fff;display:none}
.card-v-keep .meta .now{display:block;background:var(--keep-deep)}
.card-v-drop .meta .now{display:block;background:var(--drop-deep)}

/* ⑤ 一审建议条 = 通栏实心色块 · 居中印章构图（对称美学主焦点）
   纸墨逻辑：色块取判定实色、白字；上下用金线勾边，块内元素全部居中对齐 */
.verdict{flex:0 0 auto;position:relative;margin:0;padding:20px 24px 18px;
  display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;
  border-top:1px solid var(--gold);border-bottom:1px solid var(--gold)}
.verdict::after{content:"一审预判";position:absolute;top:10px;right:16px;
  font-size:10px;font-weight:700;letter-spacing:.22em;color:rgba(255,255,255,.55)}
.verdict .v-ico{width:50px;height:50px;border-radius:12px;display:flex;
  align-items:center;justify-content:center;font-size:24px;font-weight:900;color:#fff;
  font-family:var(--serif);background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.4)}
.verdict .v-main{min-width:0}
.verdict .v-label{font-family:var(--serif);font-size:32px;font-weight:900;letter-spacing:7px;line-height:1.25;color:#fff}
.verdict .v-label small{font-family:var(--sans);font-size:11px;font-weight:800;letter-spacing:.14em;
  margin-left:12px;vertical-align:3px;opacity:.8;border:1px solid rgba(255,255,255,.55);
  border-radius:999px;padding:1.5px 8px;color:#fff}
.verdict .v-reason{margin:2px auto 0;max-width:58ch;font-size:16.5px;line-height:1.75;color:rgba(255,255,255,.88)}
.verdict.v-keep{background:var(--keep-solid)}
.verdict.v-drop{background:var(--drop-solid)}
.verdict.v-dispute{background:var(--amber-solid)}

/* ⑥ 笔记总结 = 暖纸块：与上下色面对撞，金线勾边＋纸纹（质感来源） */
.summary{flex:1 1 auto;min-height:0;overflow:auto;margin:16px;padding:16px 20px 18px;
  background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-hair);
  border-radius:var(--r-md);box-shadow:0 0 0 1px var(--gold),0 10px 24px -14px rgba(0,0,0,.35);
  scrollbar-width:thin}
.summary::before{content:"摘 要";display:block;text-align:center;font-size:10.5px;font-weight:800;
  letter-spacing:.5em;color:var(--paper-ink-2);margin-bottom:10px;text-indent:.5em}
.s-row{display:flex;gap:13px;align-items:flex-start;font-size:17px;line-height:1.9;color:var(--paper-ink)}
.s-row+.s-row{margin-top:11px;padding-top:11px;border-top:1px solid var(--paper-hair)}
.s-tag{flex:0 0 78px;text-align:center;font-size:12.5px;font-weight:700;color:var(--paper-ink-2);
  background:transparent;border:1px solid var(--paper-hair);border-radius:999px;
  padding:3px 8px;margin-top:3px;letter-spacing:.05em}
.s-row .s-txt{min-width:0;flex:1}
/* 关键细节 / 坑 / 原文一句（纸面内次级层次：题居中等宽金点） */
.d-hd{margin:16px 0 7px;font-size:12px;font-weight:800;letter-spacing:.3em;color:var(--paper-ink-2);text-align:center;text-indent:.3em}
.d-list{margin:0;padding-left:20px}
.d-list li{font-size:16.5px;line-height:1.75;color:var(--paper-ink);margin:0 0 6px}
.d-list li::marker{color:var(--gold)}
.s-tag.cost{color:var(--drop-solid);background:transparent;border-color:var(--drop-solid)}
.cost-txt{color:var(--drop-solid)}
.quote{margin:14px 0 0;padding:11px 15px;border-left:3px solid var(--gold);background:rgba(198,162,94,.14);
  border-radius:0 var(--r-sm) var(--r-sm) 0;font-family:var(--serif);font-size:16.5px;line-height:1.8;color:var(--paper-ink)}
.quote small{display:block;margin-top:5px;font-family:var(--sans);font-size:11px;letter-spacing:.1em;
  color:var(--paper-ink-2)}

/* ⑦ 全文备查 = 墨匣：深色面收底，与纸面对抗；题居中等宽 */
details.ft{flex:0 0 auto;margin:0 16px 16px;border:1px solid var(--hair-2);border-radius:var(--r-md);
  overflow:hidden;background:var(--card-2)}
details.ft summary{cursor:pointer;padding:10px 16px;font-size:12.5px;color:var(--ink-2);
  font-weight:600;user-select:none;touch-action:auto;transition:color var(--dur);
  letter-spacing:.3em;text-align:center;text-indent:.3em}
details.ft summary:hover{color:var(--ink)}
details.ft summary::marker{color:var(--ink-3)}
.fulltext{margin:0;padding:14px 18px;max-height:30vh;overflow:auto;font-size:15.5px;line-height:1.9;
  white-space:pre-wrap;border-top:1px solid var(--hair);touch-action:auto;color:var(--ink-2);
  scrollbar-width:thin}

/* ⑧ 盖章与飞离 */
.stamp{position:absolute;top:36%;font-family:var(--serif);font-size:38px;font-weight:900;letter-spacing:8px;
  padding:2px 16px;border-radius:var(--r-md);opacity:0;pointer-events:none;z-index:5;
  background:var(--card);box-shadow:var(--shadow)}
.stamp.drop{right:26px;color:var(--drop);transform:rotate(12deg);border:3px solid var(--drop)}
.stamp.keep{left:26px;color:var(--keep);transform:rotate(-12deg);border:3px solid var(--keep)}

/* ⑨ 底座与键位 */
/* 底栏按他 2026-10-10 要求隐藏（判定走键盘/语音/手势/左右滑） */
.dock{display:none}
.oval{width:82px;height:82px;border-radius:50%;font-size:32px;font-weight:800;color:#fff;
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);
  transition:transform var(--dur) var(--ease),box-shadow var(--dur),opacity var(--dur)}
.oval:hover{transform:translateY(-2px)}
.oval:active{transform:scale(.92);transition-duration:80ms}
.oval.drop{background:var(--drop);box-shadow:0 12px 28px -12px color-mix(in srgb,var(--drop) 70%,transparent)}
.oval.keep{background:var(--keep);box-shadow:0 12px 28px -12px color-mix(in srgb,var(--keep) 70%,transparent)}
.oval.drop:hover{background:var(--drop-deep)}
.oval.keep:hover{background:var(--keep-deep)}
.oval.back{width:62px;height:62px;font-size:22px;color:var(--ink-2);
  background:var(--card);border:1.5px solid var(--hair-2)}
.oval.back:hover{color:var(--ink)}
.oval.back.armed{color:var(--drop);border-color:var(--drop);background:var(--drop-soft)}
/* 键位说明条一并隐藏（他说“说明按钮隐藏”） */
.keybar{display:none}
.keybar .kb{display:inline-flex;align-items:center;gap:6px;font-weight:600;color:var(--ink-2)}
.keybar kbd{font:13.5px/1 ui-monospace,Consolas,monospace;min-width:25px;height:25px;display:inline-flex;
  align-items:center;justify-content:center;padding:0 7px;border-radius:7px;background:var(--kbd-bg);
  border:1px solid var(--hair-2);border-bottom-width:2.5px;color:var(--ink)}
.keybar kbd.k-drop{color:#fff;background:var(--drop);border-color:var(--drop-deep)}
.keybar kbd.k-keep{color:#fff;background:var(--keep);border-color:var(--keep-deep)}
.keybar .kb-sep{width:1px;height:18px;background:var(--hair-2)}
.keybar .kb-tip{color:var(--ink-3);font-size:12px}

/* ⑩ 总览浮层 */
.ov{position:fixed;inset:0;z-index:80;background:rgba(10,10,14,.55);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:24px}
.ov[hidden]{display:none}
.ov-panel{width:min(720px,94vw);max-height:82vh;display:flex;flex-direction:column;background:var(--card);
  border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--hair)}
.ov-head{display:flex;align-items:center;gap:12px;padding:13px 18px;border-bottom:1px solid var(--hair)}
.ov-head b{font-family:var(--serif);font-size:16px;letter-spacing:.5px}
.ov-filters{display:flex;gap:6px;margin-left:auto}
.ov-filters button{font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid var(--hair);
  background:var(--tag-bg);color:var(--ink-2);font-weight:600}
.ov-filters button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ov-x{font-size:12.5px;padding:5px 14px;border-radius:999px;border:1px solid var(--hair);
  background:var(--tag-bg);color:var(--ink-2)}
.ov-list{overflow:auto;padding:6px;scrollbar-width:thin}
.ov-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;
  border-radius:var(--r-sm);color:var(--ink);font-size:13.5px}
.ov-row:hover{background:var(--tag-bg)}
.ov-row.cur{background:var(--amber-soft);box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--amber) 45%,transparent)}
.ov-idx{flex:0 0 auto;font:11px/1 var(--mono);color:var(--ink-3);min-width:36px}
.ov-badge{flex:0 0 auto;font-size:11px;font-weight:800;padding:2.5px 9px;border-radius:999px;color:#fff}
.ov-badge.keep{background:var(--keep-deep)} .ov-badge.drop{background:var(--drop-deep)} .ov-badge.pending{background:var(--ink-3)}
.ov-title{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.ov-empty{padding:26px;text-align:center;color:var(--ink-3);font-size:13px}

/* ⑪ 浮层与完成页 */
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(10px);opacity:0;
  background:var(--card);border:1px solid var(--hair-2);color:var(--ink);padding:9px 20px;border-radius:999px;
  font-size:13px;font-weight:600;pointer-events:none;transition:all .3s var(--ease);z-index:99;
  box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.done{display:none;width:100%;max-width:460px;margin:auto;text-align:center;
  background:var(--card);border:1px solid var(--hair);border-radius:var(--r-lg);
  box-shadow:var(--shadow);padding:44px 32px 36px}
.done.show{display:block;animation:cardIn .45s cubic-bezier(.22,1.1,.32,1)}
.done .big{font-size:48px;margin-bottom:8px}
.done h2{font-family:var(--serif);margin:0 0 8px;font-size:23px;font-weight:900;letter-spacing:1px}
.done p{color:var(--ink-2);font-size:14.5px;line-height:1.8;margin:0 0 22px}
.done .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.done button{font-size:14px;padding:10px 22px;border-radius:999px;border:1px solid var(--hair-2);
  background:var(--tag-bg);color:var(--ink);font-weight:600}
.done button.primary{background:var(--drop);border-color:var(--drop);color:#fff}

/* ⑫ 摄像头 / 语音 / 暂停 */
.vhud{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;align-items:center;gap:8px;
  background:var(--card);border:1px solid var(--hair-2);color:var(--ink);padding:9px 15px;border-radius:999px;
  font-size:13px;font-weight:600;box-shadow:var(--shadow);max-width:min(360px,60vw)}
.vhud[hidden]{display:none}
.vhud .dot{width:9px;height:9px;border-radius:50%;background:var(--drop);flex:0 0 auto;animation:vpulse 1.2s infinite}
.vhud.on .dot{background:var(--keep)}
@keyframes vpulse{0%,100%{opacity:1}50%{opacity:.3}}
.cam-panel{position:fixed;right:16px;bottom:64px;width:180px;z-index:60;display:none}
.cam-panel.show{display:block;animation:cardIn .25s ease}
.cam-resize{position:absolute;left:-7px;top:-7px;width:20px;height:20px;z-index:6;cursor:nwse-resize;
  border-radius:50%;background:var(--ink);border:2px solid var(--bg);box-shadow:0 3px 8px rgba(0,0,0,.4);touch-action:none}
.cam-resize::after{content:"";position:absolute;left:4px;top:4px;width:8px;height:8px;
  border-left:2.5px solid var(--bg);border-top:2.5px solid var(--bg);border-radius:2px 0 0 0}
.cam-box{position:relative;border-radius:var(--r-md);overflow:hidden;border:2px solid var(--hair-2);
  background:#0e0e14;box-shadow:var(--shadow)}

​​\n​​作者总花费​​：为了熟成这些牛肉，前后花了 ​​2231 元​​\n作者建议：如果只是想尝尝这个味道，直接买现成的熟成牛排更省事；但作为美食博主，用 37 天体验 4 块生肉变成汉堡的完整过程，这些经验和答案不亏。\n三、核心知识点\n​​干式熟成原理​​：严格控温环境下，肉表面水分缓慢蒸发，肉本身的酶分解肌肉纤维蛋白，达到去水增香、化硬为嫩的效果。\n​​干式熟成损耗​​：外壳干硬发腥、有杂菌附着，必须全部切除。8 斤牛肉切完只剩 4 斤不到，损耗率约 50%。\n​​布里欧修面包发酵​​：牛奶提前冰冻搅打可降低面温、保持酵母活性；​​冰箱隔夜发酵​​是关键，能让面团充分膨胀。\n​​酱汁风味还原​​：原版不仅呛辣，还有明显鲜味，用墨鱼汁调色、小米辣提辣、紫梨汤提鲜，才能还原层次。\n​​作者小贴士​​：干式熟成肉块必须够大、过厚，中心部分才能完成风味转化；不能用太小的肉块。\n四、视频中出现的提示词/操作文字\n\n视频中未出现 AI 提示词、搜索词或软件指令类文字。\n\n五、实用信息清单\n​​材料清单​​：\n4 个不同部位的熟成牛肉（共 8 斤）\n布里欧修面包（干酵母/鲜酵母、牛奶、白糖、面粉等）\n酱汁：柬埔寨贡布胡椒、黑芝麻、墨鱼汁、小米辣、紫梨汤\n古老也干酪碎、布里奶酪厚片\n​​成本明细​​：\n4 块熟成牛肉：1668 元\n单个汉堡食材成本：98 元\n作者总花费（含设备）：2231 元\n​​时间线​​：\n牛肉熟成：30 天\n面包发酵与烘烤：4 天\n总耗时：37 天\n​​工具​​：\n熟成柜（或冰箱 + 束身带平替）\n真空封口机（敞开式）\n冰箱（用于隔夜发酵）\n六、一句话总结最值得收藏的点\n\n作者用 37 天完整复刻了 688 元的上海最贵汉堡，最终揭晓单个食材成本仅 98 元，并分享了干式熟成、布里欧修面包隔夜发酵、酱汁风味还原等核心技巧。\n\n笔记中提到作者整理了完整食谱，但具体配方比例未在视频中完整列出。如果你需要在家复刻，建议关注作者后续发布的详细食谱内容。"}, {"idx": 2, "id": "6a615436000000000f030126", "title": "INTJ 狂喜！任何领域都能自学入门了", "cat": "新产", "sug": "keep", "reason": "保留判据3：'搭框架→逐课生成→交互课件'工作流可直接迁移到其心理健康课课件制作，是其教师+AI 双重身份最强结合点", "what": "用 REDSkill 的 interactive course skill 让 AI 生成互动 HTML 课件自学任意领域", "use": "工作流：告诉 AI 主题/受众/水平/课数 → 先出课程大纲确认调整 → 逐课生成 HTML 课件（含交互动画、视频跳转、选择题测验、代码练习）→ 浏览器打开本地学习，支持划线笔记和一键复制追问；获取方式：小红书笔记下方 RedSkill 组件复制安装口令粘给 Codex/Claude 安装", "next": "", "detail": "", "cost": "RedSkill 为小红书内嵌平台，部分账号看不到组件入口；生成大量课件消耗 token；排版 bug 需截图让 AI 修", "quote": "", "quote_src": "", "text": "# v3-分区版 v3（回溯）\n# INTJ 狂喜！任何领域都能自学入门了\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6a615436000000000f030126?xsec_token=AB_dc6OI8WD72Y2GoggTTGMvZwE7R70zE81kQbsbBPXqU=&xsec_source=pc_user\n\n根据你引用的笔记，以下是这条笔记的深度拆解：\n\n一、素材与想法\n​​素材来源​​：笔记作者使用 REDSkill 平台上的 ​​interactive course​​ skill，配合 Claude 模型（推荐 4.6 及以上版本）生成互动式 HTML 课件。课件内容涵盖大模型训练、足球规则、浪漫主义古典音乐等多个领域。\n​​核心想法​​：作者作为 INTJ，对\"搭框架\"有执念，希望有一套系统化的方式学习陌生领域。传统 PPT 或文档不够互动，于是想到用 AI 生成 HTML 课件，让每个知识点以最合适的呈现方式（动画、视频、交互）讲透。\n​​新在哪​​：不是简单生成 PPT 或长文，而是生成可交互的 HTML 页面，支持点击动画、视频跳转、选择题测验、代码练习等。\n​​省在哪​​：不用手动排版、不用写代码，AI 自动拆框架、写内容、做交互。\n​​强在哪​​：课件可永久保存、随时复习；支持划线笔记、一键复制给大模型追问、在线修改内容。\n二、实现方式与技术原理\n​​从 0 到成品的步骤​​：\n​​确认需求​​：告诉 AI 想学的主题、目标受众、学习者水平、预计生成多少堂课。\n​​生成课程大纲​​：AI 先列出每节课的标题、核心概念和呈现方式，作者确认并调整（比如补充足球文化、增加课程数量）。\n​​生成课件​​：一节课一节课生成，或一次性生成全部课件。每节课包含一个 HTML 文件（课件内容）和一个可选的 .py 代码练习文件。\n​​交互与复习​​：在课件中划线、提问、修改内容，课件保存在本地，随时翻看。\n​​背后机制​​：基于 REDSkill 平台封装的 skill，调用大模型（如 Claude 4.6）进行内容生成和代码编写，输出为 HTML + JavaScript 的互动页面。\n​​最有技术含量的一步​​：AI 根据知识点自动选择\"最合适的呈现方式\"——比如用交互式动画演示 BPE 分词算法，用视频播放器跳转到特定时间点播放音乐片段，用战术板动画讲解足球越位规则。这背后是 skill 内部预设的交互模板和 AI 对内容类型的判断。\n三、AI 与工具清单\n​​REDSkill​​：小红书内的 skill 平台，作者将 interactive course skill 上传至此，用户点击笔记下方的 RedSkill 组件获取。\n​​Claude 4.6 及以上​​：推荐使用的模型，用于生成课程大纲和 HTML 课件内容。\n​​Codex​​：笔记标签中提到，可能用于安装或调用 skill。\n​​HTML + JavaScript​​：课件最终输出的格式，支持交互动画、视频播放、选择题测验等功能。\n四、项目来源与链接\n​​GitHub 地址​​：笔记评论区有人问\"为啥不放去 gh 叻\"，作者未直接回复，但笔记中未提供完整的 GitHub 仓库地址。\n​​REDSkill 获取方式​​：在小红书笔记下方点击 RedSkill 组件 → 点击\"去使用\" → 复制安装口令 → 粘贴给 AI 工具（如 Codex） → 按提示安装。\n​​是否基于开源项目​​：笔记未提及该 skill 是否基于开源项目二次创作。\n五、视频中出现的提示词/指令\n\n视频中​​未出现完整的提示词原文​​。作者口播中描述的是\"告诉 AI 想学的主题、目标受众、学习者水平、预计生成多少堂课\"，但没有逐字展示输入给 AI 的具体 prompt。\n\n六、复现指南\n​​前置条件​​：\n小红书账号（需有 RedSkill 权限，若没有可尝试通过 GitHub 路径获取）。\nAI 工具（如 Claude 4.6 及以上版本，或 Codex）。\n电脑本地浏览器（用于打开生成的 HTML 课件）。\n​​最简行动清单​​：\n在小红书搜索\"interactive course skill\"或找到原笔记，点击 RedSkill 组件获取安装口令。\n将口令粘贴给 Codex 或 Claude，按提示安装 skill。\n告诉 AI 你想学的主题（比如\"我想学足球规则\"），确认课程大纲。\n让 AI 生成课件，用浏览器打开 HTML 文件即可学习。\n​​难点与坑​​：\nRedSkill 权限可能受限，部分账号看不到组件入口。\n生成大量课件时可能需要多次调用模型，注意 token 消耗。\n如果课件出现排版错乱或交互 bug，需要把截图发给 AI 让它针对性修改。\n七、一两句话总结最该记住的关键点\n\n用 AI 生成 HTML 互动课件，比 PPT 更灵活、比文档更互动，核心是​​先让 AI 搭框架、再逐课生成、最后用浏览器打开学习​​。整个过程不需要写代码，适合任何想系统自学陌生领域的人。\n\n如果你打算复现，建议先确认自己的小红书账号是否有 RedSkill 权限，如果没有，可以试试在 GitHub 上搜索\"interactive course skill\"找开源版本。"}, {"idx": 3, "id": "6a43e3df000000000f0048b6", "title": "纯好奇 优秀的你们私底下会做什么提升自我", "cat": "学习闭环", "sug": "drop", "reason": "删除判据4（与主线无关且不属保留判据4，这些是公开显性建议不是隐性规则，判据明确鸡汤情绪价值不算）。", "what": "互动帖：优秀的人私下做什么提升自我，正文+评论区方法合集。", "use": "评论区方法：限手机 1 小时/天、年读 50 本纸质书并写读书 总结最值得收藏的点\n\n与身边人拉开差距的核心，不是靠碎片化刷手机获取信息，而是靠​​戒掉手机、忍受孤独、深度阅读、持续复盘和专注自我​​，把精力用在能长期复利的事情上。\n\n补充说明：笔记本身没有提供视频画面、口播或字幕，因此以上整理完全基于正文和评论区文字。如果你需要我进一步搜索\"如何戒掉手机\"\"每年读 50 本书的方法\"等具体实操内容，可以告诉我。"}, {"idx": 4, "id": "6a38e3c9000000000702ed97", "title": "科三必背单词", "cat": "学习闭环", "sug": "keep", "reason": "保留判据2（语言学分支体系与十三种英语教学法是不随考纲微调而过时的学科底座）＋保留判据3（他在备考英语教资，属已明确要动手的方向，可直接支撑科三笔试与将来试讲）", "what": "教资笔试英语科目三的高频术语背诵资料，覆盖语言学各分支与英语教学法体系。", "use": "语言五大设计特征与七大功能、共时/历时、langue 与 parole、competence 与 performance；元音辅音按发音部位与方式分类、音位与最小对立体、互补分布；构词法全套、同义反义上下位、言语行为与合作原则三准则；十三种教学法（语法翻译、直接、听说、交际、视听、情境、全身反应、任务型、认知、社团学习、沉默、暗示、自然）；听说读写三种教学模式加过程环节、形成性评价与标准参照评价。完整 12 页背诵+12 页默写在博主置顶。", "next": "最小下一步：收藏该笔记，并去博主置顶笔记下方获取完整版电子版；复刻目标：不适用", "detail": "", "cost": "有时效（以教资考试大纲为边界）；完整版需去博主置顶笔记自取。", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 科三必背单词\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6a38e3c9000000000702ed97?xsec_token=ABMwatScE4loiMvj7poBnykJXm8WPR89Tf8UidGh97WX0=&xsec_source=pc_user\n\n根据你引用的笔记，这是一份针对​​教资笔试英语科目三​​的必背单词整理，核心覆盖语言学、语音学、语义学、语用学、修辞学及英语教学法等内容。以下是完整梳理：\n\n一、内容定位\n​​领域​​：教育类（教资笔试英语科目三）\n​​作者身份​​：备考教资的学习博主（@D(努力学习版））\n​​核心目标​​：帮助考生系统背诵英语科三高频专有名词，应对选择题中大量出现的语言学及教学法术语。\n二、内容详细讲解（按笔记模块顺序）\n\n​**​语义学 semantics、语音学 phonetics、语用学 pragmatics、音系学 phonology、形态学 morphology、句法学 syntax、心理语言学 psycho-linguistics、应用语言学 applied linguistics。\n\n​​语言的本质特征（design features of language）​​：任意性 arbitrariness、移位性 Displacement、二重性 Duality、文化的传播 Cultural transmission、创造性/能产性 Productivity。\n​​语言的主要功能（functions of language）​​：信息功能 Informative function、寒暄功能 Phatic function、人际功能 Interpersonal function、娱乐功能 Recreational function、施为功能 Performative function、元语言功能 Metalingual function、情感功能 Emotive function。\n​​核心概念对比​​：规定性&描述性（prescriptive & descriptive）、共时性和历史性（Synchronic & Diachronic）、语言和言语（Langue & Parole）、语言能力和表现（competence & performance）。\n\n​​2. 语音学（Phonetics）​​\n\n​​元音分类​​：单元音 Pure vowel/monophthong、双元音 diphthong。按舌头位置分前元音 front vowel、中(央)元音 central vowel、后元音 back vowel；按舌头抬起高度分高元音 high vowel、半高/半低元音 middle vowel、低元音 low vowel；按长度和紧度分长元音 long vowel、短元音 short vowel；按唇形分圆唇音 rounded vowel、非圆唇音 unrounded vowel。\n​​辅音分类​​：按发音方式分爆破音 stops、摩擦音 fricatives、塞擦音 affricates、流音 liquids、鼻音 nasals、滑音 glides；按发音部位分双唇音 labio-dental、齿音 dental、齿龈音 alveolar、腭音 palatal、软腭音 velar、喉音 glottal；按声带振动分清辅音 voiceless consonants、浊辅音 voiced consonants。\n​​语音变化​​：连读 Liaison、失去爆破 Loss of Plosive/不完全爆破 incomplete plosive、同化 Assimilation。\n\n​​3. 音系学（Phonology）​​\n\n​​核心概念​​：音位 phoneme、最小对立体 minimal pairs、音位对立 phonemic contrast、音位变体 Allophone、互补分布 complementary distribution、自由变体 Free variation。\n​​音系规则​​：序列规则 Sequential rule、同化规则 Assimilation rule、省略规则 Deletion rule。\n​​超音段特征（Suprasegmentals）​​：音节 syllable、升调 rising tone、降调 falling tone、降升调 falling-rising tone、升降调 rising-falling tone、单词重音 word stress、句子重音 sentence stress、语调 intonation。\n\n​​4. 形态学（Morphology）​​\n\n​​词素分类​​：词素 Morpheme、前缀 prefix、后缀 suffix、自由词素 free morphemes、粘着词素 bound morphemes、屈折词素 Inflectional Morpheme、派生词素 Derivational Morpheme、词根 root、词缀 affix、屈折词缀 inflectional affix、派生词缀 derivational affix。\n​​词的形成（word formation）​​：新造词 Coinage、创新词 invention、首字母缩略 acronym、混成词 blending、逆构词法 back-formation、截断词 clipping/abbreviation、类推构词 analogical creation、首字母连写词 Initialism、借词法 borrowing/loanword。\n\n​​5. 句法学（Syntax）​​\n\n副词 adverb、名词/名词短语 noun/noun phrase、代词 pronoun、动词/动词短语 verb/verb phrase、助动词 auxiliary verb、限定词 determiner、介词短语 prepositional phrase、形容词 adjective。\n\n​​6. 语义学（Semantics）​​\n\n​​同义关系 synonymy​​：同义词 synonym（涉及文体 stylistic、情感 emotive、地域 dialectal、搭配 collocation）。\n​​反义关系 antonymy​​：反义词 antonym。\n​​上下位关系 Hyponymy​​：上位词 hypernym、下位词 Hyponym。\n​​其他关系​​：一词多义 polysemy、同音异义 homophone、同形异义 homograph、同形同音异义 complete homonym。\n\n​​7. 语用学（Pragmatics）​​\n\n​​言语行为 speech acts​​：言内行为 locutionary act、言外行为 illocutionary act、言后行为 perlocutionary act。\n​​会话含义理论 Conversational implicature​​：合作原则 cooperative principle，包含数量准则 The maxim of quantity、质量准则 The maxim of quality、关系准则 The maxim of relevance。\n\n​​8. 修辞学（Rhetoric）​​\n\n明喻 Simile、暗喻 Metaphor、转喻/换喻/借代 Metonymy、夸张 Hyperbole、用典 Allusion、委婉 Euphemism、拟人 Personification、移就 Transferred Epithet、押韵 Rhyme、头韵 Alliteration/initial rhyme/head rhyme、尾韵 End rhyme、反韵 Reverse rhyme。\n\n​​9. 英语教学法与心理学​​\n\n​​教学方法​​：语法翻译法、直接法 Direct Method、听说法 Audio-lingual Method、交际法 Communicative Language Teaching Approach、视听法 The Audio-Visual Method、情境教学法 Situational Language Teaching Method、全身反应法 Total Physical Responses、任务型教学法 Task-based language Teaching Approach、认知法 Cognitive approach、社团语言学习法 Community Language Learning、沉默法 The silent Way、暗示法 Suggestopedia、自然法 Natural Approach。\n​​心理学与教育流派​​：行为主义心理学 Behaviorism、认知心理学 Cognitivism、经典人文主义 Classical Humanism、重建主义 Restructionism。\n​​错误分析​​：省略 omission/simplification、互相关联 cross-association、过分概括 over generalization、顺序错误 misordering。\n​​语法教学​​：演绎法 deductive、启发式教学 heuristic teaching、归纳法 inductive。\n​​知识教学通用原则​​：系统性 systematic/integrated/combination、交际性 communicative。\n\n​​10. 具体技能教学模式与过程​​\n\n​​听力教学​​：自下而上 Bottom-up model、自上而下 top-down model、交互式听力教学模式 interactive model。过程：听前阶段 Pre-listening、听中阶段 While-listening（泛听 extensive listening、精听 intensive listening）、听后阶段 Post-listening。\n​​口语教学​​：原则为流畅性 fluency、准确性 accuracy。策略：释义 paraphrase、反义词 antonym、小组讨论 group work、两人对话 pair work、角色扮演 role play。\n​​阅读教学​​：自下而上模式 Bottom-up model、自上而下 top-down model、交互补偿 interactive-compensatory。过程：读前 Pre-reading、读中 While-reading（略读 skimming 和寻读 scanning）、读后 Post-reading。\n​​写作教学​​：内容导向模式 Content-oriented model、过程导向模式 Process-oriented model、结果导向模式 Product-oriented model。过程：头脑风暴 Brainstorming、思维导图 Mapping、列提纲 Outlining、写初稿 Drafting、修改（自改 Self-editing、互改 Peer editing）、订正 Revising、评价 Evaluating。练习形式：控制性写作 Controlled writing、抄写 copy、填空 fill in the blanks、完成句子 completion、句型转换 transformation。\n\n​​11. 教学实施与评价​​\n\n​​教学实施​​：引出目录 initiating move、回答目录 responding move、反馈目录 feedback or follow-up move；展示性 display questions、参阅性 referential questions、评估性 estimated questions。\n​​评价方式​​：形成性评价 formative assessment、常模参照性评价 norm-referenced test、标准参照式评价 criterion-referenced test。\n三、核心知识点\n​​核心结论​​：教资科三英语选择题中，一大半都在考语言学及教学法相关的专有名词，必须系统背诵。\n​​易错点提醒​​：笔记评论区有考生指出“短元音是 short vowel”，笔记正文中部分地方误写为“low vowel”，复习时需注意区分。\n​​备考建议​​：建议配合 12 页背诵 + 12 页默写进行巩固，真题部分单词需单独整理。\n四、视频中出现的提示词/操作文字\n\n视频中未出现具体的 AI 提示词或软件指令，主要为 OCR 识别出的单词列表和笔记正文中的话题标签。\n\n五、实用信息清单\n​​完整版资料获取​​：在博主 @D(努力学习版） 的置顶笔记下方，包含 12 页背诵 + 12 页默写。\n​​相关话题标签​​：#教资 #教资笔试 #英语教资 #教资科三英语 #高中英语教资 #初中英语教资 #英语教资笔试\n六、一句话总结\n\n教资科三英语选择题大量考查语言学及教学法专有名词，建议直接背诵博主整理的 12 页核心单词并配合默写巩固。"}, {"idx": 5, "id": "6aacb6c6000000000b00237f", "title": "Hypit开源！一键克隆爆款视频！", "cat": "学习闭环", "sug": "keep", "reason": "保留判据2/3：'视频即代码'新范式正中其 Vibe Coding+AI 内容创作主线，含安装命令、GitHub 链接与适用边界判断，长期有效", "what": "Hypit 开源项目的架构深度拆解：把视频从时间轴工程变成挂在词语上的代码", "use": "机制：SVML 纯文本视频源文件+ Hook 把字幕/画面/特效绑定在具体词上，改台词只重排挂在其上的内容，可 Git 版本管理；安装命令 npx skills add hypit-ai/hypit -g，在 Claude Code/Codex 里 /hypit 调用；GitHub: hypit-ai/hypit，quickstart: hypit.ai；适合广告 Hook 变体、换 SKU、多语言分发等高频变体场景", "next": "最小下一步：在浏览器打开 Hypit 的 GitHub 仓库页面，浏览 README 和核心文档；复刻目标：不适用", "detail": "", "cost": "需 Node.js 22.15+/pnpm 和支持 Skill 的付费编程 Agent；接 Seedance/MiniMax 等生成模型按量计费，重复抽卡烧钱；人物一致性仍需人工审片", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# Hypit开源！一键克隆爆款视频！\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6aacb6c6000000000b00237f?xsec_token=ABS2-mC_45uPdinbAWtrNTQWK9ILwHb6xbrjFOo6gn-ps=&xsec_source=pc_user\n\n根据你引用的笔记内容，结合搜索到的公开资料，以下是 Hypit 项目的深度拆解。\n\n一、素材与想法\n​​素材来源​​：笔记未提及具体数据源或 API 接入方式。从补充资料来看，Hypit 支持接入 Seedance 等视频生成模型、WhisperX 语音转文字、FFmpeg 视频处理，以及第三方图片/视频生成 API，用户可自带模型（BYOK）。\n​​核心想法​​：传统 AI 视频生成要么让 Agent 操作剪辑软件（时间轴难稳定），要么直接写代码（换稿子要重写大量时间点）。Hypit 把这两条路合在一起——​​把视频的坐标从「秒」换成「词」​​，让字幕、画面、特效都挂在台词上，改一句词，时间轴自动重排。\n​​新在哪、省在哪、强在哪​​：\n​​新​​：不是又一个 AI 剪辑软件，而是一套面向 Claude Code、Codex 等 Coding Agent 的视频语言和编译系统，让 Agent 直接\"写\"视频。\n​​省​​：改台词只重排挂在被改词上的内容，换主播只重生成对应镜头，没动的部分一个字都不动；批量生成 100 个变体只需一条指令。\n​​强​​：视频变成可编辑代码工程，可进入 Git 做版本管理、diff 对比、随时回滚；支持 64 个无头 Chromium 并发渲染。\n二、实现方式与技术原理\n​​从 0 到成品的 5 步流程​​：\n​​拆结构​​：丢一条参考视频，Agent 拆出镜头、台词、字幕、B-roll、特效和节奏。\n​​写源文件​​：写成 SVML（纯文本格式），能 diff、能版本管理。\n​​换内容​​：换主播/换品/换语言，只改差异部分。\n​​生成素材​​（可选）：不调生成模型则模型费为 0。\n​​并发渲染​​：64 个无头 Chromium 同时出片。\n​​核心机制​​：​​Hook 机制​​把特效、空镜、字幕全部绑定在文字上，而非时间轴秒数。比如\"肌酸\"触发产品特写，字幕高亮、B-roll 都挂在它下面。改台词时，只有挂在被改那几个词上的东西重排。\n​​最有技术含量的一步​​：拆结构 + Hook 绑定。Agent 需要识别每个段落承担的任务（开场如何吸引注意、信息在哪个节点揭示、字幕怎样强调关键词、B-roll 何时补充证据），并把画面、字幕、动效与具体词语精准对齐。\n三、AI 与工具清单\n工具/模型\t负责什么\t免费/付费\nHypit\t开源视频语言和编译系统，把视频变成可编辑代码\t核心部分开源免费\nClaude Code\t编程 Agent，负责分析结构、编排轨道、渲染成片\t付费\nCodex\t编程 Agent，配合 Hypit 执行视频制作工作流\t付费\nWhisperX\t语音转文字，获取逐词时间戳\t开源免费\nFFmpeg\t视频处理与渲染\t开源免费\nSeedance\t视频生成模型（可选接入）\t按 API 收费\nMiniMax H3\t视频生成模型（可选接入）\t按秒收费（约 $0.08/秒）\n无头 Chromium\t并发渲染视频\t免费（需自备算力）\n四、项目来源与链接\n​​GitHub 地址​​：https://github.com/hypit-ai/hypit —— 开源项目仓库，提供完整代码和文档。\n​​官方快速开始教程​​：https://hypit.ai/quickstart\n​​官方 X（Twitter）​​：https://x.com/cccyd_qwq/status/2099545996766388304?s=20\n​​是否基于开源项目二次创作​​：Hypit 本身是开源项目，不是基于其他开源项目二次创作。\n五、视频中出现的提示词/指令\n\n视频中未出现具体提示词。但补充资料中给出了一个可用请求示例：\n\n/path/to/video.mp4，参考这个视频，把产品换成 Hypit，保留开场的悬念和 Ranking 呈现方式；输出 9:16 中文版本，准备 3 个不同 Hook。\n\n这个请求同时交代了参考对象、改编目标、保留项、画幅、语言和变体数。\n\n六、复现指南\n​​前置条件​​：\nNode.js 22.15+ / pnpm 10.33\n一个支持 Skill 的编程 Agent（Claude Code、Codex、Openclaw、Hermes 等）\n第三方模型 API Key（如需要生成视频/图片/语音）\n一定的命令行和编程基础\n​​最简行动清单​​：\n在终端执行安装命令：npx skills add hypit-ai/hypit -g\n打开任意支持的 Agent，输入 /hypit 引用 Skill\n给 Agent 一条参考视频链接或文件，加上你的改编需求\n决定是否需要花模型费（只用字幕、动效和代码画面可零模型成本）\n给机器留足算力，64 并发不是玩笑\n​​难点与坑​​：\n​​不是网页工具​​：不能打开浏览器直接用，必须配环境和 Agent。\n​​模型成本​​：视频生成通常比图片、字幕和代码渲染贵，重复抽卡会快速消耗预算。\n​​审片成本​​：Agent 可以生成和编排，但人物一致性、品牌准确性、字幕可读性仍需人工检查。\n​​上游波动​​：第三方模型可能遇到认证、额度、限流或服务异常，构建流程需要保留中间结果以便重试。\n​​首条视频仍需时间​​：参考视频越复杂，结构分析、素材准备和样式修正所需时间越多，优势在第二条、第三条变体才逐渐体现。\n七、总结\n\nHypit 的核心突破是把视频从\"时间轴上的二进制文件\"变成\"挂在词上的代码工程\"，让 AI Agent 能像写代码一样复刻和批量改造视频。它适合结构稳定、内容高频变体的场景（如广告 Hook 变体、带货换 SKU、多语言分发），但不适合逐帧调色或一次性艺术短片。\n\n如果你打算尝试，建议先挑一条你数据最好的视频喂进去，让 Agent 复刻出 5 个变体跑跑看，再决定是否深入配置。"}, {"idx": 6, "id": "6abb11620000000015007d2c", "title": "代码小白写的第一款小游戏", "cat": "复刻闭环", "sug": "keep", "reason": "保留判据3（「AI+小游戏+广告变 并未确认具体设备型号或是否为广告。"}, {"idx": 8, "id": "6abe288900000000130193be", "title": "接新班的第一天，班主任就要把班风给搞好", "cat": "学习闭环", "sug": "keep", "reason": "保留判据3（直接命中他的教师主线：开学定调班风、学生心理、小团体干预的具体话术与动作，拿来就能用，也可转化为心理课与家长会素材）", "what": "青少年心理咨询师陈默讲班主任如何在接新班第一天立班风、消除学生恐惧", "use": "可直接落地的第一天定调话术 5 句（五百年修得缘分/人格平等/让爱在班级流动/尊重老师的安排/不打击人格）；隐形干预小团体的做法（活动分组刻意打散、不向学生解释「老师的谱子」）；第一名给最后一名讲一刻钟难题；鼓励比表扬更重要；推荐《班主任学生管理的训练手册》18 个工具含练习题", "next": "最小下一步：搜索并查看《班主任学生管理训练手册》的目录或试读章节；复刻目标：不适用", "detail": "", "cost": "无", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 接新班的第一天，班主任就要把班风给搞好\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6abe288900000000130193be?xsec_token=ABumg9q87n_7V55Ox85w1ecweS4XtPl1vdNNjNHtNuiNw=&xsec_source=pc_user\n\n根据你引用的笔记，这是​​陈默​​老师在​​一席少年·教育论坛​​上的演讲分享，主题围绕班主任如何在开学第一天建立良好班风、消除学生恐惧。以下是完整细致的整理：\n\n一、内容定位\n​​领域​​：教育 / 青少年心理 / 班主任管理\n​​作者身份​​：陈默，多年临床经验的青少年心理咨询师，2007年出版《孩子，你怎么了》，长期关注青少年困境与家庭问题\n​​想教会观众什么​​：新班主任在接新班的第一天，就要主动把班风立起来，消除学生\"怕被欺负\"的恐惧，通过人格平等、互帮互助、尊重安排等方式，构建一个有爱的班级环境\n二、内容详细讲解\n\n​​1. 引出问题：小团体现象是否需要干预​​陈默提到，班里的女生个体都很善良可爱，但玩的时候聚成一堆。比如两个人特别好、三个人特别好，这两三个人之间没有恶交，但也没有形成特别好的关系。全班假设12个女孩子，如果\"我\"跟其中一位同学是很好的朋友，那这个同学如果不参加某种活动，\"我\"也不参加。这种同伴关系需不需要老师干预？怎么做？\n\n​​2. 消除恐惧：开学第一天立班风​​\n\n每个要上初中的小孩，心里面都会恐慌，他不知道进这个新班有没有人会欺负他\n班主任可以在进班级的第一天、组成新班的第一天，把这种恐惧消除掉\n第一天告诉所有同学：我们组成新班了，所有同学都是​​五百年修得缘分​​，今天才在这里做同学，友谊是多么可贵。40多岁以后，马路上遇到会互相拥抱的，是很难得的一种关系，你们可能会成为一辈子的好朋友\n\n​​3. 建立班风：人格平等与爱的流动​​\n\n班级里有个性内向的、外向的，有你喜欢的、不喜欢的，有愿意说话的、不愿意说话的，这很正常\n​​但我们的人格是平等的​​，一定要记住，要尊重他人，尊重别人的人格\n在一起玩的时候，把爱拿出来给别人，别人把爱传递到你这边，这个班就是流动的，那边是爱\n\n​​4. 互帮互助：让爱在班级流动​​\n\n这次考试第一名的A同学，比如语文第一名，能不能给语文最后一名的同学​​一刻钟的时间​​，跟他讲讲最难的一道题是怎么做出来的\n数学考了第一名的同学，能不能给考了最后一名的同学讲一讲，数学最难题是怎么做出来的\n帮助弱者，把爱流动在这个班级里面，​​不要出现对人家人格进行打击、人格进行侮辱​​，老师不要看到这样的班级、这样的班风\n\n​​5. 尊重安排：打破小团体，锻炼合作能力​​\n\n这个年龄段好伙伴是形影不离的，一起上卫生间、一起吃饭，什么都形影不离\n但班级组成活动的时候，老师会安排，可能不见得是你的好朋友跟你安排在一个小组里\n​​老师的安排自有老师的谱子​​，不可能把这个谱子讲给每一个同学听。比如外向的同学旁边坐的是内向的同学，老师不会明说\n在集体活动的时候，你可能会旁边那个不是你形影不离的闺蜜，那么试试跟非闺蜜也能合作得好一点\n如果跟非闺蜜也合作得好一点，合作能力就很强，在初中里就是来锻炼这种能力的\n\n​​6. 第一天讲清楚，后续就轻松​​\n\n第一天就跟学生讲清楚，他们以后在班级里就知道同学之间应该怎么处\n做班主任第一天跟学生讲清楚要建立什么样的班级，其实是很要紧的\n\n​​7. 工具推荐​​\n\n推荐看《班主任学生管理的训练手册》，里面写了​​18个班主任的工具​​，每个工具都要会用\n比如：班会你会开吗？家长会你会开吗？班规你会制作吗？家访你会做吗？学生谈话应该怎么谈？当今的孩子是什么特点？\n18个工具全部看完，后面有练习题让你做，一定会轻松很多\n三、核心知识点\n​​关键结论​​：班主任接新班的第一天，必须主动立班风、消除学生\"怕被欺负\"的恐惧，这是后续班级管理的基础\n​​容易搞错的点​​：\n不要等小团体形成、矛盾出现再去干预，要在开学第一天就提前布局\n不要只靠口头说教，要用具体行动（如安排优生帮差生）让\"爱流动\"起来\n不要跟学生解释\"为什么这么安排座位\"，老师有自己的谱子，保持边界感\n​​作者的个人经验​​：\n强调\"人格平等\"是班风的核心，任何打击人格、侮辱人格的行为都不能容忍\n班主任的软实力在于处理问题的情商，情商高的老师大事变小事，小事变没；情商低的老师小事变大事，大事变翻船\n鼓励比表扬更重要：表扬是\"你比别人做得好\"，鼓励是\"你没有功劳也有苦劳\"，让成绩差的学生也能感受到被看见\n四、视频中出现的提示词/操作文字\n\n视频中未出现AI提示词、搜索词或软件指令类内容。\n\n五、实用信息清单\n​​《班主任学生管理的训练手册》​​：陈默著，上海教育出版社出版，包含18个班主任实用工具（班会、家长会、班规制作、家访、学生谈话等），每章有练习题\n​​《孩子，你怎么了》​​：陈默著，2007年出版，聚焦青少年心理困境与家庭问题\n​​开学第一天立班风5句话​​：\n\"我们五百年修得缘分，今天才在这里做同学\"\n\"我们的人格是平等的，要尊重他人\"\n\"把爱拿出来给别人，让爱在班级流动\"\n\"老师安排座位和活动有谱子，配合老师就是锻炼合作能力\"\n\"不要对人家人格进行打击和侮辱\"\n六、一句话总结最值得收藏的点\n\n​​开学第一天就立好\"人格平等、互帮互助、尊重安排\"的班风基调，比等问题出现再去干预有效得多。​​\n\n补充一点，从评论区可以看到，有老师认为这种\"爱的传递\"方式更适合学生素质较高的环境，而在一些地方班主任可能更需要先立规矩、有魄力。也有家长觉得现在的孩子听了可能会冷笑。但整体来看，陈默的核心逻辑是​​在事情发生之前先定调子、做隐形干预​​，这个思路对很多班主任是有参考价值的。"}, {"idx": 9, "id": "6aac326d000000002a0256a0", "title": "近期几个Free大模型平台", "cat": "复刻闭环", "sug": "drop", "reason": "删除判据1（免费额度/限免活动是会过时情报，命中即删），且额度方案与他的无限镜像版和订阅通道重叠，附删除判据8。", "what": "免费大模型平台盘点：xKiro 送 3000 万 token、FreeBuff 每日 6 小时、Union Alpha 限时免费。", "use": "仅平台名与额度参数（兼容 OpenAI 接口、GitHub 注册、上下文长度），作者自己都没实测，靠评论区补体验。", "next": "最小下一步：注册 xKiro 并测试其 100 万上下文与免费 Token 是否真实可用；复刻目标：验证 xKiro 的 3000 万免费 Token 与 100 万上下文是否真实可用，以及 FreeBuff 每日 6 小时免费时长的实际体验", "detail": "", "cost": "全是限免额度情报，官方随时调整（分析注明 Union Alpha 免费期约一周）；免费通道可能把数据转发给上游厂商，有隐私风险。", "quote": "", "quote_src": "", "text": "# v3-分区版 v3\n# 近期几个Free大模型平台\n# https://www.xiaohongshu.com/user/profile/6292cc04000000002102272a/6aac326d000000002a0256a0?xsec_token=ABS2-mC_45uPdinbAWtrNTQVhR1gRppYJhEcWdN_8OTiY=&xsec_source=pc_user\n\n根据你引用的笔记，我帮你把这条关于免费大模型平台的笔记内容完整整理出来了。\n\n一、内容定位\n​​领域​​：AI 工具 / 大模型平台 / 开发者资源\n​​作者身份​​：AI 工具测评与分享者（标签为 #AI搞事业howto）\n​​核心目的​​：向观众分享近期发现的
